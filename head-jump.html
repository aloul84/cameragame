<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>التوأم الرقمي - تفادي الحواجز برأسك</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0c10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* نافذة الكاميرا المصغرة */
        #cameraContainer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 160px;
            height: 120px;
            border: 3px solid #66fcf1;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.5);
            background: #000;
            z-index: 10;
        }

        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.6;
        }

        /* شاشات واجهة المستخدم */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(11, 12, 16, 0.95);
            color: white;
            z-index: 20;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #66fcf1;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.7);
        }

        p {
            font-size: 1.3rem;
            margin-bottom: 25px;
            color: #c5c6c7;
            max-width: 80%;
            line-height: 1.6;
        }

        button {
            padding: 15px 45px;
            font-size: 1.6rem;
            background-color: #45a29e;
            color: #fff;
            border: 2px solid #66fcf1;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.4);
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #66fcf1;
            color: #0b0c10;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.8);
        }

        button:active {
            transform: scale(0.95);
        }

        .hidden { display: none !important; }

        .loader {
            border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid #66fcf1;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #warningMsg {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.7);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 15;
            display: none;
        }
    </style>
</head>
<body>

    <div id="uiOverlay" class="overlay">
        <div id="loader" class="loader"></div>
        <h1 id="uiTitle">تجهيز لعبة التوأم الرقمي...</h1>
        <p id="uiDesc">ننتظر موافقتك لتشغيل الكاميرا الأمامية.</p>
        <button id="startBtn" class="hidden">العب الآن</button>
    </div>

    <div id="warningMsg">يرجى الوقوف أمام الكاميرا بالكامل!</div>

    <div id="cameraContainer">
        <video id="videoElement" autoplay playsinline></video>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script type="module">
        import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js";

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const videoElement = document.getElementById('videoElement');
        const uiOverlay = document.getElementById('uiOverlay');
        const uiTitle = document.getElementById('uiTitle');
        const uiDesc = document.getElementById('uiDesc');
        const loader = document.getElementById('loader');
        const startBtn = document.getElementById('startBtn');
        const warningMsg = document.getElementById('warningMsg');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let gameState = 'INIT';
        let poseLandmarker = null;
        let lastVideoTime = -1;
        let currentLandmarks = null;

        // متغيرات اللعبة الجديدة
        let score = 0;
        let lives = 3;
        let items = [];
        let frameCount = 0;
        let hitCooldown = 0; // حماية مؤقتة بعد الاصطدام بعنصر خطير

        // موقع شخصية اللاعب الافتراضي
        let playerY = height / 2;
        let targetPlayerY = height / 2;

        const colors = {
            main: '#66fcf1',
            dark: '#45a29e',
            body: '#1f2833',
            danger: '#ff4d4d', // أحمر واضح للعناصر الخطرة
            good: '#00ffcc'    // أخضر ساطع للعناصر الجيدة
        };

        async function initAI() {
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
                );
                
                poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 1,
                    minPoseDetectionConfidence: 0.5,
                    minPosePresenceConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480, facingMode: 'user' }
                });
                
                videoElement.srcObject = stream;
                
                videoElement.addEventListener("loadeddata", () => {
                    videoElement.play();
                    uiTitle.innerText = "جاهز للتحدي!";
                    uiDesc.innerHTML = "حرك رأسك للأعلى ولأسفل لتحريك شخصيتك!<br>اجمع المكافآت الخضراء وتفادى الأخطار الحمراء.";
                    loader.classList.add('hidden');
                    startBtn.classList.remove('hidden');
                });
                
            } catch(err) {
                uiTitle.innerText = "تعذر فتح الكاميرا";
                uiTitle.style.color = "#ff5252";
                uiDesc.innerHTML = "يرجى التأكد من السماح للمتصفح باستخدام الكاميرا.";
                loader.classList.add('hidden');
                console.error(err);
            }
        }

        startBtn.addEventListener('click', () => {
            uiOverlay.classList.add('hidden');
            score = 0;
            lives = 3;
            items = [];
            frameCount = 0;
            gameState = 'PLAYING';
            requestAnimationFrame(gameLoop);
        });

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            initAI();
        } else {
            uiTitle.innerText = "المتصفح غير مدعوم";
            loader.classList.add('hidden');
        }

        function drawBackground() {
            ctx.fillStyle = '#0b0c10';
            ctx.fillRect(0, 0, width, height);
            ctx.strokeStyle = 'rgba(102, 252, 241, 0.04)';
            ctx.lineWidth = 1;
            
            for (let i = 0; i < width; i += 60) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke();
            }
            for (let i = 0; i < height; i += 60) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke();
            }
        }

        function spawnItem() {
            const isDanger = Math.random() < 0.45; // 45% خطر، 55% عناصر جيدة
            const size = 45;
            const yPos = Math.random() * (height - 250) + 120;
            
            items.push({
                x: width + 60,
                y: yPos,
                size: size,
                isDanger: isDanger,
                speed: 6 + Math.min(score * 0.1, 7) // تزداد السرعة مع زيادة النقاط
            });
        }

        function drawPlayer(x, y) {
            // تأثير وميض أحمر عند الاصطدام
            let renderColor = colors.main;
            if (hitCooldown > 0 && Math.floor(hitCooldown / 5) % 2 === 0) {
                renderColor = '#ff0000';
            }

            // رسم الشخصية المبسطة المتسقة مع الحركة العمودية
            ctx.beginPath();
            ctx.arc(x, y, 35, 0, Math.PI * 2);
            ctx.fillStyle = colors.body;
            ctx.fill();
            ctx.strokeStyle = renderColor;
            ctx.lineWidth = 4;
            ctx.stroke();

            // عيون مضيئة
            ctx.beginPath();
            ctx.arc(x - 12, y - 5, 6, 0, Math.PI * 2);
            ctx.arc(x + 12, y - 5, 6, 0, Math.PI * 2);
            ctx.fillStyle = renderColor;
            ctx.shadowColor = renderColor;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;

            // توضيح منطقة رأس اللاعب (منطقة الاصطدام)
            ctx.beginPath();
            ctx.arc(x, y - 45, 20, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function updateGame() {
            frameCount++;
            if (hitCooldown > 0) hitCooldown--;

            // توليد عناصر جديدة كل فترة
            if (frameCount % 75 === 0) {
                spawnItem();
            }

            // تحديث مكان الرأس (اللاعب يثبت في ثلث الشاشة من اليسار، ويتحرك عمودياً برأسه)
            if (currentLandmarks) {
                // نقطة الأنف (رقم 0 في Mediapipe)
                const nose = currentLandmarks[0];
                targetPlayerY = nose.y * height;
            }
            // حركة تنعيم الانتقال للشخصية
            playerY += (targetPlayerY - playerY) * 0.2;
            // تقييد حركة اللاعب داخل حدود الشاشة
            playerY = Math.max(100, Math.min(height - 100, playerY));

            const playerX = width * 0.25;
            const headCollisionRadius = 30; // نطاق اصطدام رأس اللاعب

            // تحديث ومتحركات العناصر
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.x -= item.speed;

                // فحص الاصطدام برأس اللاعب فقط
                const dx = playerX - item.x;
                const dy = (playerY - 45) - item.y; // رأس الشخصية أعلى بقليل من مركزها
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < headCollisionRadius + item.size / 2) {
                    if (item.isDanger) {
                        // اصطدام بعنصر خطر
                        if (hitCooldown === 0) {
                            lives--;
                            hitCooldown = 40; // مدة الحماية المؤقتة
                            if (lives <= 0) {
                                gameState = 'GAMEOVER';
                            }
                        }
                    } else {
                        // جمع عنصر جيد
                        score += 10;
                    }
                    items.splice(i, 1);
                    continue;
                }

                // إزالة العنصر إذا خرج من الشاشة اليسرى
                if (item.x < -60) {
                    items.splice(i, 1);
                }
            }
        }

        function drawUI() {
            // رسم النقاط
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px Tahoma';
            ctx.textAlign = 'right';
            ctx.fillText(`النقاط: ${score}`, width - 40, 50);

            // رسم القلوب (عدد المحاولات)
            ctx.textAlign = 'left';
            let heartsStr = '';
            for (let i = 0; i < lives; i++) heartsStr += '❤️ ';
            ctx.font = '24px Tahoma';
            ctx.fillText(`المحاولات: ${heartsStr}`, 40, 50);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '18px Tahoma';
            ctx.textAlign = 'center';
            ctx.fillText('حرك رأسك للأعلى ولأسفل لتفادي الحواجز الحمراء وجمع العناصر الخضراء برأسك!', width / 2, height - 30);
        }

        function gameLoop() {
            if (gameState === 'PLAYING' && poseLandmarker) {
                if (videoElement.currentTime !== lastVideoTime) {
                    lastVideoTime = videoElement.currentTime;
                    const results = poseLandmarker.detectForVideo(videoElement, performance.now());
                    if (results.landmarks && results.landmarks.length > 0) {
                        currentLandmarks = results.landmarks[0];
                    }
                }

                ctx.clearRect(0, 0, width, height);
                drawBackground();

                if (currentLandmarks) {
                    warningMsg.style.display = 'none';
                } else {
                    warningMsg.style.display = 'block';
                }

                updateGame();

                // رسم العناصر المندفعة من اليمين لليسار
                for (let item of items) {
                    ctx.save();
                    ctx.translate(item.x, item.y);
                    
                    if (item.isDanger) {
                        // رسم عنصر خطر (مستطيل/شاحذ أحمر مع إشارة X)
                        ctx.fillStyle = colors.danger;
                        ctx.shadowColor = colors.danger;
                        ctx.shadowBlur = 15;
                        ctx.fillRect(-item.size/2, -item.size/2, item.size, item.size);
                        
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(-10, -10); ctx.lineTo(10, 10);
                        ctx.moveTo(10, -10); ctx.lineTo(-10, 10);
                        ctx.stroke();
                    } else {
                        // رسم عنصر جيد (دائرة خضراء مضيئة مع علامة +)
                        ctx.beginPath();
                        ctx.arc(0, 0, item.size/2, 0, Math.PI * 2);
                        ctx.fillStyle = colors.good;
                        ctx.shadowColor = colors.good;
                        ctx.shadowBlur = 20;
                        ctx.fill();

                        ctx.strokeStyle = '#0b0c10';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(-12, 0); ctx.lineTo(12, 0);
                        ctx.moveTo(0, -12); ctx.lineTo(0, 12);
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                drawPlayer(width * 0.25, playerY);
                drawUI();

                requestAnimationFrame(gameLoop);
            } else if (gameState === 'GAMEOVER') {
                ctx.fillStyle = 'rgba(11, 12, 16, 0.85)';
                ctx.fillRect(0, 0, width, height);
                
                uiTitle.innerText = "انتهت اللعبة!";
                uiTitle.style.color = "#ff4d4d";
                uiDesc.innerHTML = `لقد جمعت: <b>${score}</b> نقطة.`;
                startBtn.innerText = "العب مرة أخرى";
                uiOverlay.classList.remove('hidden');
            }
        }
    </script>
    <script src="remote-nav.js"></script>
</body>
</html>
