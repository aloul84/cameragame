<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نيون هوكي - ضد الحاسوب</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="game-common.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050510;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game-container {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #13132b 0%, #050510 100%);
        }
        #video-feed {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; transform: scaleX(-1); opacity: 0.2; z-index: 1;
        }
        #game-canvas { position: absolute; top: 0; left: 0; z-index: 2; }

        #panel {
            position: absolute; z-index: 10;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: min(92vw, 520px);
            max-height: 94vh; overflow-y: auto;
            background: rgba(10, 10, 25, 0.88);
            backdrop-filter: blur(10px);
            border: 2px solid #a855f7;
            border-radius: 1rem;
            padding: clamp(14px, 4vw, 32px);
            text-align: center;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
        }
        #panel h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 8vw, 3rem); font-weight: 800; color: #f3e8ff; text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7; }
        #panel p { margin: 0 0 12px; color: #cbd5e1; line-height: 1.6; font-size: clamp(0.9rem, 3.4vw, 1.1rem); }
        .pink { color: #f472b6; } .cyan { color: #22d3ee; }

        .btn {
            font-family: inherit;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white; font-size: clamp(1.05rem, 4.4vw, 1.3rem); font-weight: bold;
            padding: 0.8rem 2.4rem; border: none; border-radius: 9999px; cursor: pointer;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6); transition: transform 0.15s;
        }
        .btn:hover, .btn:active { transform: scale(1.05); }
        #chips { display: flex; gap: 8px; justify-content: center; margin: 0 0 14px; }
        .chip {
            font-family: inherit; font-size: 1rem; font-weight: bold; color: #e9d5ff;
            background: rgba(168,85,247,0.15); border: 2px solid rgba(168,85,247,0.6);
            border-radius: 12px; padding: 8px 16px; cursor: pointer;
        }
        .chip.sel { background: #a855f7; color: #fff; box-shadow: 0 0 14px rgba(168,85,247,0.9); }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1); width: 44px; height: 44px; border-radius: 50%;
            border-left-color: #a855f7; animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }

        @media (max-height: 460px) { #panel p { margin-bottom: 6px; } #panel h1 { margin-bottom: 4px; } }
    </style>
</head>
<body>

    <div id="game-container">
        <video id="video-feed" autoplay playsinline muted></video>
        <canvas id="game-canvas"></canvas>

        <div id="panel">
            <h1 id="panel-title">نيون هوكي</h1>
            <p id="panel-desc"><span class="pink">أنت</span> ضد <span class="cyan">الحاسوب</span>. حرّك يدك أمام الكاميرا (أو اسحب بإصبعك) لصد القرص وتسجيل الأهداف.<br>أول من يسجل 5 أهداف يفوز!</p>
            <div id="loading-indicator">
                <div class="spinner"></div>
                <p>جاري تشغيل الكاميرا والذكاء الاصطناعي...</p>
            </div>
            <div id="chips" class="hidden">
                <button class="chip" data-d="easy">سهل</button>
                <button class="chip sel" data-d="medium">متوسط</button>
                <button class="chip" data-d="hard">صعب</button>
            </div>
            <p id="stats" class="hidden"></p>
            <button id="start-btn" class="btn hidden">بدء التحدي</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const panel = document.getElementById('panel');
        const panelTitle = document.getElementById('panel-title');
        const panelDesc = document.getElementById('panel-desc');
        const loadingIndicator = document.getElementById('loading-indicator');
        const startBtn = document.getElementById('start-btn');
        const chips = document.getElementById('chips');
        const statsEl = document.getElementById('stats');
        const input = GC.input;

        /* منطق اللعبة يعمل في ملعب أفقي (W x H). في الجوال الطولي نُدير الرسم 90° فيصبح مرمى اللاعب بالأسفل */
        let W = 800, H = 450, S = 1, portrait = false;

        const WINNING_SCORE = 5;
        const DIFF = {
            easy:   { speed: 4.0, err: 0.18, chase: false, label: 'سهل' },
            medium: { speed: 6.2, err: 0.08, chase: true,  label: 'متوسط' },
            hard:   { speed: 8.8, err: 0.03, chase: true,  label: 'صعب' }
        };
        let diff = 'medium';

        let phase = 'MENU';          // MENU, SERVE, PLAY, OVER
        let serveUntil = 0;
        let serveText = '';
        let serveDir = 1;
        let p1Score = 0, p2Score = 0;
        let particles = [];
        let trail = [];
        let aiErr = 0, aiErrAt = 0;
        let cameraStatus = 'loading';

        const p1 = { x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, r: 30, color: '#ec4899' };
        const p2 = { x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, r: 30, color: '#06b6d4' };
        const puck = { x: 0, y: 0, vx: 0, vy: 0, r: 14, color: '#10b981', maxSpeed: 25 };

        function sizes() {
            S = H / 600;
            p1.r = p2.r = Math.max(26, H * 0.075);
            puck.r = Math.max(12, H * 0.033);
            puck.maxSpeed = 26 * S;
        }

        GC.fitCanvas(canvas, (w, h) => {
            const oW = W, oH = H;
            portrait = h > w;
            W = portrait ? h : w;
            H = portrait ? w : h;
            sizes();
            const fx = W / oW, fy = H / oH;
            [p1, p2, puck].forEach(o => { o.x *= fx; o.y *= fy; });
            p1.px = p1.x; p1.py = p1.y; p2.px = p2.x; p2.py = p2.y;
            trail = [];
            if (phase === 'MENU') resetPositions();
        });

        function resetPositions() {
            p1.x = p1.px = W * 0.12; p1.y = p1.py = H / 2;
            p2.x = p2.px = W * 0.88; p2.y = p2.py = H / 2;
            puck.x = W / 2; puck.y = H / 2; puck.vx = puck.vy = 0;
        }

        /* ---------------- الصوت ---------------- */
        const AudioSys = {
            ready: false,
            async init() {
                if (this.ready || typeof Tone === 'undefined') return;
                try { await Tone.start(); } catch (e) { return; }

                this.bgmSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'sawtooth' },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 }
                }).toDestination();
                this.bgmSynth.volume.value = -20;
                const bassline = ['C2', 'C2', 'G2', 'C2', 'D#2', 'C2', 'F2', 'D2'];
                let step = 0;
                this.bgmLoop = new Tone.Loop((time) => {
                    this.bgmSynth.triggerAttackRelease(bassline[step % bassline.length], '8n', time);
                    step++;
                }, '16n');

                this.hitSynth = new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 4, oscillator: { type: 'sine' } }).toDestination();
                this.hitSynth.volume.value = -5;
                this.wallSynth = new Tone.MetalSynth({
                    frequency: 200, envelope: { attack: 0.001, decay: 0.1, release: 0.01 },
                    harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5
                }).toDestination();
                this.wallSynth.volume.value = -18;
                this.goalSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'square' }, envelope: { attack: 0.05, decay: 0.5, sustain: 0.2, release: 1 }
                }).toDestination();
                this.goalSynth.volume.value = -12;
                this.winSynth = new Tone.PolySynth(Tone.Synth).toDestination();
                this.winSynth.volume.value = -6;
                Tone.Transport.bpm.value = 130;
                Tone.Transport.start();
                this.ready = true;
            },
            playBGM() { if (this.ready) { this.bgmLoop.stop(); this.bgmLoop.start(0); } },
            stopBGM() { if (this.ready) this.bgmLoop.stop(); },
            // تُستدعى من الأحداث السريعة؛ نحمي من أخطاء Tone المتعلقة بالتوقيت المتقارب
            safe(fn) { if (!this.ready) return; try { fn(); } catch (e) { /* تجاهل */ } },
            playHit() { this.safe(() => this.hitSynth.triggerAttackRelease('G2', '8n')); },
            playWall() { this.safe(() => this.wallSynth.triggerAttackRelease('32n')); },
            playGoal() {
                this.safe(() => {
                    const now = Tone.now();
                    this.goalSynth.triggerAttackRelease(['C4', 'E4', 'G4'], '4n', now);
                    this.goalSynth.triggerAttackRelease(['G4', 'B4', 'D5'], '4n', now + 0.2);
                });
            },
            playWin() {
                this.safe(() => {
                    const now = Tone.now();
                    this.winSynth.triggerAttackRelease(['C4', 'E4', 'G4', 'C5'], '2n', now);
                    this.winSynth.triggerAttackRelease(['F4', 'A4', 'C5', 'F5'], '2n', now + 0.5);
                    this.winSynth.triggerAttackRelease(['G4', 'B4', 'D5', 'G5'], '1n', now + 1.0);
                });
            }
        };

        /* ---------------- المؤثرات ---------------- */
        function explode(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y, color,
                    vx: (Math.random() - 0.5) * 15 * S, vy: (Math.random() - 0.5) * 15 * S,
                    life: 1, decay: Math.random() * 0.03 + 0.02, size: (Math.random() * 6 + 2) * Math.max(0.7, S)
                });
            }
        }

        /* ---------------- التحكم ---------------- */
        function inputLogical() {
            // من إحداثيات الشاشة إلى إحداثيات الملعب الأفقي
            let x = portrait ? W - input.y : input.x;
            const y = portrait ? input.x : input.y;
            if (input.mode === 'hand') x *= 0.5; // اليد تغطي نصف ملعب اللاعب بالكامل
            return { x, y };
        }

        function updatePlayer(k) {
            p1.px = p1.x; p1.py = p1.y;
            if (input.active) {
                const t = inputLogical();
                const tx = Math.max(p1.r, Math.min(W / 2 - p1.r, t.x));
                const ty = Math.max(p1.r, Math.min(H - p1.r, t.y));
                const f = Math.min(1, 0.6 * k);
                p1.x += (tx - p1.x) * f;
                p1.y += (ty - p1.y) * f;
            }
            p1.vx = (p1.x - p1.px) / k;
            p1.vy = (p1.y - p1.py) / k;
        }

        function updateAI(k, now) {
            const d = DIFF[diff];
            p2.px = p2.x; p2.py = p2.y;
            if (now - aiErrAt > 600) { aiErrAt = now; aiErr = (Math.random() - 0.5) * 2 * d.err * H; }

            let tx = W - p2.r * 2.2, ty = H / 2;
            if (phase === 'PLAY') {
                if (puck.vx > 0.5 * S) {
                    // توقّع موضع القرص مع الارتدادات عن الجدران
                    const t = (tx - puck.x) / puck.vx;
                    const span = H - 2 * puck.r;
                    let y = puck.y - puck.r + puck.vy * t;
                    y = ((y % (2 * span)) + 2 * span) % (2 * span);
                    if (y > span) y = 2 * span - y;
                    ty = y + puck.r + aiErr;
                } else if (d.chase && puck.x > W / 2 && Math.abs(puck.vx) < 4 * S) {
                    tx = puck.x + p2.r * 0.5;
                    ty = puck.y;
                } else if (puck.x > W / 2) {
                    ty = puck.y * 0.5 + H * 0.25;
                }
            }

            const dx = tx - p2.x, dy = ty - p2.y, dist = Math.hypot(dx, dy);
            const sp = d.speed * S * k;
            if (dist > sp) { p2.x += dx / dist * sp; p2.y += dy / dist * sp; }
            else { p2.x = tx; p2.y = ty; }
            p2.x = Math.max(W / 2 + p2.r, Math.min(W - p2.r, p2.x));
            p2.y = Math.max(p2.r, Math.min(H - p2.r, p2.y));
            p2.vx = (p2.x - p2.px) / k;
            p2.vy = (p2.y - p2.py) / k;
        }

        /* ---------------- الفيزياء ---------------- */
        function paddleHit(p) {
            const dx = puck.x - p.x, dy = puck.y - p.y;
            const dist = Math.hypot(dx, dy) || 0.001;
            if (dist >= puck.r + p.r) return;
            const nx = dx / dist, ny = dy / dist;
            puck.x = p.x + nx * (puck.r + p.r);
            puck.y = p.y + ny * (puck.r + p.r);

            const dot = puck.vx * nx + puck.vy * ny;
            if (dot < 0) { puck.vx -= 2 * dot * nx; puck.vy -= 2 * dot * ny; }
            puck.vx += p.vx * 0.6;
            puck.vy += p.vy * 0.6;

            let sp = Math.hypot(puck.vx, puck.vy);
            const minSp = 6 * S;
            if (sp < minSp) { puck.vx = nx * minSp; puck.vy = ny * minSp; sp = minSp; }
            if (sp > puck.maxSpeed) { puck.vx *= puck.maxSpeed / sp; puck.vy *= puck.maxSpeed / sp; }

            AudioSys.playHit();
            GC.vibrate(15);
            explode(puck.x, puck.y, p.color, 10);
        }

        function updatePuck(k) {
            // خطوات صغيرة حتى لا يخترق القرص المضرب أو الجدار عند السرعات العالية
            const steps = Math.max(1, Math.ceil(Math.hypot(puck.vx, puck.vy) * k / (puck.r * 0.8)));
            for (let i = 0; i < steps; i++) {
                puck.x += puck.vx * k / steps;
                puck.y += puck.vy * k / steps;

                if (puck.y - puck.r < 0) { puck.y = puck.r; puck.vy = Math.abs(puck.vy); AudioSys.playWall(); }
                else if (puck.y + puck.r > H) { puck.y = H - puck.r; puck.vy = -Math.abs(puck.vy); AudioSys.playWall(); }

                paddleHit(p1);
                paddleHit(p2);

                const goalTop = H * 0.25, goalBottom = H * 0.75;
                if (puck.x - puck.r < 0) {
                    if (puck.y > goalTop && puck.y < goalBottom) { scored(2); return; }
                    puck.x = puck.r; puck.vx = Math.abs(puck.vx); AudioSys.playWall();
                } else if (puck.x + puck.r > W) {
                    if (puck.y > goalTop && puck.y < goalBottom) { scored(1); return; }
                    puck.x = W - puck.r; puck.vx = -Math.abs(puck.vx); AudioSys.playWall();
                }
            }
            const f = Math.pow(0.9985, k);
            puck.vx *= f; puck.vy *= f;
        }

        function scored(who) {
            if (who === 1) { p1Score++; explode(W, puck.y, p1.color, 40); }
            else { p2Score++; explode(0, puck.y, p2.color, 40); }
            AudioSys.playGoal();
            GC.vibrate(60);
            puck.vx = puck.vy = 0;
            puck.x = W / 2; puck.y = H / 2;
            trail = [];

            if (p1Score >= WINNING_SCORE || p2Score >= WINNING_SCORE) { endGame(); return; }
            serveDir = who === 1 ? 1 : -1; // يُرمى القرص نحو من استقبل الهدف
            beginServe(who === 1 ? 'هدف! 🎉' : 'هدف للحاسوب 🤖', 1800);
        }

        function beginServe(text, ms) {
            phase = 'SERVE';
            serveText = text;
            serveUntil = performance.now() + ms;
        }

        function launch() {
            let angle = (Math.random() * Math.PI / 4) - (Math.PI / 8);
            if (serveDir < 0) angle += Math.PI;
            const sp = 8 * S;
            puck.vx = Math.cos(angle) * sp;
            puck.vy = Math.sin(angle) * sp;
            phase = 'PLAY';
        }

        function endGame() {
            phase = 'OVER';
            AudioSys.stopBGM();
            AudioSys.playWin();
            const won = p1Score >= WINNING_SCORE;
            if (won) GC.store.set('hockey_wins', GC.store.get('hockey_wins') + 1);
            panelTitle.textContent = won ? 'أنت فزت! 🎉' : 'الحاسوب فاز! 🤖';
            panelDesc.innerHTML = `النتيجة النهائية<br><b style="font-size:1.6em">${p1Score} - ${p2Score}</b>`;
            startBtn.textContent = 'تحدٍ جديد';
            showPanel();
        }

        function showPanel() {
            loadingIndicator.classList.add('hidden');
            chips.classList.remove('hidden');
            startBtn.classList.remove('hidden');
            const wins = GC.store.get('hockey_wins');
            statsEl.textContent = wins ? `🏆 انتصاراتك: ${wins}` : '';
            statsEl.classList.toggle('hidden', !wins);
            panel.classList.remove('hidden');
        }

        chips.addEventListener('click', (e) => {
            const b = e.target.closest('.chip');
            if (!b) return;
            diff = b.dataset.d;
            chips.querySelectorAll('.chip').forEach(c => c.classList.toggle('sel', c === b));
        });

        async function startGame() {
            await AudioSys.init();
            p1Score = p2Score = 0;
            particles = []; trail = [];
            resetPositions();
            panel.classList.add('hidden');
            serveDir = 1;
            beginServe('استعد!', 1800);
            AudioSys.playBGM();
        }
        startBtn.addEventListener('click', startGame);

        /* ---------------- الرسم ---------------- */
        function drawArena() {
            const gt = H * 0.25, gb = H * 0.75;
            ctx.strokeStyle = 'rgba(168, 85, 247, 0.6)';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(0, gt); ctx.moveTo(0, gb); ctx.lineTo(0, H);
            ctx.moveTo(W, 0); ctx.lineTo(W, gt); ctx.moveTo(W, gb); ctx.lineTo(W, H);
            ctx.stroke();
            ctx.lineWidth = 6;
            ctx.shadowBlur = 15;
            ctx.strokeStyle = 'rgba(236, 72, 153, 0.9)'; ctx.shadowColor = '#ec4899';
            ctx.beginPath(); ctx.moveTo(0, gt); ctx.lineTo(0, gb); ctx.stroke();
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.9)'; ctx.shadowColor = '#06b6d4';
            ctx.beginPath(); ctx.moveTo(W, gt); ctx.lineTo(W, gb); ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 4;
            ctx.setLineDash([15, 15]);
            ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
            ctx.setLineDash([]);
            ctx.beginPath(); ctx.arc(W / 2, H / 2, H * 0.14, 0, Math.PI * 2); ctx.stroke();
        }

        function drawPaddle(p, dim) {
            ctx.globalAlpha = dim ? 0.45 : 1;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = p.color;
            ctx.shadowBlur = 20; ctx.shadowColor = p.color;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * 0.55, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.globalAlpha = 1;
        }

        function drawPuck() {
            for (let i = 0; i < trail.length; i++) {
                ctx.globalAlpha = (i + 1) / trail.length * 0.25;
                ctx.beginPath();
                ctx.arc(trail[i].x, trail[i].y, puck.r * (0.4 + 0.6 * (i + 1) / trail.length), 0, Math.PI * 2);
                ctx.fillStyle = puck.color;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.beginPath();
            ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = puck.color;
            ctx.shadowBlur = 25; ctx.shadowColor = puck.color;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function drawHud(now) {
            const w = GC.view.w, h = GC.view.h;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const fs = Math.max(48, Math.min(h, w) * 0.16);
            ctx.font = `bold ${fs}px Arial`;
            // مواضع الأرقام على الشاشة الفعلية (خارج دوران الملعب)
            const a = portrait ? { x: w * 0.12, y: h * 0.75 } : { x: w * 0.25, y: h * 0.17 };
            const b = portrait ? { x: w * 0.12, y: h * 0.25 } : { x: w * 0.75, y: h * 0.17 };
            ctx.fillStyle = 'rgba(236, 72, 153, 0.35)'; ctx.fillText(p1Score, a.x, a.y);
            ctx.fillStyle = 'rgba(6, 182, 212, 0.35)'; ctx.fillText(p2Score, b.x, b.y);

            if (phase === 'SERVE') {
                const left = serveUntil - now;
                ctx.font = `bold ${Math.max(28, Math.min(h, w) * 0.09)}px Tahoma`;
                ctx.fillStyle = '#fff'; ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 20;
                ctx.fillText(serveText, w / 2, h * (portrait ? 0.4 : 0.35));
                if (left > 0) {
                    ctx.font = `bold ${Math.max(40, Math.min(h, w) * 0.14)}px Arial`;
                    ctx.fillStyle = '#facc15';
                    ctx.fillText(Math.ceil(left / 600), w / 2, h * (portrait ? 0.5 : 0.62));
                }
                ctx.shadowBlur = 0;
            }
            if (phase !== 'MENU' && phase !== 'OVER' && !input.active) {
                ctx.font = `bold ${Math.max(14, Math.min(h, w) * 0.04)}px Tahoma`;
                ctx.fillStyle = 'rgba(255, 120, 120, 0.95)';
                ctx.fillText('ارفع كف يدك أمام الكاميرا أو المس الشاشة للتحكم', w / 2, h - 30);
            }
        }

        /* ---------------- الحلقة الرئيسية ---------------- */
        let lastT = performance.now();
        function loop(now) {
            const k = Math.max(0.1, Math.min((now - lastT) / 16.667, 2.5)) || 1;
            lastT = now;

            if (phase === 'SERVE' || phase === 'PLAY') {
                updatePlayer(k);
                updateAI(k, now);
                if (phase === 'SERVE' && now >= serveUntil) launch();
                if (phase === 'PLAY') {
                    updatePuck(k);
                    trail.push({ x: puck.x, y: puck.y });
                    if (trail.length > 8) trail.shift();
                }
            } else if (phase === 'MENU') {
                p1.px = p1.x; p1.py = p1.y;
            }

            GC.begin(ctx);
            ctx.clearRect(0, 0, GC.view.w, GC.view.h);
            ctx.save();
            if (portrait) ctx.transform(0, -1, 1, 0, 0, W);
            drawArena();
            drawPaddle(p1, phase !== 'MENU' && !input.active);
            drawPaddle(p2, false);
            drawPuck();
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * k; p.y += p.vy * k; p.life -= p.decay * k;
                if (p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.restore();
            drawHud(now);
            requestAnimationFrame(loop);
        }

        /* ---------------- الكاميرا ---------------- */
        function cameraDone(failed) {
            cameraStatus = failed ? 'failed' : 'ok';
            if (failed) {
                panelDesc.innerHTML = 'الكاميرا غير متاحة — يمكنك اللعب بالفأرة أو باللمس: حرّك إصبعك في نصفك من الملعب.';
            }
            showPanel();
        }

        async function initCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof Hands === 'undefined') {
                cameraDone(true);
                return;
            }
            try {
                const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
                const mobile = /Android|iPhone|iPad|Mobi/i.test(navigator.userAgent);
                hands.setOptions({ maxNumHands: 1, modelComplexity: mobile ? 0 : 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
                hands.onResults((results) => {
                    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        const p = results.multiHandLandmarks[0][9];
                        GC.setHand(p.x, p.y);
                    } else {
                        GC.clearHand();
                    }
                });
                await GC.startCamera(video, hands);
                cameraDone(false);
            } catch (err) {
                console.error(err);
                cameraDone(true);
            }
        }

        resetPositions();
        requestAnimationFrame(loop);
        initCamera();
    </script>
    <script src="remote-nav.js"></script>
</body>
</html>
