<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مقاتل المجرة</title>
    <script src="game-common.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: #050816; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #video { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
        #canvas { position: fixed; top: 0; left: 0; display: block; }
        .overlay {
            position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            background: rgba(4, 7, 20, 0.95); padding: 16px; overflow-y: auto;
        }
        .overlay > * { flex-shrink: 0; }
        h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 7vw, 3rem); color: #a78bfa; text-shadow: 0 0 14px rgba(167, 139, 250, 0.7); }
        p { margin: 0 0 12px; max-width: 660px; line-height: 1.7; color: #cbd5e1; font-size: clamp(0.92rem, 3.4vw, 1.1rem); }
        .how { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 0 0 12px; max-width: 740px; }
        .how span { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 6px 12px; font-size: 0.92rem; }
        button {
            font-family: inherit; cursor: pointer; border: 2px solid #a78bfa; color: #fff;
            background: #5b21b6; border-radius: 50px; padding: 12px 40px;
            font-size: clamp(1.1rem, 4.5vw, 1.4rem); box-shadow: 0 0 16px rgba(167, 139, 250, 0.5);
        }
        button:active { transform: scale(0.97); }
        .grp { display: flex; align-items: center; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 0 0 10px; }
        .grp label { color: #94a3b8; font-size: 0.95rem; min-width: 110px; text-align: end; }
        .row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
        .opt { padding: 7px 16px; font-size: 1rem; background: #1a1d3a; box-shadow: none; border-color: transparent; border-radius: 14px; }
        .opt small { display: block; font-size: 0.68rem; opacity: 0.85; }
        .opt.sel { background: #a78bfa; color: #1a0b3b; }
        .hidden { display: none !important; }
        .loader { border: 5px solid rgba(255,255,255,0.1); border-top-color: #a78bfa; border-radius: 50%; width: 46px; height: 46px; animation: spin 1s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #startBtn { margin-top: 6px; }
        @media (max-height: 600px) {
            h1 { margin-bottom: 2px; } p { margin-bottom: 6px; } .grp { margin-bottom: 4px; } .how { margin-bottom: 6px; }
            button { padding: 8px 26px; } .opt { padding: 4px 12px; } .grp label { min-width: 0; }
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="overlay" class="overlay">
        <div id="loader" class="loader"></div>
        <h1 id="title">🚀 مقاتل المجرة</h1>
        <p id="desc">جاري تحميل نموذج تتبع الجسم...</p>
        <div class="how hidden" id="how">
            <span>↔️ تحرّك أو مِل يميناً ويساراً لتحريك الطائرة (النار تلقائية)</span>
            <span>🙌 ارفع يديك معاً = قنبلة</span>
            <span>🦘 اقفز = درع مؤقت</span>
            <span>⭐ التقط الهدايا لتقوية سلاحك</span>
        </div>
        <div class="grp hidden" id="g1"><label>نمط اللعب</label><div class="row" id="modeRow"></div></div>
        <div class="grp hidden" id="g2"><label>ابدأ من المرحلة</label><div class="row" id="stageRow"></div></div>
        <div class="grp hidden" id="g3"><label>حساسية الحركة</label><div class="row" id="sensRow"></div></div>
        <button id="startBtn" class="hidden">ابدأ المعركة</button>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const canvas = $('canvas'), ctx = canvas.getContext('2d'), video = $('video');
        const overlay = $('overlay'), titleEl = $('title'), descEl = $('desc'), loader = $('loader'), howEl = $('how'), startBtn = $('startBtn');
        const toAr = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const rnd = (a, b) => a + Math.random() * (b - a);

        /* ---------------- الثوابت ---------------- */
        const W = 720, H = 960, DT = 1 / 60, MAX_STAGE = 10, PY = H - 120;
        const STAGES = [
            ['السديم', 220], ['الحزام الصخري', 30], ['الكوكب الأحمر', 5], ['العاصفة الشمسية', 40], ['الثقب الأسود', 270],
            ['المحطة المهجورة', 190], ['سديم الجليد', 195], ['المجرة المظلمة', 285], ['عالم الآلات', 150], ['القلعة الأخيرة', 330]
        ];
        const BOSS_NAMES = ['الحارس', 'سيد الصخور', 'عقرب النار', 'ملكة العاصفة', 'آكل النجوم', 'قبطان المحطة', 'تنين الجليد', 'ظل المجرة', 'العقل الآلي', 'إمبراطور المجرة'];
        const SENS = [
            { name: 'حساس', sub: 'حركة صغيرة تكفي', range: 0.17, lean: 12 },
            { name: 'عادي', sub: 'مناسب للأغلبية', range: 0.25, lean: 16 },
            { name: 'واسع', sub: 'حركة كبيرة', range: 0.36, lean: 22 }
        ];
        const PCOL = ['#22d3ee', '#f472b6'];
        const ETYPES = {
            scout:  { hp: 1, r: 18, score: 50,  vy: 115 },
            zig:    { hp: 2, r: 20, score: 80,  vy: 100 },
            gunner: { hp: 3, r: 22, score: 120, vy: 125 },
            diver:  { hp: 2, r: 17, score: 100, vy: 90 },
            tank:   { hp: 8, r: 34, score: 300, vy: 60 }
        };
        const PUPS = {
            weapon: { e: '⭐', c: '#facc15' }, heal: { e: '❤️', c: '#fb7185' },
            shield: { e: '🛡️', c: '#22d3ee' }, bomb: { e: '💣', c: '#fb923c' }
        };
        const KS = [
            { l: 'KeyA', r: 'KeyD', shield: 'KeyW', bomb: 'Space' },
            { l: 'ArrowLeft', r: 'ArrowRight', shield: 'ArrowUp', bomb: 'Enter' }
        ];

        const cfg = { mode: 1, stage: 1, sens: 1 };
        let w = 0, h = 0, lastT = performance.now(), acc = 0, now = 0;
        let phase = 'MENU';        // MENU, READY, PLAY, STAGEUP, OVER
        let P = [], enemies = [], eb = [], pb = [], pups = [], parts = [], pops = [], boss = null;
        let stage = 1, wave = 0, waveList = [], waveT = 0, waveGap = 0, bossWarn = 0, phaseT = 0, banner = '', sub = '', shake = 0, flashT = 0;
        let poseStatus = 'loading', poses = [], result = null, gameTime = 0;
        let stars = Array.from({ length: 110 }, () => ({ x: Math.random(), y: Math.random(), z: 0.3 + Math.random() * 1.2 }));
        GC.fitCanvas(canvas, (nw, nh) => { w = nw; h = nh; });

        /* ---------------- تتبع الجسم ---------------- */
        const VISION_VER = '0.10.14';
        let landmarker = null, lastVideoT = -1;
        async function loadVision() {
            let mod, base;
            try { mod = await import('./vendor/tasks-vision/vision_bundle.mjs'); base = new URL('./vendor/tasks-vision/wasm', location.href).href; }
            catch (e) {
                mod = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VISION_VER}/vision_bundle.mjs`);
                base = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VISION_VER}/wasm`;
            }
            const fs = await mod.FilesetResolver.forVisionTasks(base);
            const local = './vendor/models/pose_landmarker_lite.task';
            let modelPath = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
            try { const r = await fetch(local, { method: 'HEAD' }); if (r.ok) modelPath = local; } catch (e) { /* لا يوجد ملف محلي */ }
            const opts = (delegate) => ({
                baseOptions: { modelAssetPath: modelPath, delegate }, runningMode: 'VIDEO', numPoses: 2,
                minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5
            });
            try { return await mod.PoseLandmarker.createFromOptions(fs, opts('GPU')); }
            catch (e) { return await mod.PoseLandmarker.createFromOptions(fs, opts('CPU')); }
        }
        async function initPose() {
            if (new URLSearchParams(location.search).has('sim')) { poseStatus = 'sim'; return readyMenu(); }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { poseStatus = 'failed'; return readyMenu(); }
            try {
                landmarker = await loadVision();
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
                video.srcObject = stream;
                await video.play();
                poseStatus = 'ok';
            } catch (e) { console.error(e); poseStatus = 'failed'; }
            readyMenu();
        }
        // ميلان الجذع بالدرجات: موجب = مال اللاعب إلى يمينه
        function leanFrom(lm, vw, vh) {
            const L = lm[11], Rr = lm[12], deg = 180 / Math.PI;
            const roll = -Math.atan2((L.y - Rr.y) * vh, (L.x - Rr.x) * vw) * deg;
            const sx = (L.x + Rr.x) / 2, sy = (L.y + Rr.y) / 2;
            const hp = lm[23], hq = lm[24];
            if (hp && hq && hp.visibility > 0.35 && hq.visibility > 0.35) {
                const hx = (hp.x + hq.x) / 2, hy = (hp.y + hq.y) / 2;
                return -Math.atan2((sx - hx) * vw, (hy - sy) * vh) * deg * 0.85 + roll * 0.15;
            }
            const n = lm[0], swpx = Math.max(1, Math.abs(L.x - Rr.x) * vw);
            const head = n ? -Math.atan2((n.x - sx) * vw, swpx * 0.9) * deg : 0;
            return head * 0.6 + roll * 0.4;
        }
        function detect(t) {
            if (poseStatus !== 'ok' || !landmarker || video.readyState < 2 || video.currentTime === lastVideoT) return;
            lastVideoT = video.currentTime;
            let res;
            try { res = landmarker.detectForVideo(video, t); } catch (e) { return; }
            const vw = video.videoWidth, vh = video.videoHeight, nP = cfg.mode;
            let list = (res.landmarks || [])
                .filter((lm) => lm[11] && lm[12] && lm[11].visibility > 0.4 && lm[12].visibility > 0.4)
                .map((lm) => ({ lm, cx: 1 - (lm[11].x + lm[12].x) / 2, sw: Math.abs(lm[11].x - lm[12].x) }));
            let assigned;
            if (nP === 1) assigned = [list.length ? list.reduce((a, b) => (b.sw > a.sw ? b : a)) : null];
            else {
                assigned = [null, null];
                list = list.sort((a, b) => b.sw - a.sw).slice(0, 2).sort((a, b) => a.cx - b.cx);
                if (list.length === 2) assigned = list;
                else if (list.length === 1) assigned[list[0].cx < 0.5 ? 0 : 1] = list[0];
            }
            poses = assigned.map((a) => (a ? a.lm : null));
            assigned.forEach((a, i) => {
                const p = P[i]; if (!p || !a) return;
                const lm = a.lm, L = lm[11], Rr = lm[12];
                const swpx = Math.max(20, Math.abs(L.x - Rr.x) * vw), shy = (L.y + Rr.y) / 2;
                const raw = {
                    lean: leanFrom(lm, vw, vh), cx: a.cx, sy: shy * vh, swpx,
                    upR: lm[16] && lm[16].visibility > 0.5 ? ((shy - lm[16].y) * vh) / swpx : -9,
                    upL: lm[15] && lm[15].visibility > 0.5 ? ((shy - lm[15].y) * vh) / swpx : -9
                };
                if (!p.cur) p.cur = raw;
                else {
                    p.cur.lean += (raw.lean - p.cur.lean) * 0.5; p.cur.cx += (raw.cx - p.cur.cx) * 0.55;
                    p.cur.sy += (raw.sy - p.cur.sy) * 0.6; p.cur.swpx += (raw.swpx - p.cur.swpx) * 0.3;
                    p.cur.upR = raw.upR; p.cur.upL = raw.upL;
                }
                p.seenAt = t;
            });
        }

        /* ---------------- لوحة المفاتيح والمؤشر (احتياط) ---------------- */
        const allKeys = new Set(KS.flatMap((k) => Object.values(k)));
        const keyDown = new Set();
        window.addEventListener('keydown', (e) => {
            if (!allKeys.has(e.code) || phase === 'MENU') return;
            e.preventDefault(); e.stopPropagation();
            if (e.repeat) return;
            keyDown.add(e.code);
            const sets = cfg.mode === 1 ? [[0, KS[0]], [0, KS[1]]] : [[0, KS[0]], [1, KS[1]]];
            sets.forEach(([pi, k]) => {
                const p = P[pi]; if (!p || phase !== 'PLAY') return;
                if (e.code === k.bomb) p.wantBomb = true;
                if (e.code === k.shield) p.wantShield = true;
            });
        }, true);
        window.addEventListener('keyup', (e) => { keyDown.delete(e.code); });
        window.addEventListener('blur', () => keyDown.clear());
        const ptr = { down: false, x: 0, t: 0 };
        window.addEventListener('pointerdown', (e) => { if (!(e.target.closest && e.target.closest('button, .overlay, #remote-back-btn'))) { ptr.down = true; ptr.x = e.clientX; ptr.t = performance.now(); } });
        window.addEventListener('pointermove', (e) => { if (ptr.down) { ptr.x = e.clientX; ptr.t = performance.now(); } });
        window.addEventListener('pointerup', () => { ptr.down = false; });
        window.addEventListener('pointercancel', () => { ptr.down = false; });

        /* ---------------- اللاعبون ---------------- */
        function mkPlayer(i) {
            return {
                i, x: W / 2, tx: W / 2, hp: 5, maxHp: 5, wl: 1, fireT: 0, inv: 0, shield: 0, shCd: 0, bombs: 1, score: 0, alive: true,
                cur: null, base: null, seenAt: 0, seen: false, u: 0, armB: true, armJ: true, wantBomb: false, wantShield: false,
                flashB: 0, flashS: 0
            };
        }
        const px0 = (i) => (cfg.mode === 1 ? W / 2 : (i === 0 ? W * 0.33 : W * 0.67));

        function processInput(p, dt) {
            const sens = SENS[cfg.sens];
            const ks = cfg.mode === 1 ? [KS[0], KS[1]] : [KS[p.i]];
            let kd = 0;
            ks.forEach((k) => { kd += (keyDown.has(k.r) ? 1 : 0) - (keyDown.has(k.l) ? 1 : 0); });
            p.seen = !!(p.cur && now - p.seenAt < 600);
            let moved = false;
            if (p.seen) {
                const c = p.cur;
                if (!p.base) p.base = { cx: c.cx, lean: c.lean, sy: c.sy, swpx: c.swpx };
                const b = p.base;
                if (phase === 'READY') { b.cx += (c.cx - b.cx) * 0.1; b.lean += (c.lean - b.lean) * 0.1; b.sy += (c.sy - b.sy) * 0.1; b.swpx += (c.swpx - b.swpx) * 0.1; }
                const u = clamp((c.cx - b.cx) / sens.range + ((c.lean - b.lean) / sens.lean) * 0.5, -1, 1);
                p.u = u;
                if (!kd) { p.tx = W / 2 + u * (W / 2 - 46); moved = true; }
                if (phase === 'PLAY') {
                    const dy = (c.sy - b.sy) / b.swpx;
                    if (p.armJ && dy < -0.42) { p.armJ = false; p.wantShield = true; }
                    else if (!p.armJ && dy > -0.15) p.armJ = true;
                    if (p.armB && c.upR > 0.55 && c.upL > 0.55) { p.armB = false; p.wantBomb = true; }
                    else if (!p.armB && (c.upR < 0.1 || c.upL < 0.1)) p.armB = true;
                    if (Math.abs(u) < 0.12 && Math.abs(dy) < 0.25) { b.cx += (c.cx - b.cx) * 0.006; b.sy += (c.sy - b.sy) * 0.01; }
                }
            }
            if (kd) { p.tx = clamp(p.tx + kd * 640 * dt, 46, W - 46); moved = true; }
            if (i0(p) && ptr.down && performance.now() - ptr.t < 3000 && !kd) { p.tx = clamp((ptr.x - view.ox) / view.s, 46, W - 46); moved = true; }
            // حركة سلسة نحو الهدف
            const dx = p.tx - p.x, mv = 1500 * dt;
            p.x += Math.abs(dx) < mv ? dx : Math.sign(dx) * mv;
            p.x = clamp(p.x, 40, W - 40);
        }
        const i0 = (p) => p.i === 0;

        /* ---------------- المراحل والموجات ---------------- */
        function startGame() {
            GC.audioInit();
            P = []; for (let i = 0; i < cfg.mode; i++) P.push(mkPlayer(i));
            stage = cfg.stage; gameTime = 0;
            overlay.classList.add('hidden');
            beginStage(true);
        }
        function beginStage(first) {
            enemies = []; eb = []; pb = []; pups = []; parts = []; pops = []; boss = null;
            wave = 0; waveList = []; waveT = 0; waveGap = 1.2; bossWarn = 0;
            P.forEach((p) => {
                if (!p.alive) { p.alive = true; p.hp = 3; p.wl = 1; }
                p.x = p.tx = px0(p.i); p.inv = 2; p.shield = 0; p.shCd = 0; p.bombs = Math.min(5, Math.max(p.bombs, 1)); p.wantBomb = p.wantShield = false;
                p.hp = Math.min(p.maxHp, p.hp + (first ? 0 : 1));
            });
            phase = 'READY'; phaseT = first ? 190 : 140;
        }
        function genWave(s, wi) {
            const pool = ['scout']; if (s >= 2) pool.push('zig', 'scout'); if (s >= 3) pool.push('gunner'); if (s >= 4) pool.push('diver'); if (s >= 5) pool.push('tank');
            const n = Math.min(16, 4 + s + wi * 2), list = [];
            const pat = ['row', 'vee', 'stream', 'sides'][Math.random() * 4 | 0];
            let tanks = 0;
            const pick = () => { let t = pool[Math.random() * pool.length | 0]; if (t === 'tank' && ++tanks > 2) t = 'gunner'; return t; };
            const swarm = ['scout', 'zig', 'diver'].filter((t) => pool.includes(t));
            if (pat === 'row') {
                const t = swarm[Math.random() * swarm.length | 0], m = Math.min(n, 9);
                for (let i = 0; i < m; i++) list.push({ t: i * 0.08, type: t, x: 70 + (W - 140) * (i / Math.max(1, m - 1)) });
            } else if (pat === 'vee') {
                const t = swarm[Math.random() * swarm.length | 0], m = Math.min(n | 1, 9);
                for (let i = 0; i < m; i++) { const k = Math.abs(i - (m - 1) / 2); list.push({ t: k * 0.35, type: t, x: W / 2 + (i - (m - 1) / 2) * 62, y: -30 - (((m - 1) / 2) - k) * 0 }); }
            } else if (pat === 'stream') {
                const xs = rnd(120, W - 120);
                for (let i = 0; i < n; i++) list.push({ t: i * 0.55, type: pick(), x: clamp(xs + Math.sin(i * 0.7) * 200, 60, W - 60) });
            } else {
                for (let i = 0; i < n; i++) list.push({ t: i * 0.45, type: pick(), x: i % 2 ? W - 70 : 70, side: i % 2 ? -1 : 1 });
            }
            return list.sort((a, b) => a.t - b.t);
        }
        function addEnemy(o) {
            const b = ETYPES[o.type], hp = Math.ceil(b.hp * (1 + (stage - 1) * 0.1));
            enemies.push({
                type: o.type, x: o.x, y: o.y === undefined ? -30 : o.y, x0: o.x, hp, maxhp: hp, r: b.r, score: b.score, vy: b.vy * (1 + (stage - 1) * 0.05),
                t: 0, ph: Math.random() * 6, dir: o.side || (Math.random() < 0.5 ? -1 : 1), fireT: rnd(0.8, 2), hit: 0, state: 0, hoverY: rnd(150, 340), side: o.side || 0
            });
        }
        function stageSpeed() { return 1 + (stage - 1) * 0.07; }
        function nearestPlayer(x) {
            let best = null, bd = 1e9;
            P.forEach((p) => { if (p.alive) { const d = Math.abs(p.x - x); if (d < bd) { bd = d; best = p; } } });
            return best;
        }
        function enemyShot(x, y, ang, spd, big) {
            if (eb.length > 220) return;
            const s = (spd || 230) * (1 + (stage - 1) * 0.04);
            eb.push({ x, y, vx: Math.cos(ang) * s, vy: Math.sin(ang) * s, r: big ? 8 : 6, c: big ? '#e879f9' : '#fb923c' });
        }
        function aimAt(x, y) { const p = nearestPlayer(x) || { x: W / 2 }; return Math.atan2(PY - y, p.x - x); }

        function spawnBoss() {
            const hp = 80 + 50 * stage;
            boss = { x: W / 2, y: -140, hp, maxhp: hp, t: 0, pat: 0, patT: 0, fireT: 1.2, enter: true, hit: 0, rx: 120 + stage * 5, ry: 62, spin: 0, ang: 0 };
            bossWarn = 0;
            GC.beep(160, 0.6, 'sawtooth', 0.12, 0, 90);
        }
        function bossPatterns() {
            const l = ['aimed']; if (stage >= 2) l.push('spread'); if (stage >= 4) l.push('spiral'); if (stage >= 6) l.push('rain'); if (stage >= 8) l.push('ring');
            return l;
        }
        function bossFire(dt) {
            const b = boss, pats = bossPatterns(), rage = b.hp < b.maxhp * 0.5 ? 0.7 : 1, sp = rage < 1 ? 1.15 : 1;
            b.patT += dt;
            if (b.patT > 4.2) { b.patT = 0; b.pat = (b.pat + 1) % pats.length; b.fireT = 0.6; }
            b.fireT -= dt;
            if (b.fireT > 0) return;
            const pat = pats[b.pat % pats.length];
            if (pat === 'aimed') { const a = aimAt(b.x, b.y); for (let k = -1; k <= 1; k++) enemyShot(b.x, b.y + 30, a + k * 0.2, 270 * sp, true); b.fireT = 0.85 * rage; }
            else if (pat === 'spread') { for (let k = 0; k < 9; k++) enemyShot(b.x, b.y + 30, Math.PI / 2 - 0.75 + k * 0.1875, 220 * sp); b.fireT = 1.15 * rage; }

            ctx.fillStyle = `hsl(${hue},60%,16%)`; ctx.fillRect(-100, 18, 14, 40); ctx.fillRect(86, 18, 14, 40); ctx.fillRect(-7, 40, 14, 38);
            ctx.fillStyle = glow; ctx.shadowColor = glow; ctx.shadowBlur = 20;
            ctx.beginPath(); ctx.arc(0, -4, 22 + Math.sin(now / 160) * 3, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(-100, 58, 5, 0, 7); ctx.arc(100, 58, 5, 0, 7); ctx.arc(0, 78, 5, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
            ctx.fillStyle = '#0b1020'; ctx.beginPath(); ctx.arc(0, -4, 10, 0, 7); ctx.fill();
            ctx.restore();
        }

        function drawWorld() {
            // الأعداء والهدايا والطلقات
            pups.forEach((u) => {
                const m = PUPS[u.type], pu = 0.5 + 0.5 * Math.sin(now / 150 + u.t * 3);
                ctx.fillStyle = m.c; ctx.globalAlpha = 0.25 + 0.2 * pu; ctx.beginPath(); ctx.arc(u.x, u.y, 26 + pu * 4, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
                ctx.strokeStyle = m.c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(u.x, u.y, 20, 0, 7); ctx.stroke();
                ctx.font = '22px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(m.e, u.x, u.y + 1);
            });
            enemies.forEach(drawEnemy);
            if (boss) drawBoss();
            pb.forEach((b) => { ctx.strokeStyle = b.c; ctx.lineWidth = 4; ctx.shadowColor = b.c; ctx.shadowBlur = 8; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.018, b.y - b.vy * 0.018); ctx.stroke(); }); ctx.shadowBlur = 0;
            eb.forEach((b) => { ctx.fillStyle = b.c; ctx.shadowColor = b.c; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.4, 0, 7); ctx.fill(); }); ctx.shadowBlur = 0;
            P.forEach(drawPlayer);
            parts.forEach((q) => { ctx.globalAlpha = Math.min(1, q.t * 2); ctx.fillStyle = q.c; ctx.fillRect(q.x - q.sz / 2, q.y - q.sz / 2, q.sz, q.sz); }); ctx.globalAlpha = 1;
            pops.forEach((q) => { ctx.globalAlpha = Math.min(1, q.t * 2); txt(q.txt, q.x, q.y, 22, q.c, '#000'); }); ctx.globalAlpha = 1;
        }

        const BONES = [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [24, 26], [26, 28]];
        function drawPip(x, y, pw) {
            const ph = pw * 0.75;
            ctx.save(); rrect(x, y, pw, ph, 8); ctx.clip();
            ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(x, y, pw, ph);
            if (poseStatus === 'ok' && video.videoWidth) { ctx.save(); ctx.translate(x + pw, y); ctx.scale(-1, 1); ctx.globalAlpha = 0.6; ctx.drawImage(video, 0, 0, pw, ph); ctx.restore(); ctx.globalAlpha = 1; }
            poses.forEach((lm, i) => {
                if (!lm) return;
                ctx.strokeStyle = PCOL[i]; ctx.lineWidth = 3; ctx.beginPath();
                BONES.forEach(([a, b]) => { if (lm[a] && lm[b]) { ctx.moveTo(x + (1 - lm[a].x) * pw, y + lm[a].y * ph); ctx.lineTo(x + (1 - lm[b].x) * pw, y + lm[b].y * ph); } });
                ctx.stroke();
            });
            ctx.restore();
            ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2; rrect(x, y, pw, ph, 8); ctx.stroke();
            return ph;
        }
        // مؤشر الموضع + أيقونتا القنبلة والدرع
        function drawGauge(p, x, y, gw) {
            ctx.fillStyle = 'rgba(255,255,255,0.14)'; rrect(x, y, gw, 6, 3); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(x + gw / 2 - 1, y - 4, 2, 14);
            if (!p.seen && poseStatus === 'ok') { txt('⚠ لا أراك', x + gw / 2, y + 22, 13, '#fca5a5'); return; }
            ctx.fillStyle = PCOL[p.i]; ctx.beginPath(); ctx.arc(x + gw / 2 + p.u * gw / 2, y + 3, 7, 0, 7); ctx.fill();
            const on = (t) => now - t < 300;
            const ic = [['🙌', on(p.flashB)], ['🦘', on(p.flashS)]];
            ic.forEach(([e, o], i) => { ctx.fillStyle = o ? PCOL[p.i] : 'rgba(255,255,255,0.1)'; rrect(x + gw / 2 - 44 + i * 46, y + 14, 42, 30, 8); ctx.fill(); ctx.font = '18px "Segoe UI Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(e, x + gw / 2 - 23 + i * 46, y + 30); });
        }

        function drawHUD(wx, wy, ws) {
            const fs = Math.max(13, ws * 24);
            P.forEach((p, i) => {
                const x = wx + 12 + (cfg.mode === 2 && i === 1 ? ws * W - 12 - ws * 190 : 0), y = wy + 10;
                ctx.globalAlpha = p.alive ? 1 : 0.4;
                for (let k = 0; k < p.maxHp; k++) { ctx.font = `${fs}px "Segoe UI Emoji",sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.globalAlpha = (p.alive ? 1 : 0.4) * (k < p.hp ? 1 : 0.22); ctx.fillText('❤️', x + k * fs * 1.05, y); }
                ctx.globalAlpha = p.alive ? 1 : 0.4;
                txt(`💣${toAr(p.bombs)}  ⭐${toAr(p.wl)}  ${toAr(p.score)}`, x, y + fs * 1.8, fs * 0.8, PCOL[p.i], undefined, 'left');
                if (p.shCd > 0) txt(`🛡 ${toAr(Math.ceil(p.shCd))}`, x, y + fs * 2.8, fs * 0.7, '#94a3b8', undefined, 'left');
                ctx.globalAlpha = 1;
            });
            // المرحلة والتقدم
            const cx = wx + ws * W / 2;
            txt(`المرحلة ${toAr(stage)} · ${STAGES[stage - 1][0]}`, cx, wy + fs * 0.9, fs * 0.85, '#e2e8f0', '#000');
            if (!boss) { txt(bossWarn > 0 ? '⚠ تحذير: زعيم قادم' : `الموجة ${toAr(Math.min(3, wave))} / ٣`, cx, wy + fs * 1.9, fs * 0.7, bossWarn > 0 ? '#fca5a5' : '#94a3b8'); }
            else { const bw = ws * 360; ctx.fillStyle = 'rgba(0,0,0,0.55)'; rrect(cx - bw / 2, wy + fs * 1.5, bw, 12, 6); ctx.fill(); ctx.fillStyle = '#ef4444'; rrect(cx - bw / 2, wy + fs * 1.5, Math.max(6, bw * clamp(boss.hp / boss.maxhp, 0, 1)), 12, 6); ctx.fill(); txt(BOSS_NAMES[stage - 1], cx, wy + fs * 2.6, fs * 0.75, '#fecaca', '#000'); }
        }

        function draw() {
            GC.begin(ctx);
            const th = STAGES[phase === 'MENU' ? 0 : stage - 1];
            const g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, `hsl(${th[1]},60%,6%)`); g.addColorStop(1, `hsl(${(th[1] + 30) % 360},55%,13%)`);
            ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
            stars.forEach((s) => { ctx.fillStyle = `rgba(255,255,255,${0.25 + s.z * 0.3})`; ctx.fillRect(s.x * w, s.y * h, s.z * 1.8, s.z * 1.8 + 1); });
            if (phase === 'MENU') return;
            const ws = Math.min(h / H, w / W);
            view.s = ws; view.ox = (w - W * ws) / 2; view.oy = (h - H * ws) / 2;
            const wx = view.ox, wy = view.oy;
            ctx.save();
            ctx.translate(wx + (shake > 0 ? (Math.random() - 0.5) * shake * 24 : 0), wy + (shake > 0 ? (Math.random() - 0.5) * shake * 24 : 0)); ctx.scale(ws, ws);
            ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
            ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, W, H);
            drawWorld();
            if (flashT > 0) { ctx.fillStyle = `rgba(255,255,255,${flashT * 1.6})`; ctx.fillRect(0, 0, W, H); }
            ctx.restore();
            ctx.strokeStyle = 'rgba(167,139,250,0.45)'; ctx.lineWidth = 2; ctx.strokeRect(wx, wy, W * ws, H * ws);
            drawHUD(wx, wy, ws);
            // نافذة الكاميرا: في الجانب إن اتسع، وإلا فوق الميدان
            const side = (w - W * ws) / 2;
            const pw = side >= 190 ? Math.min(side - 24, 300) : Math.min(150, W * ws * 0.26);
            const px = side >= 190 ? w - side + (side - pw) / 2 : wx + W * ws - pw - 8, py = side >= 190 ? wy + 12 : wy + H * ws - pw * 0.75 - 14 - 54;
            if (side < 190) ctx.globalAlpha = 0.8;
            const ph = drawPip(px, py, pw);
            ctx.globalAlpha = 1;
            P.forEach((p, i) => drawGauge(p, px + 8, py + ph + 14 + i * 62, pw - 16));
            const cx = w / 2, cy = h * 0.45, big = Math.max(40, Math.min(w, h) * 0.12);
            if (phase === 'READY') {
                const n = Math.ceil(phaseT / 60);
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(wx, cy - big * 0.9, W * ws, big * 1.9);
                txt(n > 2 ? 'استعد' : String(n), cx, cy - big * 0.15, big, '#fde047', '#000');
                txt(`المرحلة ${toAr(stage)}: ${STAGES[stage - 1][0]}`, cx, cy + big * 0.55, Math.max(14, big * 0.26), '#fff', '#000');
            } else if (phase === 'STAGEUP') {
                ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(wx, cy - big * 0.8, W * ws, big * 1.6);
                txt(banner, cx, cy - big * 0.15, Math.max(24, big * 0.45), '#4ade80', '#000'); txt(sub, cx, cy + big * 0.4, Math.max(14, big * 0.24), '#fff');
            } else if (phase === 'OVER') {
                ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(wx, cy - big * 0.7, W * ws, big * 1.4);
                txt(result.won ? '🏆 أنقذت المجرة!' : 'سقطت طائرتك', cx, cy, Math.max(26, big * 0.5), '#fff', '#a78bfa');
            }
            if (phase === 'PLAY' && bossWarn > 0 && Math.floor(now / 200) % 2) { ctx.fillStyle = 'rgba(239,68,68,0.18)'; ctx.fillRect(wx, wy, W * ws, H * ws); txt('⚠ زعيم قادم ⚠', cx, h * 0.4, big * 0.5, '#fca5a5', '#000'); }
        }

        function loop(t) {
            const dt = Math.min((t - lastT) / 1000, 0.1);
            lastT = t; now = t;
            detect(t);
            if (phase !== 'MENU') { acc += dt; let n = 0; while (acc >= DT && n < 6) { tick(t); acc -= DT; n++; } if (n === 6) acc = 0; } else acc = 0;
            if (phase === 'MENU') stars.forEach((s) => { s.y += dt * s.z * 0.06; if (s.y > 1) { s.y = 0; s.x = Math.random(); } });
            draw();
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
        initPose();

        // واجهة للاختبار الآلي (?sim=1)
        window.GALAXY = {
            cfg, startGame, SENS,
            get P() { return P; }, get enemies() { return enemies; }, get boss() { return boss; }, get phase() { return phase; }, get stage() { return stage; },
            get wave() { return wave; }, get eb() { return eb; }, get pups() { return pups; },
            setStage(s) { stage = s; }, giveWeapon(i, lv) { P[i].wl = lv; },
            step(n = 1) { for (let i = 0; i < n; i++) tick(performance.now()); draw(); },
            holdKey(code, on) { window.dispatchEvent(new KeyboardEvent(on ? 'keydown' : 'keyup', { code, bubbles: true, cancelable: true })); }
        };
    </script>
    <script src="remote-nav.js"></script>
</body>
