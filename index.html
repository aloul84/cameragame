<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لعبة كاميرا – ألعاب متعددة</title>
  <meta name="description" content="مجموعة من الألعاب الصغيرة المستندة إلى HTML. اختر لعبة لتبدأ اللعب." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0f0f0f;
      --bg-card: rgba(255, 255, 255, 0.08);
      --text-primary: #e0e0e0;
      --accent: hsl(210, 70%, 60%);
    }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 2rem 0 1rem;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .brand-logo {
      width: 120px;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.15));
    }
    h1 {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 600;
    }
    .subtitle {
      margin: 0.5rem 0 0;
      font-size: 1.15rem;
      color: #d7e6ff;
      letter-spacing: 0.02em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1.5rem;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }
    .card {
      background: var(--bg-card);
      border-radius: 1rem;
      text-align: center;
      padding: 1.5rem 1rem;
      backdrop-filter: blur(8px);
      transition: transform 0.2s, background 0.3s;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.12);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    .title {
      font-size: 1rem;
      font-weight: 600;
    }
    .footer-link {
      margin-top: auto;
      text-align: center;
      padding: 1rem 1rem 2rem;
    }
    .footer-link a {
      color: #d9ecff;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }
    .footer-link a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-wrap">
      <img class="brand-logo" src="fath-logo-white.png" alt="Fath logo" />
    </div>
    <h1>Fath play - ألعاب فذ</h1>
    <p class="subtitle">اختر لعبة</p>
  </header>
  <section class="grid">
    <a class="card" href="arabic-letters.html">
      <div class="icon">🅰️</div>
      <div class="title">حروف عربية</div>
    </a>
    <a class="card" href="english-letter.html">
      <div class="icon">🇬🇧</div>
      <div class="title">English Letters</div>
    </a>
    <a class="card" href="finger-jump.html">
      <div class="icon">🤚</div>
      <div class="title">Finger Jump</div>
    </a>
    <a class="card" href="head-jump.html">
      <div class="icon">🤸‍♀️</div>
      <div class="title">Head Jump</div>
    </a>
    <a class="card" href="hoky-2-players.html">
      <div class="icon">⚽️</div>
      <div class="title">Hoky 2 Players</div>
    </a>
    <a class="card" href="hoky-vs-cpu.html">
      <div class="icon">🤖⚽️</div>
      <div class="title">Hoky vs CPU</div>
    </a>
    <a class="card" href="hoky-vs-cpu-small-goal.html">
      <div class="icon">🥅⚽️</div>
      <div class="title">Hoky Small Goal</div>
    </a>
    <a class="card" href="maze.html">
      <div class="icon">🧩</div>
      <div class="title">Maze</div>
    </a>
    <a class="card" href="race.html">
      <div class="icon">🏁</div>
      <div class="title">Race</div>
    </a>
    <a class="card" href="race-with-sound.html">
      <div class="icon">🔊🏁</div>
      <div class="title">Race with Sound</div>
    </a>
    <a class="card" href="twins-simulator.html">
      <div class="icon">👯‍♂️</div>
      <div class="title">Twins Simulator</div>
    </a>
  </section>

  <div class="footer-link">
    <a href="https://www.fath-app.com/" target="_blank" rel="noopener noreferrer">https://www.fath-app.com/</a>
  </div>

  <script src="remote-nav.js"></script>
</body>
</html>
