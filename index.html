<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لعبة كاميرا – ألعاب متعددة</title>
  <meta name="description" content="مجموعة من الألعاب الصغيرة المستندة إلى HTML. اختر لعبة لتبدأ اللعب." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #1b3156;
      --bg-secondary: #1ca08c;
      --bg-deep: #0d2038;
      --card-bg: #1b3156;
      --card-edge: rgba(255,255,255,0.18);
      --text-primary: #f5fbff;
      --text-soft: #d9f4ef;
      --shadow: rgba(4, 15, 26, 0.45);
      --glow: rgba(26, 218, 179, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.08), transparent 25%),
        radial-gradient(circle at bottom right, rgba(28,160,140,0.4), transparent 30%),
        linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,0.06), transparent 35%, rgba(255,255,255,0.04));
      pointer-events: none;
    }

    header {
      text-align: center;
      padding: 2.2rem 1rem 1rem;
      position: relative;
      z-index: 1;
    }

    .brand-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
    }

    .brand-logo {
      width: 150px;
      height: auto;
      display: block;
      filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.22));
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 2.5vw, 3.6rem);
      font-weight: 900;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }

    .subtitle {
      margin: 0.9rem 0 0;
      font-size: 1.15rem;
      color: var(--text-soft);
      letter-spacing: 0.04em;
      font-weight: 600;
    }

    .grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 1.4rem;
      width: min(1220px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.5rem 0 1rem;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 164px;
      padding: 1.4rem 1rem;
      border-radius: 1.5rem;
      text-decoration: none;
      color: inherit;
      background: linear-gradient(180deg, rgba(27,49,86,0.9), rgba(17,33,59,0.9));
      border: 1px solid var(--card-edge);
      box-shadow: 0 12px 28px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, filter 0.18s ease;
      overflow: hidden;
      isolation: isolate;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent 42%, rgba(28,160,140,0.18));
      z-index: -1;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-6px) scale(1.015);
      box-shadow: 0 18px 38px rgba(0,0,0,0.28), 0 0 0 2px rgba(255,255,255,0.08), 0 0 18px var(--glow);
      border-color: rgba(255,255,255,0.28);
      filter: brightness(1.04);
    }

    .icon {
      font-size: 3.1rem;
      line-height: 1;
      margin-bottom: 0.85rem;
      filter: drop-shadow(0 5px 12px rgba(0,0,0,0.18));
    }

    .title {
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.5;
      color: var(--text-primary);
      text-align: center;
    }

    .footer-link {
      position: relative;
      z-index: 1;
      margin-top: auto;
      text-align: center;
      padding: 1.2rem 1rem 2rem;
      user-select: none;
      pointer-events: none;
    }

    .footer-link span {
      color: #edfef9;
      text-decoration: none;
      font-weight: 700;
      opacity: 0.95;
      transition: opacity 0.2s ease;
      cursor: default;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: repeat(2, minmax(140px, 1fr));
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-wrap">
      <img class="brand-logo" src="fath-logo-white.png" alt="Fath logo" />
    </div>
    <h1>Fath play - ألعاب فذ</h1>
    <p class="subtitle">اختر لعبة</p>
  </header>
  <section class="grid">
    <a class="card" href="arabic-letters.html">
      <div class="icon">🅰️</div>
      <div class="title">حروف عربية</div>
    </a>
    <a class="card" href="english-letter.html">
      <div class="icon">🇬🇧</div>
      <div class="title">الحروف الإنجليزية</div>
    </a>
    <a class="card" href="finger-jump.html">
      <div class="icon">🤚</div>
      <div class="title">قفزة الإصبع</div>
    </a>
    <a class="card" href="head-jump.html">
      <div class="icon">🤸‍♀️</div>
      <div class="title">قفزة الرأس</div>
    </a>
    <a class="card" href="hoky-2-players.html">
      <div class="icon">⚽️</div>
      <div class="title">هوكي لاعبان</div>
    </a>
    <a class="card" href="hoky-vs-cpu.html">
      <div class="icon">🤖⚽️</div>
      <div class="title">هوكي ضد الحاسوب</div>
    </a>
    <a class="card" href="hoky-vs-cpu-small-goal.html">
      <div class="icon">🥅⚽️</div>
      <div class="title">هوكي هدف صغير</div>
    </a>
    <a class="card" href="maze.html">
      <div class="icon">🧩</div>
      <div class="title">المتاهة</div>
    </a>
    <a class="card" href="race.html">
      <div class="icon">🏁</div>
      <div class="title">سباق</div>
    </a>
    <a class="card" href="race-with-sound.html">
      <div class="icon">🔊🏁</div>
      <div class="title">سباق مع الصوت</div>
    </a>
    <a class="card" href="twins-simulator.html">
      <div class="icon">👯‍♂️</div>
      <div class="title">محاكي التوأم</div>
    </a>
  </section>

  <div class="footer-link">
    <span>fath-app.com</span>
  </div>

  <script src="remote-nav.js"></script>
</body>
</html>
