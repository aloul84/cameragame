<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نيون هوكي - تحدي اللاعبين</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050510; /* Dark space background */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #13132b 0%, #050510 100%);
        }

        #video-feed {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror to act like a mirror */
            opacity: 0.2; /* Dim video so neon graphics pop */
            z-index: 1;
        }

        #game-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .overlay-panel {
            position: absolute;
            z-index: 10;
            background: rgba(10, 10, 25, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #a855f7;
            border-radius: 1rem;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
            transition: opacity 0.3s ease;
            max-width: 90%;
        }

        .btn {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            font-size: 1.25rem;
            font-weight: bold;
            padding: 1rem 3rem;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.6);
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #a855f7;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem auto;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }

        /* Neon Text Utilities */
        .text-neon-pink { text-shadow: 0 0 10px #ec4899, 0 0 20px #ec4899; color: #fbcfe8; }
        .text-neon-blue { text-shadow: 0 0 10px #06b6d4, 0 0 20px #06b6d4; color: #cffafe; }
        .text-neon-purple { text-shadow: 0 0 10px #a855f7, 0 0 20px #a855f7; color: #f3e8ff; }
    </style>
</head>
<body>

    <div id="game-container">
        <video id="video-feed" autoplay playsinline></video>
        <canvas id="game-canvas"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay-panel">
            <h1 class="text-5xl font-extrabold text-neon-purple mb-4">نيون هوكي</h1>
            <p class="text-gray-300 mb-2 text-xl">لعبة تحدي لشخصين!</p>
            <p class="text-gray-400 mb-8 text-md">قفوا أمام الكاميرا، واستخدموا أيديكم لصد القرص وتسجيل الأهداف.<br><span class="text-pink-400">اللاعب 1 (يسار)</span> ضد <span class="text-cyan-400">اللاعب 2 (يمين)</span>.<br>أول من يسجل 5 أهداف يفوز!</p>
            
            <div id="loading-indicator">
                <div class="spinner"></div>
                <p class="text-purple-300">جاري تشغيل الكاميرا والذكاء الاصطناعي...</p>
            </div>
            
            <button id="start-btn" class="btn hidden">بدء التحدي</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay-panel hidden">
            <h1 class="text-5xl font-extrabold mb-4" id="winner-text">اللاعب يفوز!</h1>
            <p class="text-white font-bold text-3xl mb-8">النتيجة النهائية<br><span id="final-score" class="text-2xl mt-4 block">0 - 0</span></p>
            <button id="restart-btn" class="btn">تحدي جديد</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const loadingIndicator = document.getElementById('loading-indicator');
        const startBtn = document.getElementById('start-btn');
        const gameOverScreen = document.getElementById('game-over-screen');
        const restartBtn = document.getElementById('restart-btn');
        const winnerText = document.getElementById('winner-text');
        const finalScoreText = document.getElementById('final-score');

        // Game State
        let isGameRunning = false;
        let isModelLoaded = false;
        let p1Score = 0;
        let p2Score = 0;
        const WINNING_SCORE = 5;

        // Player Hands state
        const p1Hand = { x: -100, y: -100, prevX: -100, prevY: -100, vx: 0, vy: 0, active: false, color: '#ec4899', radius: 45 };
        const p2Hand = { x: -100, y: -100, prevX: -100, prevY: -100, vx: 0, vy: 0, active: false, color: '#06b6d4', radius: 45 };
        
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if(puck.x === 0) resetPuck(); // Initial center
        }
        window.addEventListener('resize', resizeCanvas);

        const AudioSys = {
            ready: false,
            bgmSynth: null,
            bgmLoop: null,
            hitSynth: null,
            wallSynth: null,
            goalSynth: null,
            winSynth: null,
            
            async init() {
                if (this.ready) return;
                await Tone.start();
                
                // Synthwave BGM (Fast Arpeggio)
                this.bgmSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 }
                }).toDestination();
                this.bgmSynth.volume.value = -18;

                const bassline = ["C2", "C2", "G2", "C2", "D#2", "C2", "F2", "D2"];
                let step = 0;
                this.bgmLoop = new Tone.Loop((time) => {
                    this.bgmSynth.triggerAttackRelease(bassline[step % bassline.length], "8n", time);
                    step++;
                }, "16n");

                // Hit Puck sound
                this.hitSynth = new Tone.MembraneSynth({
                    pitchDecay: 0.01, octaves: 4, oscillator: { type: "sine" }
                }).toDestination();
                this.hitSynth.volume.value = -5;

                // Wall bounce sound
                this.wallSynth = new Tone.MetalSynth({
                    frequency: 200, envelope: { attack: 0.001, decay: 0.1, release: 0.01 },
                    harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5
                }).toDestination();
                this.wallSynth.volume.value = -15;

                // Goal Score sound
                this.goalSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "square" }, envelope: { attack: 0.05, decay: 0.5, sustain: 0.2, release: 1 }
                }).toDestination();
                this.goalSynth.volume.value = -10;

                // Game Over sound
                this.winSynth = new Tone.PolySynth(Tone.Synth).toDestination();
                this.winSynth.volume.value = -5;

                Tone.Transport.start();
                Tone.Transport.bpm.value = 130;
                this.ready = true;
            },

            playBGM() { if (this.ready) this.bgmLoop.start(0); },
            stopBGM() { if (this.ready) this.bgmLoop.stop(); },
            
            playHit(intensity) {
                if (!this.ready) return;
                let vol = Math.min(Math.max(intensity * 2, 5), 20); // Scale volume with hit
                this.hitSynth.triggerAttackRelease("G2", "8n");
            },
            
            playWallBounce() {
                if (this.ready) this.wallSynth.triggerAttackRelease("32n");
            },

            playGoal() {
                if (!this.ready) return;
                const now = Tone.now();
                this.goalSynth.triggerAttackRelease(["C4", "E4", "G4"], "4n", now);
                this.goalSynth.triggerAttackRelease(["G4", "B4", "D5"], "4n", now + 0.2);
            },

            playWin() {
                if (!this.ready) return;
                const now = Tone.now();
                this.winSynth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "2n", now);
                this.winSynth.triggerAttackRelease(["F4", "A4", "C5", "F5"], "2n", now + 0.5);
                this.winSynth.triggerAttackRelease(["G4", "B4", "D5", "G5"], "1n", now + 1.0);
            }
        };

        const puck = {
            x: 0, y: 0,
            vx: 0, vy: 0,
            radius: 20,
            color: '#10b981', // Neon Green
            speedMultiplier: 1.02, // Increases speed slightly on hits
            maxSpeed: 25
        };

        function resetPuck(direction = 1) {
            puck.x = canvas.width / 2;
            puck.y = canvas.height / 2;
            // Launch towards the player who just scored, or random
            let angle = (Math.random() * Math.PI / 4) - (Math.PI / 8); // slight angle
            if (direction < 0) angle += Math.PI; // flip to left
            
            let startSpeed = 8;
            puck.vx = Math.cos(angle) * startSpeed;
            puck.vy = Math.sin(angle) * startSpeed;
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 15;
                this.vy = (Math.random() - 0.5) * 15;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.02;
                this.color = color;
                this.size = Math.random() * 6 + 2;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
                ctx.shadowBlur = 0;
            }
        }

        function createExplosion(x, y, color, count = 20) {
            for(let i=0; i<count; i++) particles.push(new Particle(x, y, color));
        }

        function checkHandCollision(hand) {
            if (!hand.active) return;
            
            let dx = puck.x - hand.x;
            let dy = puck.y - hand.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < puck.radius + hand.radius) {
                // Collision detected!
                
                // Calculate push-out to prevent puck getting stuck inside hand
                let nx = dx / dist;
                let ny = dy / dist;
                puck.x = hand.x + nx * (puck.radius + hand.radius);
                puck.y = hand.y + ny * (puck.radius + hand.radius);

                // Calculate hand velocity based on previous frames
                hand.vx = hand.x - hand.prevX;
                hand.vy = hand.y - hand.prevY;
                let handSpeed = Math.sqrt(hand.vx*hand.vx + hand.vy*hand.vy);

                // Reflect puck velocity over normal, and add hand momentum
                let dotProduct = (puck.vx * nx + puck.vy * ny);
                puck.vx = puck.vx - 2 * dotProduct * nx + (hand.vx * 0.5);
                puck.vy = puck.vy - 2 * dotProduct * ny + (hand.vy * 0.5);

                // Add minimal speed so it doesn't just stop
                let currentSpeed = Math.sqrt(puck.vx*puck.vx + puck.vy*puck.vy);
                if (currentSpeed < 5) {
                    puck.vx = nx * 5; puck.vy = ny * 5;
                }

                // Cap max speed
                if (currentSpeed > puck.maxSpeed) {
                    puck.vx = (puck.vx / currentSpeed) * puck.maxSpeed;
                    puck.vy = (puck.vy / currentSpeed) * puck.maxSpeed;
                }

                AudioSys.playHit(handSpeed);
                createExplosion(puck.x, puck.y, hand.color, 10);
            }
        }

        function updatePhysics() {
            // Move Puck
            puck.x += puck.vx;
            puck.y += puck.vy;

            // Top and Bottom Walls
            if (puck.y - puck.radius < 0) {
                puck.y = puck.radius;
                puck.vy *= -1;
                AudioSys.playWallBounce();
            } else if (puck.y + puck.radius > canvas.height) {
                puck.y = canvas.height - puck.radius;
                puck.vy *= -1;
                AudioSys.playWallBounce();
            }

            // Check Hand Collisions
            checkHandCollision(p1Hand);
            checkHandCollision(p2Hand);

            // Goal Conditions (Left and Right Walls)
            if (puck.x < 0) {
                // Goal for Player 2 (Right)
                p2Score++;
                AudioSys.playGoal();
                createExplosion(0, puck.y, '#06b6d4', 40);
                checkWin();
                if(isGameRunning) resetPuck(-1);
            } else if (puck.x > canvas.width) {
                // Goal for Player 1 (Left)
                p1Score++;
                AudioSys.playGoal();
                createExplosion(canvas.width, puck.y, '#ec4899', 40);
                checkWin();
                if(isGameRunning) resetPuck(1);
            }
        }

        function checkWin() {
            if (p1Score >= WINNING_SCORE || p2Score >= WINNING_SCORE) {
                isGameRunning = false;
                AudioSys.stopBGM();
                AudioSys.playWin();
                
                let winnerTextStr = p1Score >= WINNING_SCORE ? "اللاعب الأول (أحمر) يفوز! 🎉" : "اللاعب الثاني (أزرق) يفوز! 🎉";
                let winnerColor = p1Score >= WINNING_SCORE ? "text-neon-pink" : "text-neon-blue";
                
                winnerText.className = `text-5xl font-extrabold mb-4 ${winnerColor}`;
                winnerText.innerText = winnerTextStr;
                finalScoreText.innerText = `${p1Score} - ${p2Score}`;
                
                gameOverScreen.classList.remove('hidden');
            }
        }

        function drawArena() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Center Line
            ctx.beginPath();
            ctx.setLineDash([15, 15]);
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.setLineDash([]);

            // Center Circle
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 80, 0, Math.PI * 2);
            ctx.stroke();

            // Scores
            ctx.font = 'bold 80px Arial';
            ctx.fillStyle = 'rgba(236, 72, 153, 0.3)'; // P1 Pink
            ctx.textAlign = 'center';
            ctx.fillText(p1Score, canvas.width / 4, 100);
            
            ctx.fillStyle = 'rgba(6, 182, 212, 0.3)'; // P2 Cyan
            ctx.fillText(p2Score, (canvas.width / 4) * 3, 100);
        }

        function drawHand(hand, name) {
            if (!hand.active) return;
            
            ctx.beginPath();
            ctx.arc(hand.x, hand.y, hand.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fill();
            
            ctx.lineWidth = 6;
            ctx.strokeStyle = hand.color;
            ctx.shadowBlur = 20;
            ctx.shadowColor = hand.color;
            ctx.stroke();
            ctx.shadowBlur = 0; // reset

            // Inner design
            ctx.beginPath();
            ctx.arc(hand.x, hand.y, hand.radius - 15, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function drawPuck() {
            ctx.beginPath();
            ctx.arc(puck.x, puck.y, puck.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            
            ctx.lineWidth = 4;
            ctx.strokeStyle = puck.color;
            ctx.shadowBlur = 25;
            ctx.shadowColor = puck.color;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            if (!isGameRunning) return;

            updatePhysics();
            drawArena();
            drawHand(p1Hand, 'P1');
            drawHand(p2Hand, 'P2');
            drawPuck();

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(gameLoop);
        }

        function onResults(results) {
            if (!isModelLoaded) {
                isModelLoaded = true;
                loadingIndicator.classList.add('hidden');
                startBtn.classList.remove('hidden');
                resizeCanvas();
            }

            // Save previous positions to calculate velocity
            p1Hand.prevX = p1Hand.x; p1Hand.prevY = p1Hand.y;
            p2Hand.prevX = p2Hand.x; p2Hand.prevY = p2Hand.y;

            p1Hand.active = false;
            p2Hand.active = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    const palm = landmarks[9]; // Middle finger MCP used as center
                    
                    // Mirror X coordinate
                    let x = (1 - palm.x) * canvas.width;
                    let y = palm.y * canvas.height;

                    // Assign hand to P1 (Left Side) or P2 (Right Side)
                    if (x < canvas.width / 2) {
                        p1Hand.x = x; p1Hand.y = y;
                        p1Hand.active = true;
                    } else {
                        p2Hand.x = x; p2Hand.y = y;
                        p2Hand.active = true;
                    }
                }
            }
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({
            maxNumHands: 2, // Track up to 2 hands (one for each player)
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({image: video});
            },
            width: 640,
            height: 480,
            facingMode: 'user'
        });

        // Initialize Camera
        camera.start().catch(err => {
            loadingIndicator.innerHTML = '<p style="color:red">فشل الوصول للكاميرا. يرجى إعطاء الصلاحية.</p>';
        });

        function startGame() {
            AudioSys.init().then(() => {
                p1Score = 0;
                p2Score = 0;
                particles = [];
                resetPuck(1);
                isGameRunning = true;
                
                startScreen.classList.add('hidden');
                gameOverScreen.classList.add('hidden');
                
                AudioSys.playBGM();
                gameLoop();
            });
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

    </script>
    <script src="remote-nav.js"></script>
</body>
</html>
