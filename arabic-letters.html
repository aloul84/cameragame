<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة صائد الحروف</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe for Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <!-- Tone.js for Audio Synthesis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        #video-feed {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror */
            opacity: 0.3; /* Make video dark so game elements stand out */
            z-index: 1;
        }

        #game-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Overlay UI panels */
        .overlay-panel {
            position: absolute;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #3b82f6;
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: opacity 0.3s ease;
        }

        .btn {
            background: linear-gradient(to right, #3b82f6, #2563eb);
            color: white;
            font-size: 1.25rem;
            font-weight: bold;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.5);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(59, 130, 246, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.4);
        }

        /* Loading Spinner */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem auto;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .hidden { display: none !important; }
        
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <video id="video-feed" autoplay playsinline></video>
        <canvas id="game-canvas"></canvas>
        
        <!-- HUD (Heads Up Display) drawn via Canvas, but we keep an overlay layer if needed -->
        <div id="hud" class="hidden"></div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay-panel">
            <h1 class="text-4xl font-bold text-blue-400 mb-2">صائد الحروف</h1>
            <p class="text-gray-300 mb-6 text-lg">استخدم كف يدك لجمع الحروف المطلوبة.<br>اجمع 3 أحرف متطابقة لتغيير الهدف!</p>
            
            <div id="loading-indicator">
                <div class="spinner"></div>
                <p class="text-blue-300">جاري تهيئة الكاميرا والذكاء الاصطناعي...</p>
            </div>
            
            <button id="start-btn" class="btn hidden">ابدأ اللعب</button>
        </div>

        <!-- شاشة نهاية اللعبة -->
        <div id="game-over-screen" class="overlay-panel hidden">
            <h1 class="text-4xl font-bold text-red-500 mb-2">انتهت اللعبة!</h1>
            <p class="text-gray-300 mb-4 text-xl">لقد جمعت 3 أحرف خاطئة.</p>
            <p class="text-white font-bold text-2xl mb-6">النقاط النهائية: <span id="final-score" class="text-blue-400">0</span></p>
            <button id="restart-btn" class="btn" style="background: linear-gradient(to right, #ef4444, #b91c1c); box-shadow: 0 4px 6px rgba(239, 68, 68, 0.5);">العب مرة أخرى</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const loadingIndicator = document.getElementById('loading-indicator');
        const startBtn = document.getElementById('start-btn');
        const gameOverScreen = document.getElementById('game-over-screen');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreSpan = document.getElementById('final-score');

        // Game State Variables
        let isGameRunning = false;
        let isModelLoaded = false;
        let animationFrameId;
        
        let score = 0;
        let currentTargetLetter = 'أ';
        let collectedCount = 0; // Out of 3
        let wrongCount = 0; // عداد الأخطاء
        const MAX_WRONG = 3; // الحد الأقصى للأخطاء قبل انتهاء اللعبة
        
        let fallingLetters = [];
        let particles = [];
        
        // Hand position tracking (mapped to canvas)
        let handPos = { x: -100, y: -100, active: false };
        const handHitRadius = 40;

        const LETTERS = "أبتثجحخدذرزسشصضطظعغفقكلمنهوي";

        // Resize Canvas to fit screen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const AudioSys = {
            ready: false,
            bgmSynth: null,
            bgmLoop: null,
            fxSynth: null,
            successSynth: null,
            gameOverSynth: null,
            
            async init() {
                if (this.ready) return;
                await Tone.start();
                
                // Background Music Synth (Soft Mallet/Pluck)
                this.bgmSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.05, decay: 0.5, sustain: 0.1, release: 1 }
                }).toDestination();
                this.bgmSynth.volume.value = -15; // Low volume

                // Sequence for BGM
                const notes = ["C3", "E3", "G3", "B3", "A3", "F3", "D3", "G3"];
                let step = 0;
                this.bgmLoop = new Tone.Loop((time) => {
                    this.bgmSynth.triggerAttackRelease(notes[step % notes.length], "8n", time);
                    step++;
                }, "4n");

                // FX Synth for collecting (High ping)
                this.fxSynth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 }
                }).toDestination();
                this.fxSynth.volume.value = -5;

                // Success/Level Up Synth (Chord/Arpeggio)
                this.successSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "square" },
                    envelope: { attack: 0.05, decay: 0.3, sustain: 0.2, release: 1 }
                }).toDestination();
                this.successSynth.volume.value = -8;
                
                // Wrong sound
                this.wrongSynth = new Tone.MembraneSynth().toDestination();
                this.wrongSynth.volume.value = -10;

                // صوت انتهاء اللعبة
                this.gameOverSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.1, decay: 0.5, sustain: 0.2, release: 2 }
                }).toDestination();
                this.gameOverSynth.volume.value = -5;

                Tone.Transport.start();
                this.ready = true;
            },

            playBGM() {
                if (this.ready) this.bgmLoop.start(0);
            },
            
            stopBGM() {
                if (this.ready) this.bgmLoop.stop();
            },

            playCollectCorrect() {
                if (!this.ready) return;
                this.fxSynth.triggerAttackRelease("C6", "16n");
            },

            playCollectWrong() {
                if (!this.ready) return;
                this.wrongSynth.triggerAttackRelease("C2", "16n");
            },

            playLevelUp() {
                if (!this.ready) return;
                const now = Tone.now();
                this.successSynth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);
                this.successSynth.triggerAttackRelease(["E4", "G4", "C5"], "8n", now + 0.15);
                this.successSynth.triggerAttackRelease(["G4", "C5", "E5"], "4n", now + 0.3);
            },

            playGameOver() {
                if (!this.ready) return;
                const now = Tone.now();
                // نغمة حزينة للنهاية
                this.gameOverSynth.triggerAttackRelease(["C3", "Eb3", "Gb3"], "2n", now);
                this.gameOverSynth.triggerAttackRelease(["C2", "Eb2", "Gb2"], "1n", now + 0.5);
            }
        };

        class FallingLetter {
            constructor() {
                // 30% chance to be the target letter, 70% random
                if (Math.random() < 0.3) {
                    this.char = currentTargetLetter;
                } else {
                    this.char = LETTERS[Math.floor(Math.random() * LETTERS.length)];
                }
                
                this.radius = Math.random() * 10 + 25; // 25 to 35
                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                this.y = -this.radius * 2;
                
                // Speed depends on screen height to keep feel consistent
                this.speed = (Math.random() * 2 + 3) * (canvas.height / 800); 
                
                // Colors based on if it's the target
                if (this.char === currentTargetLetter) {
                    this.color = '#10b981'; // Emerald Green
                    this.glow = '#34d399';
                } else {
                    this.color = '#3b82f6'; // Blue
                    this.glow = '#93c5fd';
                }
                
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
                this.markedForDeletion = false;
            }

            update() {
                this.y += this.speed;
                this.rotation += this.rotationSpeed;
                if (this.y > canvas.height + this.radius) {
                    this.markedForDeletion = true;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                // Bubble effect
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = this.color;
                
                // Add glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.glow;
                ctx.stroke();
                ctx.shadowBlur = 0; // reset
                
                // Text
                ctx.fillStyle = 'white';
                ctx.font = `bold ${this.radius * 1.2}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Rotate back for text so it stays upright if preferred, but spinning text is fun
                ctx.fillText(this.char, 0, 2);
                
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1.0;
                this.decay = Math.random() * 0.05 + 0.02;
                this.color = color;
                this.size = Math.random() * 5 + 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<15; i++){
                particles.push(new Particle(x, y, color));
            }
        }

        function setNewTarget() {
            let newLetter;
            do {
                newLetter = LETTERS[Math.floor(Math.random() * LETTERS.length)];
            } while (newLetter === currentTargetLetter);
            
            currentTargetLetter = newLetter;
            collectedCount = 0;
            
            // Create a burst of particles at the basket
            createExplosion(50, 50, '#f59e0b'); // Yellow explosion
        }

        function drawBasketAndUI() {
            // Draw Score
            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'right';
            ctx.fillText(`النقاط: ${score}`, canvas.width - 20, 40);

            // رسم القلوب (الأرواح المتبقية)
            const livesLeft = MAX_WRONG - wrongCount;
            for (let i = 0; i < MAX_WRONG; i++) {
                ctx.fillStyle = i < livesLeft ? '#ef4444' : 'rgba(255,255,255,0.2)'; // أحمر إذا كانت الروح موجودة، ورمادي باهت إذا فقدت
                ctx.font = '24px Arial';
                ctx.textAlign = 'right';
                ctx.fillText('❤', canvas.width - 20 - (i * 30), 75);
            }

            // Draw Basket (Target Area) - Top Left (mirrored visually to right for user, but coordinates are literal)
            const basketX = 20;
            const basketY = 20;
            const basketWidth = 140;
            const basketHeight = 80;

            // Box
            ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#3b82f6';
            
            ctx.beginPath();
            ctx.roundRect(basketX, basketY, basketWidth, basketHeight, 15);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Target Letter
            ctx.fillStyle = '#f59e0b'; // Amber
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(currentTargetLetter, basketX + 20, basketY + 50);

            // Progress circles
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(basketX + 75 + (i * 20), basketY + 40, 6, 0, Math.PI * 2);
                if (i < collectedCount) {
                    ctx.fillStyle = '#10b981'; // Filled green
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = '#10b981';
                } else {
                    ctx.fillStyle = 'rgba(255,255,255,0.2)'; // Empty
                    ctx.shadowBlur = 0;
                }
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        function drawHandCursor() {
            if (!handPos.active) return;
            
            // Draw a glowing orb at the palm position
            ctx.beginPath();
            ctx.arc(handPos.x, handPos.y, handHitRadius, 0, Math.PI * 2);
            
            const gradient = ctx.createRadialGradient(handPos.x, handPos.y, 5, handPos.x, handPos.y, handHitRadius);
            gradient.addColorStop(0, 'rgba(236, 72, 153, 0.8)'); // Pink center
            gradient.addColorStop(1, 'rgba(236, 72, 153, 0.0)'); // Transparent edge
            
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Core dot
            ctx.beginPath();
            ctx.arc(handPos.x, handPos.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#fbcfe8';
            ctx.fill();
        }

        let frameCounter = 0;
        function gameLoop() {
            if (!isGameRunning) return;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Spawn new letters
            frameCounter++;
            if (frameCounter % 40 === 0) { // Adjust frequency here
                fallingLetters.push(new FallingLetter());
            }

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Update & Draw Letters & Check Collision
            for (let i = fallingLetters.length - 1; i >= 0; i--) {
                const letter = fallingLetters[i];
                letter.update();
                
                // Collision Detection (Circle collision between hand and letter)
                if (handPos.active) {
                    const dx = handPos.x - letter.x;
                    const dy = handPos.y - letter.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < handHitRadius + letter.radius) {
                        // Collision occurred!
                        letter.markedForDeletion = true;
                        createExplosion(letter.x, letter.y, letter.color);

                        if (letter.char === currentTargetLetter) {
                            // Correct Letter
                            AudioSys.playCollectCorrect();
                            collectedCount++;
                            score += 10;
                            
                            if (collectedCount >= 3) {
                                AudioSys.playLevelUp();
                                score += 50; // Bonus for completion
                                setTimeout(setNewTarget, 200); // Slight delay for visual satisfaction
                            }
                        } else {
                            // Wrong Letter
                            wrongCount++; // زيادة عداد الأخطاء
                            if (wrongCount >= MAX_WRONG) {
                                // حالة الخسارة (Game Over)
                                isGameRunning = false;
                                AudioSys.stopBGM();
                                AudioSys.playGameOver();
                                gameOverScreen.classList.remove('hidden');
                                finalScoreSpan.innerText = score;
                            } else {
                                AudioSys.playCollectWrong();
                                score = Math.max(0, score - 5); // خصم نقاط عند الخطأ
                            }
                        }
                    }
                }

                if (letter.markedForDeletion) {
                    fallingLetters.splice(i, 1);
                } else {
                    letter.draw(ctx);
                }
            }

            drawHandCursor();
            drawBasketAndUI();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function onResults(results) {
            if (!isModelLoaded) {
                isModelLoaded = true;
                loadingIndicator.classList.add('hidden');
                startBtn.classList.remove('hidden');
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // We use landmark 9 (Middle finger MCP / Knuckle) as the center of the palm hit area
                const palmCenter = landmarks[9];
                
                // Mirror the X coordinate because the video is mirrored
                handPos.x = (1 - palmCenter.x) * canvas.width;
                handPos.y = palmCenter.y * canvas.height;
                handPos.active = true;
            } else {
                handPos.active = false;
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1, // Track 1 hand
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });
        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({image: video});
            },
            width: 640,
            height: 480,
            facingMode: 'user'
        });

        // Initialize Camera (this starts loading models)
        camera.start().catch(err => {
            console.error(err);
            loadingIndicator.innerHTML = '<p style="color:red">فشل الوصول للكاميرا. يرجى إعطاء الصلاحية.</p>';
        });

        startBtn.addEventListener('click', async () => {
            // Initialize Audio (must be on user interaction)
            await AudioSys.init();
            
            // Hide start screen
            startScreen.classList.add('hidden');
            
            // Reset Game state
            score = 0;
            collectedCount = 0;
            wrongCount = 0;
            fallingLetters = [];
            particles = [];
            setNewTarget();
            
            // Start logic
            isGameRunning = true;
            AudioSys.playBGM();
            gameLoop();
        });

        // زر إعادة اللعب بعد الخسارة
        restartBtn.addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            
            // إعادة ضبط حالة اللعبة
            score = 0;
            collectedCount = 0;
            wrongCount = 0;
            fallingLetters = [];
            particles = [];
            setNewTarget();
            
            // بدء اللعبة من جديد
            isGameRunning = true;
            AudioSys.playBGM();
            gameLoop();
        });

    </script>
    <script src="remote-nav.js"></script>
</body>
</html>
