<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لعبة صائد الحروف</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="game-common.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0f172a; color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; touch-action: none;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game-container {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        #video-feed {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; transform: scaleX(-1); opacity: 0.3; z-index: 1;
        }
        #game-canvas { position: absolute; top: 0; left: 0; z-index: 2; }

        #panel {
            position: absolute; z-index: 10;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: min(92vw, 480px); max-height: 94vh; overflow-y: auto;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #3b82f6; border-radius: 1rem;
            padding: clamp(14px, 4vw, 32px);
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        #panel h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 7vw, 2.6rem); font-weight: 800; color: #60a5fa; }
        #panel p { margin: 0 0 12px; color: #cbd5e1; line-height: 1.6; font-size: clamp(0.95rem, 3.6vw, 1.15rem); }
        #stats { color: #fbbf24 !important; font-weight: bold; }

        .btn {
            font-family: inherit;
            background: linear-gradient(to right, #3b82f6, #2563eb);
            color: white; font-size: clamp(1.05rem, 4.4vw, 1.3rem); font-weight: bold;
            padding: 0.75rem 2.2rem; border: none; border-radius: 9999px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.5); transition: transform 0.1s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(1px); }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1); width: 44px; height: 44px; border-radius: 50%;
            border-left-color: #3b82f6; animation: spin 1s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        @media (max-height: 460px) { #panel p { margin-bottom: 6px; } #panel h1 { margin-bottom: 4px; } }
    </style>
</head>
<body>

    <div id="game-container">
        <video id="video-feed" autoplay playsinline muted></video>
        <canvas id="game-canvas"></canvas>

        <div id="panel">
            <h1 id="panel-title">صائد الحروف</h1>
            <p id="panel-desc">المس الحروف بكف يدك (أو بإصبعك) لجمع الحرف المطلوب.<br>اجمع 3 أحرف متطابقة لتنتقل لحرف جديد ومستوى أسرع!</p>
            <div id="loading-indicator">
                <div class="spinner"></div>
                <p>جاري تهيئة الكاميرا والذكاء الاصطناعي...</p>
            </div>
            <p id="stats" class="hidden"></p>
            <button id="start-btn" class="btn hidden">ابدأ اللعب</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const panel = document.getElementById('panel');
        const panelTitle = document.getElementById('panel-title');
        const panelDesc = document.getElementById('panel-desc');
        const loadingIndicator = document.getElementById('loading-indicator');
        const startBtn = document.getElementById('start-btn');
        const statsEl = document.getElementById('stats');
        const input = GC.input;

        const LETTERS = 'أبتثجحخدذرزسشصضطظعغفقكلمنهوي';
        const LETTER_NAMES = { 'أ': 'ألف', 'ب': 'باء', 'ت': 'تاء', 'ث': 'ثاء', 'ج': 'جيم', 'ح': 'حاء', 'خ': 'خاء', 'د': 'دال', 'ذ': 'ذال', 'ر': 'راء', 'ز': 'زاي', 'س': 'سين', 'ش': 'شين', 'ص': 'صاد', 'ض': 'ضاد', 'ط': 'طاء', 'ظ': 'ظاء', 'ع': 'عين', 'غ': 'غين', 'ف': 'فاء', 'ق': 'قاف', 'ك': 'كاف', 'ل': 'لام', 'م': 'ميم', 'ن': 'نون', 'ه': 'هاء', 'و': 'واو', 'ي': 'ياء' };
        const COLORS = ['#3b82f6', '#a855f7', '#ec4899', '#f59e0b', '#14b8a6', '#ef4444', '#84cc16'];
        const MAX_WRONG = 3;
        const NEED = 3; // عدد الحروف المطلوب جمعها في كل هدف

        let isRunning = false;
        let score = 0, level = 1, combo = 0;
        let best = GC.store.get('letters_best');
        let target = 'أ';
        let collected = 0;
        let wrong = 0;
        let letters = [];
        let particles = [];
        let spawnTimer = 0;
        let flash = { c: '', t: 0 };
        let banner = { text: '', t: 0 };
        let w = 0, h = 0, unit = 30;

        const hand = { x: 0, y: 0 };

        GC.fitCanvas(canvas, (nw, nh) => {
            w = nw; h = nh;
            unit = Math.max(24, Math.min(46, Math.min(w, h) * 0.07));
        });

        /* ---------------- الصوت ---------------- */
        const AudioSys = {
            ready: false,
            async init() {
                if (this.ready || typeof Tone === 'undefined') return;
                try { await Tone.start(); } catch (e) { return; }
                this.bgmSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.05, decay: 0.5, sustain: 0.1, release: 1 }
                }).toDestination();
                this.bgmSynth.volume.value = -16;
                const notes = ['C3', 'E3', 'G3', 'B3', 'A3', 'F3', 'D3', 'G3'];
                let step = 0;
                this.bgmLoop = new Tone.Loop((time) => {
                    this.bgmSynth.triggerAttackRelease(notes[step % notes.length], '8n', time);
                    step++;
                }, '4n');
                this.fxSynth = new Tone.Synth({
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.1 }
                }).toDestination();
                this.fxSynth.volume.value = -5;
                this.successSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'square' },
                    envelope: { attack: 0.05, decay: 0.3, sustain: 0.2, release: 1 }
                }).toDestination();
                this.successSynth.volume.value = -10;
                this.wrongSynth = new Tone.MembraneSynth().toDestination();
                this.wrongSynth.volume.value = -10;
                this.gameOverSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'sawtooth' },
                    envelope: { attack: 0.1, decay: 0.5, sustain: 0.2, release: 2 }
                }).toDestination();
                this.gameOverSynth.volume.value = -8;
                Tone.Transport.start();
                this.ready = true;
            },
            safe(fn) { if (!this.ready) return; try { fn(); } catch (e) { /* تجاهل أخطاء التوقيت */ } },
            playBGM() { if (this.ready) { this.bgmLoop.stop(); this.bgmLoop.start(0); } },
            stopBGM() { if (this.ready) this.bgmLoop.stop(); },
            correct() { this.safe(() => this.fxSynth.triggerAttackRelease(Tone.Frequency('C6').transpose(Math.min(combo, 7)), '16n')); },
            wrongHit() { this.safe(() => this.wrongSynth.triggerAttackRelease('C2', '16n')); },
            levelUp() {
                this.safe(() => {
                    const now = Tone.now();
                    this.successSynth.triggerAttackRelease(['C4', 'E4', 'G4'], '8n', now);
                    this.successSynth.triggerAttackRelease(['E4', 'G4', 'C5'], '8n', now + 0.15);
                    this.successSynth.triggerAttackRelease(['G4', 'C5', 'E5'], '4n', now + 0.3);
                });
            },
            gameOver() {
                this.safe(() => {
                    const now = Tone.now();
                    this.gameOverSynth.triggerAttackRelease(['C3', 'Eb3', 'Gb3'], '2n', now);
                    this.gameOverSynth.triggerAttackRelease(['C2', 'Eb2', 'Gb2'], '1n', now + 0.5);
                });
            }
        };

        // نطق اسم الحرف الجديد (اختياري، يعمل إن توفّر صوت عربي في الجهاز)
        function speak(text) {
            try {
                if (!window.speechSynthesis) return;
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'ar-SA'; u.rate = 0.9;
                speechSynthesis.speak(u);
            } catch (e) { /* تجاهل */ }
        }

        /* ---------------- منطق اللعبة ---------------- */
        function burst(x, y, color, n = 15) {
            for (let i = 0; i < n; i++) {
                particles.push({ x, y, color, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 10, life: 1, size: Math.random() * 5 + 2 });
            }
        }

        function setNewTarget() {
            let c;
            do { c = LETTERS[Math.floor(Math.random() * LETTERS.length)]; } while (c === target);
            target = c;
            collected = 0;
            speak(LETTER_NAMES[target] || target);
        }

        function spawnLetter() {
            const char = Math.random() < 0.35 ? target : LETTERS[Math.floor(Math.random() * LETTERS.length)];
            const r = unit * (0.85 + Math.random() * 0.3);
            const speed = h * Math.min(0.55, 0.17 + level * 0.025) * (0.85 + Math.random() * 0.3); // بكسل في الثانية
            letters.push({
                char, r,
                x: r + Math.random() * (w - 2 * r),
                y: -r * 2,
                speed,
                color: COLORS[Math.floor(Math.random() * COLORS.length)],
                phase: Math.random() * 6.28,
                sway: (Math.random() - 0.5) * unit * 1.2
            });
        }

        function updateGame(dt, now) {
            if (input.active) {
                // تنعيم بسيط لحركة اليد
                const f = Math.min(1, dt * 20);
                hand.x += (input.x - hand.x) * f;
                hand.y += (input.y - hand.y) * f;
            }
            if (!isRunning) return;

            spawnTimer -= dt;
            if (spawnTimer <= 0) {
                spawnLetter();
                spawnTimer = Math.max(0.4, 1.05 - level * 0.05) * (0.8 + Math.random() * 0.4);
            }

            const hitR = unit * 1.15;
            for (let i = letters.length - 1; i >= 0; i--) {
                const L = letters[i];
                L.y += L.speed * dt;
                L.phase += dt * 2;
                const lx = L.x + Math.sin(L.phase) * L.sway * 0.3;
                if (L.y > h + L.r * 2) { letters.splice(i, 1); continue; }

                if (input.active && Math.hypot(hand.x - lx, hand.y - L.y) < hitR + L.r) {
                    letters.splice(i, 1);
                    if (L.char === target) {
                        combo++;
                        collected++;
                        score += 10 * Math.min(combo, 5);
                        burst(lx, L.y, '#34d399');
                        flash = { c: '52,211,153', t: 0.15 };
                        AudioSys.correct();
                        if (collected >= NEED) {
                            score += 50;
                            level++;
                            AudioSys.levelUp();
                            burst(w / 2, h * 0.3, '#fbbf24', 40);
                            banner = { text: `المستوى ${level} 🚀`, t: 1.5 };
                            setNewTarget();
                        }
                    } else {
                        combo = 0;
                        wrong++;
                        burst(lx, L.y, '#ef4444');
                        flash = { c: '239,68,68', t: 0.3 };
                        GC.vibrate(120);
                        if (wrong >= MAX_WRONG) { endGame(); return; }
                        AudioSys.wrongHit();
                        score = Math.max(0, score - 5);
                    }
                }
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.04;
                if (p.life <= 0) particles.splice(i, 1);
            }
            if (flash.t > 0) flash.t -= dt;
            if (banner.t > 0) banner.t -= dt;
        }

        function endGame() {
            isRunning = false;
            AudioSys.stopBGM();
            AudioSys.gameOver();
            let msg = `جمعت 3 أحرف خاطئة.<br>النقاط النهائية: <b>${score}</b> — المستوى ${level}`;
            if (score > best) { best = score; GC.store.set('letters_best', best); msg += '<br>🎉 رقم قياسي جديد!'; }
            panelTitle.textContent = 'انتهت اللعبة!';
            panelTitle.style.color = '#ef4444';
            panelDesc.innerHTML = msg;
            startBtn.textContent = 'العب مرة أخرى';
            showPanel();
        }

        function showPanel() {
            loadingIndicator.classList.add('hidden');
            startBtn.classList.remove('hidden');
            statsEl.textContent = best ? `🏆 أفضل نتيجة: ${best}` : '';
            statsEl.classList.toggle('hidden', !best);
            panel.classList.remove('hidden');
        }

        async function startGame() {
            await AudioSys.init();
            panel.classList.add('hidden');
            score = 0; level = 1; combo = 0; collected = 0; wrong = 0;
            letters = []; particles = [];
            spawnTimer = 0.3;
            target = 'ب';
            setNewTarget();
            banner = { text: 'اجمع الحرف المطلوب!', t: 1.8 };
            isRunning = true;
            AudioSys.playBGM();
        }
        startBtn.addEventListener('click', startGame);

        /* ---------------- الرسم ---------------- */
        function drawLetter(L) {
            const x = L.x + Math.sin(L.phase) * L.sway * 0.3;
            ctx.beginPath();
            ctx.arc(x, L.y, L.r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = L.color;
            ctx.shadowBlur = 15; ctx.shadowColor = L.color;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${L.r * 1.25}px Arial`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(L.char, x, L.y + L.r * 0.06);
        }

        function drawHud() {
            const fs = Math.max(16, Math.min(w * 0.045, 28));
            ctx.shadowBlur = 0;
            // النقاط والقلوب (يمين)
            ctx.textBaseline = 'top'; ctx.textAlign = 'right';
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${fs}px Arial`;
            ctx.fillText(`النقاط: ${score}`, w - 14, 14);
            ctx.font = `${fs * 0.75}px Arial`;
            ctx.fillStyle = '#fbbf24';
            ctx.fillText(`المستوى ${level}${combo >= 2 ? '  •  🔥 x' + Math.min(combo, 5) : ''}`, w - 14, 14 + fs * 1.3);
            for (let i = 0; i < MAX_WRONG; i++) {
                ctx.fillStyle = i < MAX_WRONG - wrong ? '#ef4444' : 'rgba(255,255,255,0.2)';
                ctx.font = `${fs}px Arial`;
                ctx.fillText('❤', w - 14 - i * fs * 1.2, 14 + fs * 2.4);
            }

            // الحرف المطلوب (يسار)
            const bw = Math.max(120, fs * 5.2), bh = Math.max(64, fs * 2.8), bx = 14, by = 14;
            ctx.fillStyle = 'rgba(30, 41, 59, 0.85)';
            ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 3;
            ctx.shadowBlur = 10; ctx.shadowColor = '#3b82f6';
            ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 15); ctx.fill(); ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#f59e0b';
            ctx.font = `bold ${bh * 0.62}px Arial`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(target, bx + bw * 0.3, by + bh * 0.54);
            for (let i = 0; i < NEED; i++) {
                ctx.beginPath();
                ctx.arc(bx + bw * 0.58 + i * bw * 0.14, by + bh / 2, bh * 0.09, 0, Math.PI * 2);
                ctx.fillStyle = i < collected ? '#10b981' : 'rgba(255,255,255,0.2)';
                ctx.fill();
            }

            if (banner.t > 0) {
                ctx.globalAlpha = Math.min(1, banner.t);
                ctx.font = `bold ${Math.max(26, Math.min(w * 0.09, 56))}px Tahoma`;
                ctx.fillStyle = '#fff'; ctx.shadowColor = '#3b82f6'; ctx.shadowBlur = 20;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(banner.text, w / 2, h * 0.42);
                ctx.shadowBlur = 0; ctx.globalAlpha = 1;
            }
            if (!input.active) {
                ctx.font = `bold ${Math.max(14, Math.min(w * 0.04, 22))}px Tahoma`;
                ctx.fillStyle = 'rgba(255,120,120,0.95)';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('ارفع كف يدك أمام الكاميرا أو المس الشاشة', w / 2, h - 30);
            }
        }

        function drawHand() {
            if (!input.active) return;
            const r = unit * 1.15;
            const g = ctx.createRadialGradient(hand.x, hand.y, 4, hand.x, hand.y, r);
            g.addColorStop(0, 'rgba(236, 72, 153, 0.85)');
            g.addColorStop(1, 'rgba(236, 72, 153, 0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(hand.x, hand.y, r, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(hand.x, hand.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#fbcfe8'; ctx.fill();
        }

        let lastT = performance.now();
        function loop(now) {
            const dt = Math.max(0.001, Math.min((now - lastT) / 1000, 0.05));
            lastT = now;
            updateGame(dt, now);

            GC.begin(ctx);
            ctx.clearRect(0, 0, w, h);
            if (flash.t > 0) { ctx.fillStyle = `rgba(${flash.c},${Math.min(0.25, flash.t)})`; ctx.fillRect(0, 0, w, h); }
            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;
            letters.forEach(drawLetter);
            drawHand();
            if (isRunning) drawHud();
            requestAnimationFrame(loop);
        }

        /* ---------------- الكاميرا ---------------- */
        function cameraDone(failed) {
            if (failed) panelDesc.innerHTML = 'الكاميرا غير متاحة — يمكنك اللعب بإصبعك أو بالفأرة: المس الحروف المطلوبة قبل أن تسقط.';
            showPanel();
        }

        async function initCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof Hands === 'undefined') {
                cameraDone(true);
                return;
            }
            try {
                const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
                const mobile = /Android|iPhone|iPad|Mobi/i.test(navigator.userAgent);
                hands.setOptions({ maxNumHands: 1, modelComplexity: mobile ? 0 : 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
                hands.onResults((results) => {
                    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        const p = results.multiHandLandmarks[0][9];
                        GC.setHand(p.x, p.y);
                    } else {
                        GC.clearHand();
                    }
                });
                await GC.startCamera(video, hands);
                cameraDone(false);
            } catch (err) {
                console.error(err);
                cameraDone(true);
            }
        }

        requestAnimationFrame(loop);
        initCamera();
    </script>
    <script src="remote-nav.js"></script>
</body>
</html>
