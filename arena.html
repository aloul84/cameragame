<!-- نسخة محلية من الخطوط (يجهّزها tools/arena-offline.ps1) حتى لا يتعطّل الجناح إن ضعف الإنترنت -->

  .grid select, .grid input[type=text] { font-family: inherit; font-size: 0.95rem; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.35); color: #fff; }

<body>
<canvas id="stage"></canvas>
<video id="cam" playsinline muted></video>

<div id="boot">

      <b>Space</b> start / skip · <b>1</b> play vs AI now · <b>R</b> reset · <b>S</b> save photo · <b>D</b> debug · <b>L L</b> clear leaderboard · <b>Esc</b> settings
    </div>

<script>
(() => {
'use strict';

/* =====================================================================
   FATH ARENA — صدام الطاقة
   لعبة جناح عرض: لاعبان أو لاعب ضد «ذكاء فذ». كل لاعب يطلق شعاع طاقة
   من يديه، ومن يحرّك ذراعيه أسرع يدفع نقطة الصدام نحو خصمه.
   ===================================================================== */

/* ---------------- الإعدادات ---------------- */
const Q = new URLSearchParams(location.search);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* تجاهل */ } }
};
const DEFAULTS = { difficulty: 'normal', rounds: 3, roundTime: 25, view: 'camera', model: 'lite', event: 'WEB SUMMIT QATAR', volume: 0.85, announcer: true, camId: '' };
const S = Object.assign({}, DEFAULTS, LS.get('fath_arena_settings', {}));
if (Q.get('rounds')) S.rounds = +Q.get('rounds');
if (Q.get('model')) S.model = Q.get('model');
if (Q.get('event')) S.event = Q.get('event');
const saveSettings = () => LS.set('fath_arena_settings', S);
const SIM = Q.get('sim') === '1';                 // اختبار بلا كاميرا: أشخاص افتراضيون
const AUTOSTART = Q.get('autostart') === '1';
let DEBUG = Q.get('debug') === '1';
const QR_URL = 'https://www.fath-app.com/play.html';
const DIFF = {
  easy:   { m: 0.72, idle: 0.26, ease: 0.6,  jumpRate: 0.5, label: 'EASY' },
  normal: { m: 0.86, idle: 0.32, ease: 0.72, jumpRate: 0.9, label: 'NORMAL' },
  hard:   { m: 1.06, idle: 0.45, ease: 1.0,  jumpRate: 1.8, label: 'HARD' }
};
const COL = { L: '#22d3ee', R: '#ff3ea5', AI: '#ffb020', BRAND: '#159a85' };
const NAMES = [['FALCON', 'صقر'], ['TIGER', 'نمر'], ['THUNDER', 'رعد'], ['METEOR', 'نيزك'], ['STORM', 'عاصفة'], ['COMET', 'شهاب'],
  ['CHEETAH', 'فهد'], ['WOLF', 'ذئب'], ['DRAGON', 'تنين'], ['PHOENIX', 'عنقاء'], ['LIGHTNING', 'برق'], ['VOLCANO', 'بركان'],
  ['EAGLE', 'نسر'], ['PANTHER', 'نمر أسود'], ['CYCLONE', 'إعصار'], ['ROCKET', 'صاروخ'], ['TITAN', 'عملاق'], ['BLAZE', 'لهيب'], ['HAWK', 'باز'], ['LION', 'أسد']];

/* ---------------- أدوات ---------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const toAr = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const rgbOf = (h) => { const n = parseInt(h.slice(1), 16); return `${n >> 16},${(n >> 8) & 255},${n & 255}`; };
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const lbKey = () => 'fath_arena_lb_' + todayKey();
const statsKey = () => 'fath_arena_stats_' + todayKey();

/* ---------------- اللوحة والطبقات الثابتة ---------------- */
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha: false });
let W = 1280, H = 720, U = 7.2;
const vign = document.createElement('canvas');
const scan = document.createElement('canvas');
let scanPat = null;
const logo = new Image(); logo.src = 'fath-logo-white.png';
const STARS = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random() * 0.72, s: Math.random() * 1.6 + 0.3, p: Math.random() * TAU }));

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = innerWidth * dpr, h = innerHeight * dpr;
  const k = Math.min(1, Math.sqrt((1920 * 1200) / (w * h)));
  W = cv.width = Math.max(320, Math.round(w * k));
  H = cv.height = Math.max(240, Math.round(h * k));
  U = H / 100;
  vign.width = W; vign.height = H;
  const v = vign.getContext('2d');
  const g = v.createRadialGradient(W / 2, H * 0.48, H * 0.28, W / 2, H * 0.48, Math.hypot(W, H) * 0.62);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.85)');
  v.fillStyle = g; v.fillRect(0, 0, W, H);
  scan.width = 4; scan.height = 4;
  const s = scan.getContext('2d'); s.clearRect(0, 0, 4, 4); s.fillStyle = 'rgba(0,0,0,0.28)'; s.fillRect(0, 0, 4, 1);
  scanPat = ctx.createPattern(scan, 'repeat');
  updateVmap();
}

/* ---------------- الكاميرا وإسقاط المعالم على الشاشة ---------------- */
const video = document.getElementById('cam');
let vmap = { ox: 0, oy: 0, dw: 1280, dh: 720 };
let camOK = false, stream = null;
function updateVmap() {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const s = Math.max(W / vw, H / vh);
  vmap = { dw: vw * s, dh: vh * s, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2 };
}
async function startCamera(deviceId) {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  const v = deviceId ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
                     : { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } };
  stream = await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
  video.srcObject = stream;
  await video.play();
  camOK = true;
  updateVmap();
}

/* ---------------- نموذج تتبع الجسم (يعمل محلياً، ويقرأ من مجلد vendor إن وُجد) ---------------- */
const VISION_VER = '0.10.14';
let landmarker = null, aiOK = false, lastVideoTime = -1;
async function loadVision() {
  let mod, base;
  try { mod = await import('./vendor/tasks-vision/vision_bundle.mjs'); base = new URL('./vendor/tasks-vision/wasm', location.href).href; }
  catch (e) {
    mod = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VISION_VER}/vision_bundle.mjs`);
    base = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${VISION_VER}/wasm`;
  }
  const fs = await mod.FilesetResolver.forVisionTasks(base);
  const local = `./vendor/models/pose_landmarker_${S.model}.task`;
  let modelPath = `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${S.model}/float16/1/pose_landmarker_${S.model}.task`;
  try { const r = await fetch(local, { method: 'HEAD' }); if (r.ok) modelPath = local; } catch (e) { /* لا يوجد ملف محلي */ }
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath: modelPath, delegate }, runningMode: 'VIDEO', numPoses: 4,
    minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5
  });
  let lm;
  try { lm = await mod.PoseLandmarker.createFromOptions(fs, opts('GPU')); }
  catch (e) { lm = await mod.PoseLandmarker.createFromOptions(fs, opts('CPU')); }
  // تسخين: أول استدلال قد يستغرق ثوانيَ (تجهيز الـGPU)، فننجزه أثناء الإقلاع لا وسط اللعب
  const st = document.getElementById('stAI'); if (st) st.textContent = '🧠 Warming up AI…';
  await new Promise((r) => setTimeout(r, 80));
  try { const c = document.createElement('canvas'); c.width = 1280; c.height = 720; c.getContext('2d').fillRect(0, 0, 1280, 720); lm.detectForVideo(c, 1); } catch (e) { /* تجاهل */ }
  return lm;
}
function detect(ts) {
  if (!landmarker || !camOK || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  let res;
  try { res = landmarker.detectForVideo(video, ts); } catch (e) { return; }
  feedTracks(res.landmarks || [], 'real');
}

/* ---------------- تتبّع الأشخاص: هوية ثابتة، سرعة الذراعين، القفز، رفع اليدين ---------------- */
let tracks = [], nextTrackId = 1, nowS = 0, gameT = 0;
class Track {
  constructor(src) {
    this.id = nextTrackId++; this.src = src; this.P = null; this.raw = null; this.lastT = 0; this.sw = 0; this.cx = 0; this.cy = 0;
    this.speed = 0; this.jumps = 0; this.inAir = false; this.baseY = null; this.lastCy = null; this.handsUp = false; this.handsT = 0; this.bound = null;
  }
  feed(c, t) {
    const dt = this.lastT ? Math.max(0.008, t - this.lastT) : 0.033;
    if (!this.P) this.P = c.P.map((p) => ({ x: p.x, y: p.y, v: p.v }));
    else for (let i = 0; i < 33; i++) { const p = this.P[i], q = c.P[i]; p.x += (q.x - p.x) * 0.55; p.y += (q.y - p.y) * 0.55; p.v = q.v; }
    const sw = this.sw ? lerp(this.sw, c.sw, 0.25) : c.sw;
    if (this.raw && this.lastT) {
      // سرعة الرسغين والمرفقين بوحدة «عرض الكتفين في الثانية»
      let sum = 0, wsum = 0;
      for (const [i, wt] of [[15, 1], [16, 1], [13, 0.5], [14, 0.5]]) {
        const a = this.raw[i], b = c.P[i];
        if (a.v < 0.3 || b.v < 0.3) continue;
        sum += wt * Math.hypot(b.x - a.x, b.y - a.y); wsum += wt;
      }
      const sp = wsum ? (sum / wsum) / dt / sw : 0;
      this.speed = sp < 25 ? sp : this.speed * 0.5;      // تجاهل القفزات الخاطئة في الكشف
    }
    // القفز: ترتفع الكتفان عن خط الأساس بسرعة
    const shY = c.cy;
    if (this.baseY === null) this.baseY = shY;
    const rise = (this.baseY - shY) / sw, vy = this.lastCy !== null ? (this.lastCy - shY) / dt / sw : 0;
    if (Math.abs(rise) < 0.25) this.baseY += (shY - this.baseY) * Math.min(1, dt * 1.5);
    if (!this.inAir && rise > 0.32 && vy > 1.0) { this.inAir = true; this.jumps++; }
    if (this.inAir && rise < 0.12) this.inAir = false;
    // اليدان فوق الرأس = إشارة الانضمام
    const nose = c.P[0], wl = c.P[15], wr = c.P[16];
    const up = wl.v > 0.4 && wr.v > 0.4 && wl.y < nose.y && wr.y < nose.y;
    if (up) { if (!this.handsUp) { this.handsUp = true; this.handsT = t; } } else this.handsUp = false;
    this.raw = c.P; this.lastCy = shY; this.cx = c.cx; this.cy = c.cy; this.sw = sw; this.lastT = t;
  }
  get alive() { return nowS - this.lastT < 0.7; }
  handsHeld() { return this.handsUp ? nowS - this.handsT : 0; }
}
function candidates(poses) {
  const out = [];
  for (const lm of poses) {
    if (!lm || lm.length < 33) continue;
    const P = lm.map((l) => ({ x: vmap.ox + (1 - l.x) * vmap.dw, y: vmap.oy + l.y * vmap.dh, v: l.visibility === undefined ? 1 : l.visibility }));
    if (P[11].v < 0.4 || P[12].v < 0.4) continue;
    const sw = dist(P[11], P[12]);
    if (sw < H * 0.035) continue;                         // أشخاص بعيدون في الخلفية
    out.push({ P, sw, cx: (P[11].x + P[12].x) / 2, cy: (P[11].y + P[12].y) / 2 });
  }
  return out;
}
function feedTracks(poses, src) {
  const cands = candidates(poses), t = nowS;
  const mine = tracks.filter((tr) => tr.src === src);
  const pairs = [];
  mine.forEach((tr) => cands.forEach((c, ci) => pairs.push([Math.hypot(tr.cx - c.cx, tr.cy - c.cy), tr, ci])));
  pairs.sort((a, b) => a[0] - b[0]);
  const usedT = new Set(), usedC = new Set();
  for (const [d, tr, ci] of pairs) {
    if (usedT.has(tr) || usedC.has(ci) || d > Math.max(W * 0.16, tr.sw * 2.2)) continue;
    tr.feed(cands[ci], t); usedT.add(tr); usedC.add(ci);
  }
  cands.forEach((c, ci) => { if (!usedC.has(ci)) { const tr = new Track(src); tr.feed(c, t); tracks.push(tr); } });
  tracks = tracks.filter((tr) => nowS - tr.lastT < (tr.bound ? 3 : 0.8));
}
const getTrack = (id) => tracks.find((t) => t.id === id) || null;

/* ---------------- أشخاص افتراضيون (للعرض التجريبي وللاختبار) ---------------- */
function simPose(p, t) {
  const sw = p.size * H, cx = p.cx * W;
  let y0 = H * 0.4;
  const ja = t - (p.jumpT || -9);
  if (ja >= 0 && ja < 0.55) y0 -= Math.sin(Math.PI * ja / 0.55) * sw * 0.75;
  const P = new Array(33), V = (x, y) => ({ x, y });
  P[0] = V(cx, y0 - 0.8 * sw);
  P[1] = V(cx - 0.07 * sw, y0 - 0.88 * sw); P[2] = V(cx - 0.12 * sw, y0 - 0.88 * sw); P[3] = V(cx - 0.16 * sw, y0 - 0.88 * sw);
  P[4] = V(cx + 0.07 * sw, y0 - 0.88 * sw); P[5] = V(cx + 0.12 * sw, y0 - 0.88 * sw); P[6] = V(cx + 0.16 * sw, y0 - 0.88 * sw);
  P[7] = V(cx - 0.24 * sw, y0 - 0.8 * sw); P[8] = V(cx + 0.24 * sw, y0 - 0.8 * sw);
  P[9] = V(cx - 0.07 * sw, y0 - 0.66 * sw); P[10] = V(cx + 0.07 * sw, y0 - 0.66 * sw);
  const arm = (s, e, w, hs, side, ph) => {
    const S0 = V(cx + side * sw / 2, y0); P[s] = S0;
    let E, Wr;
    if (p.up) { E = V(S0.x + side * 0.28 * sw, S0.y - 0.62 * sw); Wr = V(S0.x + side * 0.22 * sw, S0.y - 1.25 * sw); }
    else {
      const th = t * TAU * (1.1 + 2.4 * p.pump) + ph, ex = 0.5 + 0.5 * Math.sin(th), k = Math.min(1, p.pump * 1.5);
      const rE = V(S0.x + side * 0.12 * sw, S0.y + 0.72 * sw), rW = V(S0.x + side * 0.16 * sw, S0.y + 1.38 * sw);

/* ---------------- منطق القتال ---------------- */

  sl.power += (target - sl.power) * Math.min(1, dt * (target > sl.power ? 9 : 2.6));
  if (tr && tr.jumps > sl.lastJumps) { sl.lastJumps = tr.jumps; if (physics) jumpBoost(sl); }

}
function aiUpdate(ai, hum, dt, physics) {
  const d = DIFF[S.difficulty] || DIFF.normal;
  ai.effort += (hum.power - ai.effort) * Math.min(1, dt / 1.8);
  if (!physics) { ai.power += (0.25 + Math.sin(gameT * 3) * 0.1 - ai.power) * Math.min(1, dt * 3); return; }
  let target = ai.effort < 0.16 ? d.idle : ai.effort * d.m;
  const aiDanger = ai.side === 'R' ? G.clashX : 1 - G.clashX;     // > 0.5 يعني أن الحاسوب يخسر
  if (aiDanger < 0.28 && ai.effort > 0.25) target *= d.ease;      // فرصة للعودة لمن يجتهد
  if (aiDanger > 0.72) target *= 1.04;
  if (gameT - G.fightStart < 4) target = Math.min(target, ai.effort * d.m + 0.1);   // مهلة لمن بدأ لتوّه
  ai.noise = clamp(ai.noise + (Math.random() - 0.5) * dt * 0.8, -0.1, 0.1) * (1 - dt * 0.4);
  target = clamp(target + ai.noise, 0.06, 1.05);
  ai.power += (target - ai.power) * Math.min(1, dt * 3);
  // ضربة خارقة درامية مرة واحدة في الجولة عندما يقترب الحاسوب من الخسارة

}

function fightUpdate(dt) {

  for (const sl of [L, R]) {

    sl.superM += sl.power * dt * 0.15 * (losing ? 1.7 : 1) * (sl.kind === 'ai' ? 0.7 : 1);

}

      const C = clashPoint();
      if (st === 'intro') { const k = clamp((el() - 1.2) / 2, 0, 1); drawBeam(SL.L, C, k); drawBeam(SL.R, C, k); if (k > 0) drawClash(C); }
      else { drawBeam(SL.L, C); drawBeam(SL.R, C); drawClash(C); emitClash(dt, C, SL.L, SL.R); }
    }
    if (st === 'ko' && G.roundWinner) {
      const w = G.roundWinner, l = w === SL.L ? SL.R : SL.L, k = clamp((nowS - G.koT) / 1.4, 0, 1);
      if (k < 1) drawBeam(w, l.chest, 1 - k);
    }
    if (st === 'photo' && G.matchWinner && G.matchWinner.kind === 'human') {
      const tr = getTrack(G.matchWinner.trackId);
      if (tr && tr.P) T('👑', tr.P[0].x, tr.P[0].y - tr.sw * 0.95 + Math.sin(nowS * 4) * U, tr.sw * 0.8, '#fff');
    }
  }
  stepParticles(dt); drawParticles();
  drawOverlayFX();
  ctx.restore();
  if (G.pendingCapture) { snap.width = W; snap.height = H; snapCtx.drawImage(cv, 0, 0); G.pendingCapture = false; }
  // الواجهات
  if (st === 'attract') {
    drawAttract(1);
    for (const tr of realPeople()) joinBubble(tr, ['🙌 RAISE HANDS', 'ارفع يديك للعب'], '#2ee6c5');
  } else if (st === 'lobby') {
    drawLobby();
    for (const tr of realPeople()) if (!G.lobby.includes(tr.id)) joinBubble(tr, ['🙌 JOIN!', 'ارفع يديك للانضمام'], '#ff3ea5');
  } else if (G.demo) {
    drawAttract(0.95);
    T('LIVE DEMO · عرض حي', W / 2, H * 0.66, U * 1.6, '#ffffff', { w: 800, ls: 2, alpha: 0.6 });
    for (const tr of realPeople()) joinBubble(tr, ['🙌 RAISE HANDS', 'ارفع يديك للعب'], '#2ee6c5');
    if (st === 'winner') { const w = G.matchWinner; if (w) T(`${w.name.en} WINS!`, W / 2, H * 0.6, U * 3, w.color, { w: 900, glow: w.color }); }
  } else {
    if (st === 'versus') drawVersus();
    if (st === 'intro' || st === 'fight' || st === 'ko') drawFightHUD();
    if (st === 'winner') drawWinner();
    if (st === 'photo') { T('📸 PHOTO TIME!', W / 2, U * 12, U * 5, '#ffffff', { w: 900, glow: '#2ee6c5', blur: U * 3 }); T('صورة تذكارية — اتخذوا وضعية الأبطال!', W / 2, U * 18, U * 2.8, '#9ff5e2', { ar: true, w: 900 }); }
  }
  drawPops(); drawAnnounce(); drawFlash(); drawToastAndDebug();
}
function drawFlash() { if (G.flash > 0) { ctx.fillStyle = `rgba(${G.flashColor},${Math.min(0.85, G.flash)})`; ctx.fillRect(0, 0, W, H); } }

/* ---------------- الحلقة الرئيسية ---------------- */
let lastFrame = performance.now(), errors = 0, FAST = false;   // FAST: محاكاة بلا رسم (للاختبار)
function tick(tsIn) {
  const ts = Math.max(tsIn, lastFrame + 1);           // ساعة رتيبة دائماً
  try {
    const realDt = Math.min(0.05, Math.max(0.001, (ts - lastFrame) / 1000)); lastFrame = ts; nowS = ts / 1000;
    G.fps += (1 / realDt - G.fps) * 0.05;
    // خفض الجودة تلقائياً إن انخفض معدل الإطارات
    if (G.fps < 36 && G.useFilter) { G.slowFrames++; if (G.slowFrames > 180) { G.useFilter = false; toast('PERFORMANCE MODE'); } } else G.slowFrames = 0;
    if (SIM) feedTracks(simPeople.filter((p) => p.on).map((p) => simPose(p, nowS)), 'real'); else detect(ts);
    if (G.demo) demoStep();
    G.timeScale = nowS < G.slowUntil ? 0.3 : lerp(G.timeScale, 1, Math.min(1, realDt * 4));
    const dt = realDt * G.timeScale; gameT += dt;
    G.shake = Math.max(0, G.shake - realDt * 2.5); G.flash = Math.max(0, G.flash - realDt * 2.2);
    if (SL.L && SL.R) updateGeometry();
    const st = STATES[G.state];
    if (st && st.update) st.update(dt, realDt);
    // انسحاب اللاعبين أثناء المباراة
    if (!G.demo && SL.L && SL.R && ['versus', 'intro', 'fight', 'ko'].includes(G.state)) {
      if (humans().every((h) => !h.present)) { if (!G.absentSince) G.absentSince = nowS; if (nowS - G.absentSince > 8) { toast('PLAYERS LEFT'); resetToAttract(); } } else G.absentSince = 0;
    }
    if (G.demo && G.state !== 'attract') {
      const tr = checkJoin(); if (tr) enterLobby(tr);
      else if (realPeople().length && G.peopleSince && nowS - G.peopleSince > 1.5) { stopDemo(); setState('attract'); }
      if (realPeople().length) { if (!G.peopleSince) G.peopleSince = nowS; } else G.peopleSince = 0;
    }
    if (FAST) stepParticles(dt); else render(dt);
  } catch (e) { errors++; if (errors < 20) console.error(e); }
}
function frame(ts) { tick(ts); requestAnimationFrame(frame); }

/* ---------------- لوحة المفاتيح (للمشغّل) ---------------- */
const boot = document.getElementById('boot');
function hideBoot() { boot.classList.add('hidden'); cv.focus(); }
function showBoot() { boot.classList.remove('hidden'); }
function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {}); }
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* تجاهل */ } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && boot.classList.contains('hidden')) keepAwake(); });
function operatorSkip() {
  const st = G.state;
  if (st === 'attract') { const p = realPeople().sort((a, b) => b.sw - a.sw)[0]; if (p) enterLobby(p); else startDemo(); }
  else if (st === 'lobby') startMatch();
  else if (G.demo) { stopDemo(); setState('attract'); }
  else if (st === 'versus' || st === 'intro') setState('fight');
  else if (st === 'winner' || st === 'photo' || st === 'photoShow') setState('attract');
}
function saveSnap() {
  if (!snap.width) return;
  snap.toBlob((b) => { if (!b) return; const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `fath-arena-${Date.now()}.png`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); toast('PHOTO SAVED'); });
}
addEventListener('keydown', (e) => {
  SND.init();
  const k = e.key.toLowerCase();
  const typing = ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName);
  if ((k === 'backspace' || k === 'browserback') && !AUTOSTART && !typing) { location.href = 'index.html'; return; }
  if (!boot.classList.contains('hidden')) { if (k === 'escape') hideBoot(); else if (k === 'enter' && !typing && !['BUTTON', 'A'].includes(e.target.tagName)) $('go').click(); return; }
  if (k === 'f') toggleFullscreen();
  else if (k === 'm') { SND.toggleMute(); toast(SND.muted ? 'MUTED' : 'SOUND ON'); }
  else if (k === '+' || k === '=') { SND.setVolume(S.volume + 0.1); saveSettings(); toast(`VOLUME ${Math.round(S.volume * 100)}%`); }
  else if (k === '-' || k === '_') { SND.setVolume(S.volume - 0.1); saveSettings(); toast(`VOLUME ${Math.round(S.volume * 100)}%`); }
  else if (k === 'd') DEBUG = !DEBUG;
  else if (k === 'h') { const ord = ['easy', 'normal', 'hard']; S.difficulty = ord[(ord.indexOf(S.difficulty) + 1) % 3]; saveSettings(); toast(`AI: ${DIFF[S.difficulty].label}`); }
  else if (k === 'c') { S.view = S.view === 'camera' ? 'hologram' : 'camera'; saveSettings(); toast(S.view === 'camera' ? 'CAMERA AR VIEW' : 'HOLOGRAM VIEW'); }
  else if (k === 'r') { resetToAttract(); toast('RESET'); }
  else if (k === ' ') { e.preventDefault(); operatorSkip(); }
  else if (k === '1') { if (G.state === 'lobby') { G.lobby = G.lobby.slice(0, 1); startMatch(); } else if (G.state === 'attract') operatorSkip(); }
  else if (k === 's') saveSnap();
  else if (k === 'l') { if (nowS - G.lbClearT < 2) { LS.set(lbKey(), []); LS.set(statsKey(), { players: 0, kcal: 0, matches: 0 }); toast('LEADERBOARD CLEARED'); } else { G.lbClearT = nowS; toast('PRESS L AGAIN TO CLEAR'); } }
  else if (k === 'escape') showBoot();
});
cv.addEventListener('pointerdown', () => SND.init());

/* ---------------- شاشة الإعداد ---------------- */
const $ = (id) => document.getElementById(id);
function fillSettings() {
  $('cfDiff').value = S.difficulty; $('cfRounds').value = String(S.rounds); $('cfTime').value = String(S.roundTime);
  $('cfView').value = S.view; $('cfModel').value = S.model; $('cfEvent').value = S.event; $('cfVoice').checked = !!S.announcer;
}
async function listCameras() {
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput');
    const sel = $('cfCam'); sel.innerHTML = '<option value="">Default</option>';
    devs.forEach((d, i) => { const o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label || `Camera ${i + 1}`; sel.appendChild(o); });
    sel.value = S.camId || '';
  } catch (e) { /* تجاهل */ }
}
async function applySettings() {
  const prevModel = S.model, prevCam = S.camId;
  S.difficulty = $('cfDiff').value; S.rounds = +$('cfRounds').value; S.roundTime = +$('cfTime').value;
  S.view = $('cfView').value; S.model = $('cfModel').value; S.event = ($('cfEvent').value || DEFAULTS.event).toUpperCase(); S.announcer = $('cfVoice').checked;
  S.camId = $('cfCam').value; saveSettings();
  if (!SIM && S.camId !== prevCam) { try { await startCamera(S.camId); } catch (e) { console.error(e); } }
  if (!SIM && S.model !== prevModel) {
    aiOK = false;
    try { const old = landmarker; landmarker = await loadVision(); aiOK = true; $('stAI').textContent = '🧠 AI ready ✓'; if (old) old.close(); } catch (e) { console.error(e); }
  }
}
$('go').addEventListener('click', async () => {
  SND.init(); SND.setVolume(S.volume);
  await applySettings();
  hideBoot(); keepAwake();
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  if (G.state === 'boot' || G.state === 'attract') setState('attract');
});

/* ---------------- التشغيل ---------------- */
async function init() {
  resize(); addEventListener('resize', resize);
  fillSettings(); loadQR();
  if (AUTOSTART) $('home').style.display = 'none';
  if (document.fonts) ['600 20px Orbitron', '900 20px Orbitron', '800 20px Cairo', '900 20px Cairo'].forEach((f) => document.fonts.load(f, 'FATH فتح').catch(() => {}));
  setState('attract');
  requestAnimationFrame(frame);
  const stCam = $('stCam'), stAI = $('stAI');
  if (SIM) { stCam.textContent = '📷 SIM MODE'; stCam.className = 'ok'; stAI.textContent = '🧠 SIM'; stAI.className = 'ok'; }
  else {
    try { await startCamera(S.camId); stCam.textContent = '📷 Camera ✓'; stCam.className = 'ok'; listCameras(); }
    catch (e) { stCam.textContent = '📷 Camera ✗ (demo only)'; stCam.className = 'bad'; S.view = 'hologram'; console.error(e); }
    try { stAI.textContent = '🧠 Loading AI…'; landmarker = await loadVision(); aiOK = true; stAI.textContent = '🧠 AI ready ✓'; stAI.className = 'ok'; }
    catch (e) { stAI.textContent = '🧠 AI ✗'; stAI.className = 'bad'; console.error(e); }
  }
  if (AUTOSTART) { SND.init(); hideBoot(); keepAwake(); }
}
// أدوات للاختبار من وحدة التحكم
window.ARENA = { set fast(v) { FAST = v; }, step: (n = 1, ms = 16.7) => { for (let i = 0; i < n; i++) tick(lastFrame + ms); }, get errors() { return errors; }, get now() { return nowS; }, G, get SL() { return SL; }, get tracks() { return tracks; }, simPeople, setState, startMatch, startDemo, stopDemo, enterLobby, S, SND, operatorSkip, loadVision };
init();
})();
</script>
