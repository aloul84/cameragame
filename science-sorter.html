<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مصنّف العلوم</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="game-common.js"></script>
    <script src="edu-common.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07140f; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        #canvas { position: fixed; top: 0; left: 0; display: block; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = EDU.makeVideo();
        let w = 0, h = 0;
        GC.fitCanvas(canvas, (nw, nh) => { w = nw; h = nh; });

        /* ---------------- المستويات: كل مستوى موضوع علمي ----------------
           zones: الصناديق (تقف أمام الصندوق الصحيح بجسمك) | items: [الاسم، الرمز، رقم الصندوق] */
        const Z = (n, e, c) => ({ n, e, c });
        const LEVELS = [
            { name: 'حيّ أم جماد', sub: 'حيوان/نبات', fall: 6.0, zones: [Z('حيوان', '🐾', '#f59e0b'), Z('نبات', '🌱', '#22c55e'), Z('جماد', '🪨', '#94a3b8')],
              items: [['كلب', '🐶', 0], ['قطة', '🐱', 0], ['عصفور', '🐦', 0], ['فراشة', '🦋', 0], ['سمكة', '🐟', 0], ['شجرة', '🌳', 1], ['وردة', '🌹', 1], ['نخلة', '🌴', 1], ['عشب', '🌿', 1], ['زهرة', '🌻', 1], ['صخرة', '🪨', 2], ['كرسي', '🪑', 2], ['كتاب', '📖', 2], ['قلم', '✏️', 2], ['ساعة', '⏰', 2]] },
            { name: 'بيئة الحيوان', sub: 'بري/بحري/جوي', fall: 5.6, zones: [Z('بري', '🌍', '#a3743a'), Z('بحري', '🌊', '#0ea5e9'), Z('جوي', '☁️', '#a78bfa')],
              items: [['أسد', '🦁', 0], ['جمل', '🐪', 0], ['فيل', '🐘', 0], ['حصان', '🐴', 0], ['زرافة', '🦒', 0], ['حوت', '🐋', 1], ['دلفين', '🐬', 1], ['أخطبوط', '🐙', 1], ['قرش', '🦈', 1], ['سلطعون', '🦀', 1], ['نسر', '🦅', 2], ['بومة', '🦉', 2], ['حمامة', '🕊️', 2], ['نحلة', '🐝', 2], ['عصفور', '🐦', 2]] },
            { name: 'حالات المادة', sub: 'صلب/سائل/غاز', fall: 5.2, zones: [Z('صلب', '🧊', '#60a5fa'), Z('سائل', '💧', '#06b6d4'), Z('غاز', '💨', '#c4b5fd')],
              items: [['حجر', '🪨', 0], ['خشب', '🪵', 0], ['ثلج', '🧊', 0], ['حديد', '🔩', 0], ['ذهب', '🪙', 0], ['ماء', '💧', 1], ['حليب', '🥛', 1], ['عصير', '🧃', 1], ['عسل', '🍯', 1], ['شاي', '🍵', 1], ['هواء', '🌬️', 2], ['بخار الماء', '♨️', 2], ['أكسجين', '🫧', 2], ['هيليوم', '🎈', 2], ['غاز الطبخ', '🔥', 2]] },
            { name: 'الغذاء الصحي', sub: 'مجموعات الطعام', fall: 4.8, zones: [Z('فاكهة', '🍎', '#ef4444'), Z('خضار', '🥕', '#22c55e'), Z('بروتين وألبان', '🥛', '#fbbf24')],
              items: [['تفاح', '🍎', 0], ['موز', '🍌', 0], ['عنب', '🍇', 0], ['برتقال', '🍊', 0], ['فراولة', '🍓', 0], ['جزر', '🥕', 1], ['خيار', '🥒', 1], ['بصل', '🧅', 1], ['بطاطس', '🥔', 1], ['ذرة', '🌽', 1], ['حليب', '🥛', 2], ['جبن', '🧀', 2], ['بيض', '🥚', 2], ['دجاج', '🍗', 2], ['لحم', '🥩', 2]] },
            { name: 'يطفو أم يغرق', sub: 'تجربة الماء', fall: 4.5, zones: [Z('يطفو', '🛟', '#38bdf8'), Z('يغرق', '⚓', '#64748b')],
              items: [['خشب', '🪵', 0], ['كرة', '⚽', 0], ['ورقة', '🍃', 0], ['بالون', '🎈', 0], ['بطة مطاطية', '🦆', 0], ['حجر', '🪨', 1], ['مفتاح', '🔑', 1], ['مسمار', '🔩', 1], ['عملة', '🪙', 1], ['مقص', '✂️', 1], ['مرساة', '⚓', 1]] },
            { name: 'المجموعة الشمسية', sub: 'الكواكب', fall: 4.2, zones: [Z('كوكب صخري', '🪨', '#b45309'), Z('كوكب غازي', '🪐', '#a78bfa')],
              items: [['عطارد', '⚫', 0], ['الزهرة', '🟡', 0], ['الأرض', '🌍', 0], ['المريخ', '🔴', 0], ['المشتري', '🟠', 1], ['زحل', '🪐', 1], ['أورانوس', '🔵', 1], ['نبتون', '🔷', 1]] },
            { name: 'طبيعي أم صناعي', sub: 'المواد', fall: 3.9, zones: [Z('طبيعي', '🌿', '#22c55e'), Z('صناعي', '🏭', '#f97316')],
              items: [['صوف', '🐑', 0], ['خشب', '🪵', 0], ['حجر', '🪨', 0], ['ماء', '💧', 0], ['رمل', '🏖️', 0], ['عسل', '🍯', 0], ['بلاستيك', '🧴', 1], ['زجاج', '🪟', 1], ['سيارة', '🚗', 1], ['هاتف', '📱', 1], ['مصباح', '💡', 1], ['حاسوب', '💻', 1]] },
            { name: 'فصول السنة', sub: 'شتاء/صيف/خريف', fall: 3.6, zones: [Z('شتاء', '❄️', '#60a5fa'), Z('صيف', '☀️', '#f59e0b'), Z('خريف', '🍂', '#c2410c')],
              items: [['معطف', '🧥', 0], ['مدفأة', '🔥', 0], ['رجل الثلج', '⛄', 0], ['قفازات', '🧤', 0], ['سباحة', '🏊', 1], ['آيس كريم', '🍦', 1], ['نظارة شمس', '🕶️', 1], ['شاطئ', '🏖️', 1], ['بطيخ', '🍉', 1], ['أوراق متساقطة', '🍂', 2], ['حصاد القمح', '🌾', 2], ['عودة المدارس', '🎒', 2], ['قرع', '🎃', 2]] },
            { name: 'جسم الإنسان', sub: 'الأجهزة', fall: 3.3, zones: [Z('التنفس', '🫁', '#38bdf8'), Z('الهضم', '🍽️', '#f59e0b'), Z('الدورة الدموية', '❤️', '#ef4444')],
              items: [['الرئتان', '🫁', 0], ['الأنف', '👃', 0], ['الشهيق', '🌬️', 0], ['المعدة', '🍽️', 1], ['الأمعاء', '🌀', 1], ['المريء', '📏', 1], ['الأسنان', '🦷', 1], ['القلب', '❤️', 2], ['الدم', '🩸', 2], ['النبض', '💓', 2], ['الشرايين', '🔴', 2]] },
            { name: 'مصادر الطاقة', sub: 'كهرباء/وقود/عضلات', fall: 3.0, zones: [Z('كهرباء', '⚡', '#facc15'), Z('وقود', '⛽', '#f97316'), Z('عضلات', '💪', '#22c55e')],
              items: [['ثلاجة', '🧊', 0], ['تلفاز', '📺', 0], ['مصباح', '💡', 0], ['حاسوب', '💻', 0], ['سيارة', '🚗', 1], ['طائرة', '✈️', 1], ['حافلة', '🚌', 1], ['شاحنة', '🚚', 1], ['دراجة', '🚲', 2], ['ركض', '🏃', 2], ['تجديف', '🚣', 2], ['مشي', '🚶', 2]] }
        ];
        const ITEMS_PER_LEVEL = 12, MAX_MISTAKES = 3;

        let level = 0, order = [], idx = 0, mistakes = 0, correct = 0, phase = 'MENU';
        let item = null, fallStart = 0, resultUntil = 0, resultMsg = '', resultOk = true, flash = 0, flashC = '';
        let poseLm = null, lastPoseT = 0, px = 0.5, kbZone = null;
        let cameraOK = false, lastT = performance.now(), vr = { x: 0, y: 0, w: 1, h: 1 };

        const menu = EDU.init({
            id: 'ss', title: 'مصنّف العلوم', emoji: '🔬', color: '#4ade80', bg1: '#0b3b25', bg2: '#04100a',
            levels: LEVELS, onStart: startLevel
        });

        function startLevel(i) {
            level = i; mistakes = 0; correct = 0; idx = 0; kbZone = null;
            const L = LEVELS[i];
            let pool = EDU.shuffle(L.items);
            while (pool.length < ITEMS_PER_LEVEL) pool = pool.concat(EDU.shuffle(L.items));
            order = pool.slice(0, ITEMS_PER_LEVEL);
            EDU.fx.list = [];
            phase = 'READY'; resultUntil = performance.now() + 2200; item = null;
        }
        function nextItem(now) {
            if (idx >= order.length) return endLevel();
            item = order[idx]; phase = 'FALL'; fallStart = now;
        }
        function endLevel() {
            phase = 'MENU';
            const stars = mistakes >= MAX_MISTAKES ? 0 : mistakes === 0 ? 3 : mistakes === 1 ? 2 : 1;
            menu.finish(stars, `التصنيفات الصحيحة: ${correct} من ${ITEMS_PER_LEVEL}`, level);
        }

        /* ---------------- مكان اللاعب (الصندوق الذي يقف أمامه) ---------------- */
        function onPose(res) {
            if (res.poseLandmarks) { poseLm = res.poseLandmarks; lastPoseT = performance.now(); }
        }
        let curZone = 0;
        function playerZone(now, n) {
            let x = null;
            if (poseLm && now - lastPoseT < 700) {
                const m = EDU.pt(vr, { x: (poseLm[11].x + poseLm[12].x) / 2, y: 0 });
                x = (m.x - vr.x) / vr.w;
            }
            if (x !== null) {
                px += (x - px) * 0.35;
                const z = Math.max(0, Math.min(n - 1, Math.floor(px * n)));
                // تباطؤ بسيط لمنع الاهتزاز عند الحدود
                const center = (curZone + 0.5) / n;
                if (z !== curZone && Math.abs(px - center) > 0.5 / n + 0.03) curZone = z;
            } else if (kbZone !== null) curZone = Math.min(n - 1, kbZone);
            return Math.min(n - 1, curZone);
        }

        window.addEventListener('keydown', (e) => {
            if (phase === 'MENU') return;
            const n = LEVELS[level].zones.length;
            const k = e.code;
            const left = k === 'ArrowLeft' || k === 'KeyA', right = k === 'ArrowRight' || k === 'KeyD';
            if (!left && !right) return;
            e.preventDefault(); e.stopPropagation();
            kbZone = Math.max(0, Math.min(n - 1, (kbZone === null ? curZone : kbZone) + (left ? -1 : 1)));
        }, true);
        window.addEventListener('pointerdown', (e) => {
            if (phase === 'MENU' || (e.target.closest && e.target.closest('button, .edu-overlay'))) return;
            const n = LEVELS[level].zones.length;
            kbZone = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - vr.x) / vr.w * n)));
            lastPoseT = 0;
        });

        /* ---------------- التحديث ---------------- */
        function update(now, dt) {
            if (flash > 0) flash -= dt;
            if (phase === 'READY') { if (now >= resultUntil) nextItem(now); return; }
            if (phase === 'RESULT') { if (now >= resultUntil) { if (mistakes >= MAX_MISTAKES) endLevel(); else nextItem(now); } return; }
            if (phase !== 'FALL') return;
            const L = LEVELS[level];
            if ((now - fallStart) / 1000 >= L.fall) {
                const z = playerZone(now, L.zones.length);
                idx++;
                const ok = z === item[2];
                resultOk = ok;
                const right = L.zones[item[2]].n;
                if (ok) { correct++; resultMsg = `صحيح ✔  ${item[0]} ← ${right}`; flashC = '74,222,128'; EDU.fx.burst(vr.x + vr.w * (item[2] + 0.5) / L.zones.length, vr.y + vr.h * 0.7, [L.zones[z].c, '#fde047', '#fff'], 28); [660, 880].forEach((f, k) => GC.beep(f, 0.12, 'triangle', 0.16, k * 0.09)); }
                else { mistakes++; resultMsg = `الصحيح: ${item[0]} ← ${right}`; flashC = '248,113,113'; GC.beep(160, 0.3, 'sawtooth', 0.16, 0, 80); GC.vibrate(100); }
                flash = 0.3; phase = 'RESULT'; resultUntil = now + 1500;
                if (!ok) { /* انتقل بعد عرض الإجابة الصحيحة */ }
            }
        }

        /* ---------------- الرسم ---------------- */
        function draw(now, dt) {
            GC.begin(ctx);
            ctx.fillStyle = '#07140f'; ctx.fillRect(0, 0, w, h);
            vr = EDU.fitRect(video, { x: 0, y: 0, w, h });
            if (phase === 'MENU' || !LEVELS[level]) { if (cameraOK) EDU.drawVideo(ctx, video, vr, 0.3); return; }
            const L = LEVELS[level], n = L.zones.length;
            if (cameraOK) EDU.drawVideo(ctx, video, vr, 0.38);
            const zi = playerZone(now, n);
            const landY = vr.y + vr.h * 0.7, binY = vr.y + vr.h * 0.78, binH = vr.h * 0.22;

            // الصناديق
            L.zones.forEach((z, i) => {
                const x = vr.x + vr.w * i / n, zw = vr.w / n, on = i === zi;
                ctx.fillStyle = z.c + (on ? '55' : '22'); ctx.fillRect(x, vr.y, zw, vr.h);
                ctx.fillStyle = z.c + (on ? 'ee' : 'aa'); ctx.beginPath(); ctx.roundRect(x + 4, binY, zw - 8, binH - 4, 14); ctx.fill();
                EDU.text(ctx, z.e, x + zw / 2, binY + binH * 0.36, Math.min(zw * 0.35, binH * 0.5));
                EDU.text(ctx, z.n, x + zw / 2, binY + binH * 0.78, Math.max(13, Math.min(zw * 0.16, 24)), '#fff', '#000');
                if (i) { ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(x, vr.y); ctx.lineTo(x, binY); ctx.stroke(); ctx.setLineDash([]); }
            });
            // خط الهبوط
            ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
            ctx.beginPath(); ctx.moveTo(vr.x, landY); ctx.lineTo(vr.x + vr.w, landY); ctx.stroke(); ctx.setLineDash([]);
            // اللاعب
            if (poseLm && now - lastPoseT < 700) EDU.drawSkeleton(ctx, poseLm, vr, '#ffffff', 5);
            const mx = vr.x + vr.w * (zi + 0.5) / n;
            ctx.fillStyle = L.zones[zi].c; ctx.beginPath(); ctx.moveTo(mx, landY + 6); ctx.lineTo(mx - 14, landY + 28); ctx.lineTo(mx + 14, landY + 28); ctx.closePath(); ctx.fill();

            // البطاقة الساقطة
            if (item && (phase === 'FALL')) {
                const t = Math.min(1, (now - fallStart) / 1000 / L.fall);
                const cy = vr.y + 90 + (landY - (vr.y + 90)) * t, cw = Math.min(vr.w * 0.34, 190), ch = cw * 0.8;
                ctx.save(); ctx.shadowColor = '#000'; ctx.shadowBlur = 20;
                ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.roundRect(w / 2 - cw / 2, cy - ch / 2, cw, ch, 18); ctx.fill(); ctx.restore();
                EDU.text(ctx, item[1], w / 2, cy - ch * 0.12, ch * 0.5);
                EDU.text(ctx, item[0], w / 2, cy + ch * 0.32, Math.max(16, ch * 0.2), '#0f172a');
            }
            // الشريط العلوي
            const fs = Math.max(14, Math.min(w * 0.04, 20));
            ctx.textBaseline = 'middle'; ctx.font = `700 ${fs}px Tahoma`;
            ctx.textAlign = 'right'; ctx.fillStyle = '#86efac'; ctx.fillText(`المستوى ${level + 1}: ${L.name}`, w - 12, 24);
            ctx.textAlign = 'center'; ctx.fillStyle = '#e2e8f0'; ctx.fillText(`${Math.min(idx + (phase === 'FALL' ? 1 : 0), ITEMS_PER_LEVEL)} / ${ITEMS_PER_LEVEL}`, w / 2, 24);
            ctx.textAlign = 'left'; ctx.fillText('❤️'.repeat(MAX_MISTAKES - mistakes) + '🖤'.repeat(mistakes), 118, 24);
            if (phase === 'READY') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, h * 0.3, w, h * 0.26);
                EDU.text(ctx, L.sub, w / 2, h * 0.38, Math.max(24, Math.min(w * 0.08, 44)), '#fde047', '#000');
                EDU.text(ctx, 'قف أمام الصندوق الصحيح قبل أن تصل البطاقة للخط', w / 2, h * 0.46, Math.max(14, Math.min(w * 0.04, 22)), '#fff');
                EDU.text(ctx, cameraOK ? 'تحرّك يميناً ويساراً بجسمك' : 'اضغط على الصندوق أو استخدم الأسهم', w / 2, h * 0.51, Math.max(13, Math.min(w * 0.035, 18)), '#cbd5e1');
            }
            if (phase === 'RESULT') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, h * 0.34, w, 64);
                EDU.text(ctx, resultMsg, w / 2, h * 0.34 + 32, Math.max(18, Math.min(w * 0.055, 32)), resultOk ? '#4ade80' : '#fca5a5');
            }
            if (flash > 0) { ctx.fillStyle = `rgba(${flashC},${Math.min(0.2, flash)})`; ctx.fillRect(0, 0, w, h); }
            EDU.fx.draw(ctx, dt);
        }

        function loop(now) {
            const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
            update(now, dt);
            draw(now, dt);
            requestAnimationFrame(loop);
        }

        const HELP = 'تسقط بطاقات علمية، وعليك أن <b>تقف بجسمك أمام الصندوق الصحيح</b> قبل أن تصل للخط. تحرّك يميناً ويساراً أمام الكاميرا، أو اضغط على الصندوق.';
        (async function init() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { menu.ready(HELP + '<br>الكاميرا غير متاحة — اضغط الصندوق أو استخدم الأسهم.'); return; }
            try { await EDU.startPose(video, onPose); cameraOK = true; menu.ready(HELP); }
            catch (e) { console.error(e); menu.ready(HELP + '<br>تعذر تشغيل الكاميرا — اضغط الصندوق أو استخدم الأسهم.'); }
        })();
        requestAnimationFrame(loop);
    </script>
    <script src="remote-nav.js"></script>
</body>
</html>
