<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سباق الأجسام</title>
    <script src="game-common.js"></script>
    <!-- نموذج Pose الحديث: يتتبع جسمين معاً (يُحمَّل عند فتح اللعبة) -->
    <script type="module">
        try {
            const m = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
            window.PoseLib = m;
        } catch (e) { window.PoseLib = null; console.error(e); }
        window.dispatchEvent(new Event('poselib'));
    </script>

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background: #0b1220; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #video { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
        #canvas { position: fixed; top: 0; left: 0; display: block; }
        .overlay {
            position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            background: rgba(7, 12, 24, 0.95); padding: 16px; overflow-y: auto;
        }
        .overlay > * { flex-shrink: 0; }
        h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 7vw, 3rem); color: #34d399; text-shadow: 0 0 14px rgba(52, 211, 153, 0.55); }
        p { margin: 0 0 12px; max-width: 620px; line-height: 1.7; color: #cbd5e1; font-size: clamp(0.92rem, 3.4vw, 1.12rem); }
        .how { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 0 0 14px; }
        .how span { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 6px 12px; font-size: 0.95rem; }
        button {
            font-family: inherit; cursor: pointer; border: 2px solid #34d399; color: #fff;
            background: #047857; border-radius: 50px; padding: 12px 40px;
            font-size: clamp(1.1rem, 4.5vw, 1.4rem); box-shadow: 0 0 16px rgba(52, 211, 153, 0.4);
        }
        button:active { transform: scale(0.97); }
        .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 0 0 12px; }
        .opt { padding: 8px 16px; font-size: 1.02rem; background: #14263a; box-shadow: none; border-color: transparent; border-radius: 14px; }
        .opt small { display: block; font-size: 0.7rem; opacity: 0.85; }
        .opt.sel { background: #34d399; color: #04261b; }
        .hidden { display: none !important; }
        .loader { border: 5px solid rgba(255,255,255,0.1); border-top-color: #34d399; border-radius: 50%; width: 46px; height: 46px; animation: spin 1s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-height: 520px) { h1 { margin-bottom: 2px; } p { margin-bottom: 6px; } .row, .how { margin-bottom: 6px; } button { padding: 8px 26px; } .opt { padding: 4px 12px; } }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="overlay" class="overlay">
        <div id="loader" class="loader"></div>
        <h1 id="title">🏃 سباق الأجسام</h1>
        <p id="desc">جاري تحميل نموذج تتبع الجسم...</p>
        <div class="how hidden" id="how">
            <span>⬆️ اقفز = تجاوز الحواجز</span>
            <span>⬇️ اجلس القرفصاء = تحت العارضة</span>
            <span>↔️ مِل أو تحرّك جانباً = غيّر المسار</span>
        </div>
        <div id="modeRow" class="row hidden">
            <button class="opt sel" data-mode="2p">👥 لاعبان<small>جسدان أمام الكاميرا</small></button>
            <button class="opt" data-mode="cpu">🤖 ضد الحاسوب<small>للاعب واحد</small></button>
        </div>
        <div id="levelRow" class="row hidden"></div>
        <button id="startBtn" class="hidden">ابدأ السباق</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const titleEl = document.getElementById('title');
        const descEl = document.getElementById('desc');
        const loader = document.getElementById('loader');
        const howEl = document.getElementById('how');
        const modeRow = document.getElementById('modeRow');
        const levelRow = document.getElementById('levelRow');
        const startBtn = document.getElementById('startBtn');

        /* ---------------- المستويات الخمسة ----------------
           len: طول السباق (متر) | speed: السرعة | gap: المسافة بين العوائق بالثواني (min,max)
           types: أنواع العوائق | skill: دقة الحاسوب */
        const LEVELS = [
            { name: 'المبتدئ',    sub: 'قفز فقط',        len: 260, speed: 10, gap: [1.9, 2.8], types: ['hurdle'],                         skill: 0.80, sky: ['#7dd3fc', '#e0f2fe'], ground: '#4b5563' },
            { name: 'القفز والانحناء', sub: 'عارضات علوية', len: 320, speed: 12, gap: [1.6, 2.4], types: ['hurdle', 'bar'],                  skill: 0.84, sky: ['#fdba74', '#fef3c7'], ground: '#57534e' },
            { name: 'المراوغة',   sub: 'جدران ونقود',     len: 380, speed: 13, gap: [1.4, 2.2], types: ['hurdle', 'block', 'block', 'coins'], skill: 0.88, sky: ['#a78bfa', '#ede9fe'], ground: '#4c4a6b' },
            { name: 'الكل معاً',  sub: 'كل الحركات',      len: 440, speed: 15, gap: [1.2, 2.0], types: ['hurdle', 'bar', 'block', 'coins', 'combo'], skill: 0.91, sky: ['#6ee7b7', '#ecfdf5'], ground: '#3f4b44' },
            { name: 'العاصفة',    sub: 'سريع ومزدحم',     len: 500, speed: 18, gap: [1.0, 1.7], types: ['hurdle', 'bar', 'block', 'combo', 'combo'], skill: 0.94, sky: ['#475569', '#94a3b8'], ground: '#334155' }
        ];
        const COLORS = ['#f472b6', '#38bdf8'];
        const Z_MAX = 55;

        let mode = '2p', selected = 0, level = 0;
        let phase = 'MENU';           // MENU, READY, RACE, DONE
        let phaseUntil = 0, banner = '', lastT = performance.now(), shake = [0, 0];
        let pats = [], winner = -1;
        let w = 0, h = 0, portrait = false, vps = [];

        // حالة كل لاعب
        const mkPlayer = (i) => ({
            i, dist: 0, lane: 0, laneX: 0, air: -1, hgt: 0, duckT: 0, ducking: 0, stumble: 0, coins: 0, hits: 0,
            finished: false, time: 0, popups: [],
            // التحكم: ما يُرسله الجسم/اللمس/لوحة المفاتيح
            ctl: { lane: 0, duck: false, jump: false }, hasBody: false,
            body: { baseX: null, baseY: null, sx: 0, sy: 0, sw: 0.2, laneSt: 0, calib: 0 },
            ai: { until: 0, act: null }
        });
        let PL = [mkPlayer(0), mkPlayer(1)];
        let poses = [null, null];         // آخر معالم لكل لاعب (لرسم الهيكل)

        GC.fitCanvas(canvas, (nw, nh) => { w = nw; h = nh; layoutVps(); });
        function layoutVps() {
            portrait = h > w * 1.1;
            vps = portrait ? [{ x: 0, y: 0, w, h: h / 2 }, { x: 0, y: h / 2, w, h: h / 2 }]
                           : [{ x: 0, y: 0, w: w / 2, h }, { x: w / 2, y: 0, w: w / 2, h }];
        }

        /* ---------------- توليد العوائق (نفس النمط للاعبين) ---------------- */
        function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
        function genPatterns(L, seed) {
            const rnd = mulberry32(seed);
            const out = [];
            let d = 30;
            const pickLanes = (n) => { const a = [-1, 0, 1].sort(() => rnd() - 0.5); return a.slice(0, n); };
            while (d < L.len - 25) {
                const type = L.types[Math.floor(rnd() * L.types.length)];
                if (type === 'hurdle') out.push({ d, type: 'hurdle', lanes: [-1, 0, 1] });
                else if (type === 'bar') out.push({ d, type: 'bar', lanes: [-1, 0, 1] });
                else if (type === 'block') out.push({ d, type: 'block', lanes: pickLanes(1 + (rnd() < 0.45 ? 1 : 0)) });
                else if (type === 'coins') { const ln = pickLanes(1)[0]; for (let k = 0; k < 4; k++) out.push({ d: d + k * 2.2, type: 'coin', lanes: [ln] }); }
                else { // combo: جدار ثم عارضة أو حاجز بعده
                    const first = rnd() < 0.5 ? 'block' : 'hurdle';
                    out.push({ d, type: first, lanes: first === 'block' ? pickLanes(2) : [-1, 0, 1] });
                    out.push({ d: d + L.speed * 0.95, type: rnd() < 0.5 ? 'bar' : 'hurdle', lanes: [-1, 0, 1] });
                    d += L.speed * 0.95;
                }
                d += L.speed * (L.gap[0] + rnd() * (L.gap[1] - L.gap[0]));
            }
            return out.sort((a, b) => a.d - b.d);
        }

        /* ---------------- الكاميرا وتتبع الجسدين ---------------- */
        let landmarker = null, poseStatus = 'loading', lastVideoT = -1;
        async function initPose() {
            if (!window.PoseLib) await new Promise(r => window.addEventListener('poselib', r, { once: true }));
            if (!window.PoseLib || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { poseStatus = 'failed'; return readyMenu(); }
            try {
                const { PoseLandmarker, FilesetResolver } = window.PoseLib;
                const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
                const opts = (delegate) => ({
                    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task', delegate },
                    runningMode: 'VIDEO', numPoses: 2, minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5
                });
                try { landmarker = await PoseLandmarker.createFromOptions(fs, opts('GPU')); }
                catch (e) { landmarker = await PoseLandmarker.createFromOptions(fs, opts('CPU')); }
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
                video.srcObject = stream;
                await video.play();
                poseStatus = 'ok';
            } catch (e) {
                console.error(e);
                poseStatus = 'failed';
            }
            readyMenu();
        }

        function detect(now) {
            if (poseStatus !== 'ok' || video.readyState < 2 || video.currentTime === lastVideoT) return;
            lastVideoT = video.currentTime;
            let res;
            try { res = landmarker.detectForVideo(video, now); } catch (e) { return; }
            const list = (res.landmarks || []).filter(lm => lm[11] && lm[12] && lm[11].visibility > 0.4 && lm[12].visibility > 0.4);
            const info = list.map(lm => ({ lm, cx: 1 - (lm[11].x + lm[12].x) / 2, sw: Math.abs(lm[11].x - lm[12].x) }));
            info.sort((a, b) => a.cx - b.cx);
            let assigned = [null, null];
            if (mode === 'cpu') {
                if (info.length) assigned[0] = info.reduce((a, b) => (b.sw > a.sw ? b : a));
            } else if (info.length === 1) {
                assigned[info[0].cx < 0.5 ? 0 : 1] = info[0];
            } else if (info.length >= 2) {
                assigned = [info[0], info[info.length - 1]];
            }
            for (let i = 0; i < 2; i++) {
                const a = assigned[i];
                poses[i] = a ? a.lm : null;
                PL[i].hasBody = !!a;
                if (a) readBody(PL[i], a);
            }
        }

        // يحوّل وضع الجسم إلى أوامر: مسار / قفز / انحناء (بوحدات عرض الكتفين)
        function readBody(p, a) {
            const b = p.body, lm = a.lm;
            const sx = a.cx, sy = (lm[11].y + lm[12].y) / 2, sw = Math.max(0.05, a.sw);
            if (b.baseX === null) { b.baseX = sx; b.baseY = sy; b.sx = sx; b.sy = sy; b.sw = sw; }
            b.sx += (sx - b.sx) * 0.5; b.sy += (sy - b.sy) * 0.5; b.sw += (sw - b.sw) * 0.2;
            const dx = (b.sx - b.baseX) / b.sw, dy = (b.sy - b.baseY) / b.sw;   // dy موجب = للأسفل
            // الخط المرجعي يتكيّف ببطء حين يقف اللاعب في وضع محايد
            const rate = b.calib < 30 ? 0.2 : 0.012;
            if (Math.abs(dy) < 0.28) b.baseY += (b.sy - b.baseY) * rate;
            if (Math.abs(dx) < 0.3) b.baseX += (b.sx - b.baseX) * rate;
            b.calib++;
            // مسار بتباطؤ (hysteresis)
            if (b.laneSt === 0 && dx < -0.6) b.laneSt = -1;
            else if (b.laneSt === 0 && dx > 0.6) b.laneSt = 1;
            else if (b.laneSt === -1 && dx > -0.35) b.laneSt = 0;
            else if (b.laneSt === 1 && dx < 0.35) b.laneSt = 0;
            p.ctl.lane = b.laneSt;
            p.ctl.duck = dy > 0.45;
            if (dy < -0.4) p.ctl.jump = true;       // يُستهلك داخل اللعب
        }

        /* ---------------- لوحة المفاتيح واللمس (احتياط) ---------------- */
        const KEYS = { KeyA: [0, 'L'], KeyD: [0, 'R'], KeyW: [0, 'U'], KeyS: [0, 'D'], ArrowLeft: [1, 'L'], ArrowRight: [1, 'R'], ArrowUp: [1, 'U'], ArrowDown: [1, 'D'] };
        window.addEventListener('keydown', (e) => {
            const k = KEYS[e.code];
            if (!k || (phase !== 'RACE' && phase !== 'READY')) return;
            e.preventDefault(); e.stopPropagation();
            const [i, a] = k;
            if (mode === 'cpu' && i === 1) return;
            const c = PL[i].ctl;
            if (a === 'L') c.lane = Math.max(-1, c.lane - 1);
            if (a === 'R') c.lane = Math.min(1, c.lane + 1);
            if (a === 'U') c.jump = true;
            if (a === 'D') { c.duck = true; PL[i].duckT = 0.6; }
        }, true);

        const touches = new Map();
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest && e.target.closest('button, .overlay, #remote-back-btn')) return;
            touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
        });
        window.addEventListener('pointerup', (e) => {
            const s = touches.get(e.pointerId); touches.delete(e.pointerId);
            if (!s || (phase !== 'RACE' && phase !== 'READY')) return;
            const dx = e.clientX - s.x, dy = e.clientY - s.y;
            let i = portrait ? (s.y < h / 2 ? 0 : 1) : (s.x < w / 2 ? 0 : 1);
            if (mode === 'cpu') i = 0;
            const c = PL[i].ctl;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) { c.jump = true; return; }       // نقرة = قفز
            if (Math.abs(dx) > Math.abs(dy)) c.lane = Math.max(-1, Math.min(1, c.lane + Math.sign(dx)));
            else if (dy < 0) c.jump = true;
            else { c.duck = true; PL[i].duckT = 0.7; }
        });

        /* ---------------- الحاسوب ---------------- */
        function aiControl(p, L, now) {
            const c = p.ctl, a = p.ai;
            const speed = L.speed;
            const near = pats.filter(o => !p['h' + o.d + o.type] && o.d - p.dist > -0.5 && o.d - p.dist < speed * 1.4 && o.type !== 'coin')
                .sort((x, y) => x.d - y.d)[0];
            if (a.act && now < a.until) {
                if (a.act === 'duck') c.duck = true;
                return;
            }
            c.duck = false;
            if (!near) { a.act = null; return; }
            const zRel = near.d - p.dist;
            if (a.rolled !== near.d) { a.rolled = near.d; a.missed = Math.random() > L.skill ? near.d : null; }
            if (a.missed === near.d) return;          // يخطئ هذا العائق
            const lanesBlocked = near.lanes.includes(p.ctl.lane);
            if (near.type === 'block') {
                if (lanesBlocked && zRel < speed * 1.1) { const free = [-1, 0, 1].filter(l => !near.lanes.includes(l)); c.lane = free.sort((x, y) => Math.abs(x - c.lane) - Math.abs(y - c.lane))[0]; }
            } else if (near.type === 'hurdle' && zRel < speed * 0.42 && p.air < 0) { c.jump = true; }
            else if (near.type === 'bar' && zRel < speed * 0.55) { c.duck = true; a.act = 'duck'; a.until = now + 700; }
        }

        /* ---------------- منطق السباق ---------------- */
        function resetPlayers() {
            PL = [mkPlayer(0), mkPlayer(1)];
            poses = [null, null];
            winner = -1;
        }

        function startRace() {
            GC.audioInit();
            level = selected;
            const L = LEVELS[level];
            overlay.classList.add('hidden');
            resetPlayers();
            PL.forEach((p, i) => { p.body.baseX = null; p.body.calib = 0; });
            pats = genPatterns(L, 1000 + level * 77 + Math.floor(Math.random() * 1000));
            phase = 'READY';
            phaseUntil = performance.now() + 3600;
            lastT = performance.now();
        }

        function jumpDur() { return 0.78; }

        function updatePlayer(p, L, dt, now) {
            // استهلاك الأوامر
            if (mode === 'cpu' && p.i === 1) aiControl(p, L, now);
            if (p.duckT > 0) { p.duckT -= dt; p.ctl.duck = true; }
            if (p.ctl.jump) { p.ctl.jump = false; if (p.air < 0 && p.ducking < 0.4) { p.air = 0; GC.beep(520, 0.12, 'sine', 0.1, 0, 760); } }
            p.lane = p.ctl.lane;
            p.laneX += (p.lane - p.laneX) * Math.min(1, dt * 12);
            if (p.air >= 0) { p.air += dt; if (p.air >= jumpDur()) p.air = -1; }
            p.hgt = p.air >= 0 ? Math.sin(Math.PI * p.air / jumpDur()) : 0;
            p.ducking += ((p.ctl.duck && p.air < 0 ? 1 : 0) - p.ducking) * Math.min(1, dt * 14);
            if (!(mode === 'cpu' && p.i === 1) && p.duckT <= 0 && !p.hasBody) p.ctl.duck = false;

            if (phase !== 'RACE' || p.finished) return;
            p.time += dt;
            p.stumble = Math.max(0, p.stumble - dt);
            const mult = p.stumble > 0 ? 0.4 : 1;
            p.dist += L.speed * (1 + Math.min(0.12, p.coins * 0.01)) * mult * dt;

            // التصادمات
            for (const o of pats) {
                const key = 'h' + o.d + o.type;
                if (p[key]) continue;
                const z = o.d - p.dist;
                if (z > 0.9 || z < -0.6) { if (z < -0.6) p[key] = true; continue; }
                const inLane = o.lanes.some(l => Math.abs(p.laneX - l) < 0.62);
                if (o.type === 'coin') {
                    if (inLane && p.hgt < 0.85) { p[key] = true; p.coins++; p.dist += 1.5; p.popups.push({ t: 0.8, txt: '+1.5م', c: '#facc15' }); GC.beep(1100, 0.08, 'sine', 0.1); }
                    continue;
                }
                let hit = false;
                if (o.type === 'hurdle') hit = inLane && p.hgt < 0.42;
                else if (o.type === 'bar') hit = p.ducking < 0.55;
                else if (o.type === 'block') hit = inLane;
                if (hit) {
                    p[key] = true; p.hits++; p.stumble = 1.0; shake[p.i] = 0.35;
                    p.popups.push({ t: 1, txt: 'اصطدام! 💥', c: '#fb7185' });
                    GC.beep(150, 0.25, 'sawtooth', 0.18, 0, 70); GC.vibrate(100);
                } else if (!p[key + 'ok'] && z < 0.2) {
                    p[key + 'ok'] = true;
                    p.popups.push({ t: 0.7, txt: o.type === 'bar' ? 'ممتاز 👍' : 'تجاوزت ✔', c: '#6ee7b7' });
                }
            }
            if (p.dist >= L.len) {
                p.finished = true;
                if (winner < 0) { winner = p.i; finishRace(); }
            }
        }

        function finishRace() {
            phase = 'DONE';
            phaseUntil = performance.now() + 3200;
            const nm = mode === 'cpu' ? (winner === 0 ? 'أنت' : 'الحاسوب') : `اللاعب ${winner + 1}`;
            banner = `${nm} يفوز! 🏆`;
            [523, 659, 784, 1047].forEach((f, i) => GC.beep(f, 0.2, 'triangle', 0.16, i * 0.11));
        }

        function endToMenu() {
            const L = LEVELS[level];
            const humanWon = mode === 'cpu' ? winner === 0 : true;
            titleEl.textContent = banner;
            const t = PL.map((p, i) => `${mode === 'cpu' ? (i === 0 ? 'أنت' : 'الحاسوب') : 'اللاعب ' + (i + 1)}: ${p.finished ? p.time.toFixed(1) + ' ث' : Math.round(p.dist) + ' م'} • 🪙 ${p.coins} • 💥 ${p.hits}`);
            descEl.innerHTML = t.join('<br>');
            if (humanWon && level < LEVELS.length - 1 && (mode === 'cpu' || true)) selected = level + 1;
            startBtn.textContent = 'سباق جديد';
            readyMenu(true);
        }

        /* ---------------- القائمة ---------------- */
        function readyMenu(keepText) {
            loader.classList.add('hidden');
            howEl.classList.remove('hidden');
            modeRow.classList.remove('hidden');
            levelRow.classList.remove('hidden');
            startBtn.classList.remove('hidden');
            if (!keepText) {
                titleEl.textContent = '🏃 سباق الأجسام';
                descEl.innerHTML = poseStatus === 'ok'
                    ? 'وقفان متجاوران أمام الكاميرا (أبعدا بنحو مترين ليظهر جسماكما)، <b>اللاعب الأول على يسار الكاميرا والثاني على يمينها</b>. أول من يصل خط النهاية يفوز!'
                    : 'تعذّر تشغيل تتبع الجسم أو الكاميرا. يمكنكما اللعب بلوحة المفاتيح (W A S D و الأسهم) أو بالسحب واللمس على الشاشة.';
            }
            levelRow.innerHTML = '';
            LEVELS.forEach((L, i) => {
                const b = document.createElement('button');
                b.className = 'opt' + (i === selected ? ' sel' : '');
                b.innerHTML = `${i + 1}. ${L.name}<small>${L.sub}</small>`;
                b.addEventListener('click', () => { selected = i; readyMenu(true); });
                levelRow.appendChild(b);
            });
            modeRow.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', b.dataset.mode === mode));
            overlay.classList.remove('hidden');
        }
        modeRow.addEventListener('click', (e) => { const b = e.target.closest('.opt'); if (!b) return; mode = b.dataset.mode; readyMenu(true); });
        startBtn.addEventListener('click', startRace);

        /* ---------------- الرسم ---------------- */
        function drawViewport(vp, p, L, now) {
            ctx.save();
            ctx.beginPath(); ctx.rect(vp.x, vp.y, vp.w, vp.h); ctx.clip();
            const hor = vp.y + vp.h * 0.30, gnd = vp.y + vp.h * 0.88;
            const unit = vp.h * 0.2, laneU = Math.min(vp.w * 0.25, vp.h * 0.32), cx = vp.x + vp.w / 2;
            if (shake[p.i] > 0) { ctx.translate((Math.random() - 0.5) * 10 * shake[p.i], (Math.random() - 0.5) * 8 * shake[p.i]); }
            // السماء
            const sg = ctx.createLinearGradient(0, vp.y, 0, hor);
            sg.addColorStop(0, L.sky[0]); sg.addColorStop(1, L.sky[1]);
            ctx.fillStyle = sg; ctx.fillRect(vp.x - 20, vp.y - 20, vp.w + 40, hor - vp.y + 20);
            ctx.fillStyle = 'rgba(0,0,0,0.12)';
            ctx.beginPath(); ctx.moveTo(vp.x, hor); for (let k = 0; k <= 6; k++) ctx.lineTo(vp.x + vp.w * k / 6, hor - (k % 2 ? 0.07 : 0.03) * vp.h); ctx.lineTo(vp.x + vp.w, hor); ctx.fill();
            // العشب والطريق
            ctx.fillStyle = '#2f6f4a'; ctx.fillRect(vp.x - 20, hor, vp.w + 40, vp.y + vp.h - hor + 20);
            const S = (z) => 1 / (1 + z * 0.075);
            const roadHalf = laneU * 1.55;
            const sFar = S(Z_MAX);
            ctx.fillStyle = L.ground;
            ctx.beginPath();
            ctx.moveTo(cx - roadHalf * sFar, hor); ctx.lineTo(cx + roadHalf * sFar, hor);
            ctx.lineTo(cx + roadHalf, gnd + unit * 0.4); ctx.lineTo(cx - roadHalf, gnd + unit * 0.4); ctx.closePath(); ctx.fill();
            // خطوط المسارات المتحركة
            ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
            for (const lx of [-0.5, 0.5]) {
                for (let z = -((p.dist * 1) % 4); z < Z_MAX; z += 4) {
                    const z1 = Math.max(0, z), z2 = Math.max(0, z + 2);
                    if (z2 <= z1) continue;
                    const s1 = S(z1), s2 = S(z2);
                    const y1 = hor + (gnd - hor) * s1, y2 = hor + (gnd - hor) * s2;
                    ctx.beginPath(); ctx.moveTo(cx + lx * laneU * 2 * s1 * 1.0, y1); ctx.lineTo(cx + lx * laneU * 2 * s2 * 1.0, y2); ctx.stroke();
                }
            }
            const proj = (lx, z, hg) => { const s = S(z); return { x: cx + lx * laneU * s, y: hor + (gnd - hor) * s - hg * unit * s, s }; };

            // خط النهاية
            const zf = L.len - p.dist;
            if (zf < Z_MAX && zf > -2) {
                const a = proj(-1.55, zf, 0), b = proj(1.55, zf, 0), th = 14 * a.s * (vp.h / 400);
                for (let k = 0; k < 10; k++) {
                    ctx.fillStyle = k % 2 ? '#111' : '#fff';
                    ctx.fillRect(a.x + (b.x - a.x) * k / 10, a.y - th, (b.x - a.x) / 10, th);
                }
                ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.max(10, 26 * a.s)}px Tahoma`; ctx.textAlign = 'center';
                ctx.fillText('النهاية', cx, a.y - th - 6 * a.s);
            }

            // العوائق من الأبعد للأقرب
            const vis = [];
            for (const o of pats) { const z = o.d - p.dist; if (z > -1.2 && z < Z_MAX && !p['h' + o.d + o.type + 'gone']) vis.push([z, o]); }
            vis.sort((a, b) => b[0] - a[0]);
            for (const [z, o] of vis) {
                const hitDone = p['h' + o.d + o.type];
                if (o.type === 'coin' && hitDone) continue;
                for (const ln of o.lanes) {
                    const q = proj(ln, Math.max(z, -1.2), 0), s = q.s;
                    ctx.globalAlpha = hitDone && z < 0 ? 0.35 : 1;
                    if (o.type === 'hurdle') {
                        const bw = laneU * 0.9 * s, bh = unit * 0.4 * s;
                        ctx.fillStyle = '#f97316'; ctx.fillRect(q.x - bw / 2, q.y - bh, bw, bh);
                        ctx.fillStyle = '#fff'; for (let k = 0; k < 4; k++) ctx.fillRect(q.x - bw / 2 + bw * (0.1 + k * 0.25), q.y - bh, bw * 0.1, bh);
                    } else if (o.type === 'block') {
                        const bw = laneU * 0.85 * s, bh = unit * 1.5 * s;
                        ctx.fillStyle = '#dc2626'; ctx.fillRect(q.x - bw / 2, q.y - bh, bw, bh);
                        ctx.strokeStyle = '#fecaca'; ctx.lineWidth = Math.max(1, 3 * s); ctx.strokeRect(q.x - bw / 2, q.y - bh, bw, bh);
                        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(q.x - bw / 2, q.y - bh, bw, bh * 0.18);
                    } else if (o.type === 'coin') {
                        const rr = unit * 0.2 * s, yy = q.y - unit * 0.55 * s;
                        ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.ellipse(q.x, yy, rr * Math.abs(Math.cos(now / 220 + z)) + 2, rr, 0, 0, 7); ctx.fill();
                        ctx.strokeStyle = '#fff7ae'; ctx.lineWidth = Math.max(1, 2 * s); ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                }
                if (o.type === 'bar') {
                    const zz = Math.max(z, -1.2), l = proj(-1.5, zz, 0), r = proj(1.5, zz, 0), s = l.s;
                    ctx.globalAlpha = hitDone && z < 0 ? 0.35 : 1;
                    ctx.fillStyle = '#64748b';
                    ctx.fillRect(l.x - 5 * s, l.y - unit * 1.4 * s, 10 * s, unit * 1.4 * s);
                    ctx.fillRect(r.x - 5 * s, r.y - unit * 1.4 * s, 10 * s, unit * 1.4 * s);
                    ctx.fillStyle = '#facc15'; ctx.fillRect(l.x, l.y - unit * 1.2 * s, r.x - l.x, unit * 0.38 * s);
                    ctx.fillStyle = '#111';
                    for (let k = 0; k < 8; k++) if (k % 2) ctx.fillRect(l.x + (r.x - l.x) * k / 8, l.y - unit * 1.2 * s, (r.x - l.x) / 8, unit * 0.38 * s);
                    ctx.globalAlpha = 1;
                }
            }

            // اللاعب
            const px = cx + p.laneX * laneU;
            const py = gnd - p.hgt * unit * 0.9;
            const bodyH = unit * (1 - 0.42 * p.ducking);
            const bw = unit * 0.5;
            const blink = p.stumble > 0 && Math.floor(now / 80) % 2;
            ctx.globalAlpha = blink ? 0.4 : 1;
            ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(px, gnd + 4, bw * (0.7 - p.hgt * 0.2), 7, 0, 0, 7); ctx.fill();
            const step = Math.sin(now / 90) * (p.air < 0 && p.stumble <= 0 ? 1 : 0.2);
            ctx.strokeStyle = COLORS[p.i]; ctx.lineWidth = Math.max(5, unit * 0.1); ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(px, py - bodyH * 0.45); ctx.lineTo(px - bw * 0.3 + step * bw * 0.25, py);
            ctx.moveTo(px, py - bodyH * 0.45); ctx.lineTo(px + bw * 0.3 - step * bw * 0.25, py);
            ctx.stroke();
            ctx.fillStyle = COLORS[p.i];
            ctx.beginPath(); ctx.roundRect(px - bw / 2, py - bodyH * 0.95, bw, bodyH * 0.55, bw * 0.3); ctx.fill();
            ctx.font = `${unit * 0.5}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
            ctx.fillText(p.i === 0 ? '😎' : '🤓', px, py - bodyH * 0.95 - unit * 0.18);
            ctx.globalAlpha = 1;

            // واجهة اللاعب
            const fs = Math.max(13, Math.min(vp.w * 0.045, 22));
            const nm = mode === 'cpu' ? (p.i === 0 ? 'أنت' : 'الحاسوب') : `اللاعب ${p.i + 1}`;
            ctx.textBaseline = 'middle';
            ctx.font = `bold ${fs}px Tahoma`; ctx.textAlign = 'right'; ctx.fillStyle = COLORS[p.i];
            ctx.fillText(nm, vp.x + vp.w - 10, vp.y + 18);
            ctx.font = `${fs * 0.8}px Tahoma`; ctx.fillStyle = '#fff'; ctx.textAlign = 'right';
            ctx.fillText(`🪙 ${p.coins}   💥 ${p.hits}`, vp.x + vp.w - 10, vp.y + 18 + fs * 1.3);
            // شريط التقدم
            const bwid = vp.w * 0.5, bx = vp.x + 10, by = vp.y + 14;
            ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(bx, by, bwid, 10);
            ctx.fillStyle = COLORS[p.i]; ctx.fillRect(bx, by, bwid * Math.min(1, p.dist / L.len), 10);
            ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = `${fs * 0.75}px Tahoma`;
            ctx.fillText(`${Math.max(0, Math.round(L.len - p.dist))} م`, bx, by + 24);
            // إشعارات
            p.popups.forEach((pp, k) => {
                ctx.globalAlpha = Math.min(1, pp.t); ctx.fillStyle = pp.c; ctx.textAlign = 'center';
                ctx.font = `bold ${fs * 1.2}px Tahoma`;
                ctx.fillText(pp.txt, px, vp.y + vp.h * 0.55 - (1 - pp.t) * 40 - k * 4);
            });
            ctx.globalAlpha = 1;
            // لم يُكتشف الجسم
            const manual = (mode === 'cpu' && p.i === 1);
            if (!manual && poseStatus === 'ok' && !p.hasBody && (phase === 'READY' || phase === 'RACE')) {
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(vp.x, vp.y + vp.h * 0.4, vp.w, 40);
                ctx.fillStyle = '#fca5a5'; ctx.font = `bold ${fs}px Tahoma`; ctx.textAlign = 'center';
                ctx.fillText('قف أمام الكاميرا ليظهر جسمك', vp.x + vp.w / 2, vp.y + vp.h * 0.4 + 20);
            }
            ctx.restore();
            // الفاصل
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            if (p.i === 0) { if (portrait) ctx.fillRect(0, vp.y + vp.h - 2, w, 4); else ctx.fillRect(vp.x + vp.w - 2, 0, 4, h); }
        }

        function drawRadar() {
            // نافذة صغيرة بالكاميرا مع هيكلي اللاعبين
            const pw = Math.min(150, w * 0.3), ph = pw * 0.75;
            const x = w / 2 - pw / 2, y = portrait ? h / 2 - ph / 2 : h - ph - 10;
            ctx.save();
            ctx.beginPath(); ctx.roundRect(x, y, pw, ph, 8); ctx.clip();
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x, y, pw, ph);
            if (poseStatus === 'ok' && video.videoWidth) {
                ctx.save(); ctx.translate(x + pw, y); ctx.scale(-1, 1);
                ctx.globalAlpha = 0.55; ctx.drawImage(video, 0, 0, pw, ph); ctx.restore(); ctx.globalAlpha = 1;
            }
            const CON = [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [24, 26], [26, 28]];
            poses.forEach((lm, i) => {
                if (!lm) return;
                ctx.strokeStyle = COLORS[i]; ctx.lineWidth = 3; ctx.beginPath();
                CON.forEach(([a, b]) => { if (lm[a] && lm[b]) { ctx.moveTo(x + (1 - lm[a].x) * pw, y + lm[a].y * ph); ctx.lineTo(x + (1 - lm[b].x) * pw, y + lm[b].y * ph); } });
                ctx.stroke();
                ctx.fillStyle = COLORS[i]; ctx.beginPath(); ctx.arc(x + (1 - lm[0].x) * pw, y + lm[0].y * ph, 5, 0, 7); ctx.fill();
            });
            ctx.restore();
            ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x, y, pw, ph, 8); ctx.stroke();
        }

        function draw(now) {
            GC.begin(ctx);
            ctx.clearRect(0, 0, w, h);
            if (phase === 'MENU') { ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, w, h); return; }
            const L = LEVELS[level];
            vps.forEach((vp, i) => drawViewport(vp, PL[i], L, now));
            drawRadar();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const big = Math.max(40, Math.min(w, h) * 0.16);
            if (phase === 'READY') {
                const n = Math.ceil((phaseUntil - now) / 900);
                ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, h * 0.25, w, h * 0.3);
                ctx.fillStyle = '#fde047'; ctx.font = `bold ${big}px Arial`; ctx.shadowColor = '#000'; ctx.shadowBlur = 10;
                ctx.fillText(n > 3 ? 'قفا بوضع الاستعداد' : n, w / 2, h * 0.37);
                ctx.shadowBlur = 0;
                ctx.font = `bold ${Math.max(14, big * 0.25)}px Tahoma`; ctx.fillStyle = '#fff';
                ctx.fillText(`المستوى ${level + 1}: ${L.name} — ${L.len} متراً`, w / 2, h * 0.37 + big * 0.7);
            } else if (phase === 'DONE') {
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, h * 0.35, w, h * 0.2);
                ctx.fillStyle = '#fff'; ctx.shadowColor = COLORS[winner]; ctx.shadowBlur = 18;
                ctx.font = `bold ${Math.max(28, big * 0.6)}px Tahoma`;
                ctx.fillText(banner, w / 2, h * 0.45);
                ctx.shadowBlur = 0;
            }
        }

        function loop(now) {
            const dt = Math.min((now - lastT) / 1000, 0.05);
            lastT = now;
            detect(now);
            if (phase !== 'MENU') {
                const L = LEVELS[level];
                shake = shake.map(s => Math.max(0, s - dt));
                PL.forEach(p => { p.popups.forEach(q => q.t -= dt); p.popups = p.popups.filter(q => q.t > 0); });
                if (phase === 'READY') {
                    // معايرة: نترك الخط المرجعي يتكيف أثناء العد التنازلي
                    PL.forEach(p => updatePlayer(p, L, dt, now));
                    if (now >= phaseUntil) { phase = 'RACE'; GC.beep(880, 0.3, 'square', 0.14); }
                    else if (Math.ceil((phaseUntil - now) / 900) !== Math.ceil((phaseUntil - now - dt * 1000) / 900)) GC.beep(440, 0.1, 'square', 0.1);
                } else {
                    PL.forEach(p => updatePlayer(p, L, dt, now));
                    if (phase === 'DONE' && now >= phaseUntil) { phase = 'MENU'; endToMenu(); }
                }
            }
            draw(now);
            requestAnimationFrame(loop);
        }

        layoutVps();
        requestAnimationFrame(loop);
        initPose();
    </script>
    <script src="remote-nav.js"></script>
</body>
</html>
