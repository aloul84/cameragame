<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>بينبول</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="game-common.js"></script>
    <script src="edu-common.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0618; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        #canvas { position: fixed; top: 0; left: 0; display: block; }
        .overlay { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            background: radial-gradient(circle at 50% 0%, #2a1458, #0a0618 75%); padding: 16px; overflow-y: auto; }
        .overlay > * { flex-shrink: 0; }
        h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 7vw, 3rem); color: #f0abfc; text-shadow: 0 0 16px rgba(240, 171, 252, 0.6); }
        p { margin: 0 0 12px; max-width: 640px; line-height: 1.7; color: #cbd5e1; font-size: clamp(0.92rem, 3.4vw, 1.1rem); }
        .how { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 0 0 14px; max-width: 720px; }
        .how span { background: rgba(255,255,255,0.09); border-radius: 12px; padding: 7px 14px; font-size: 0.95rem; }
        button { font-family: inherit; cursor: pointer; border: 2px solid #f0abfc; color: #fff; background: #86198f; border-radius: 50px; padding: 12px 40px;
            font-size: clamp(1.1rem, 4.5vw, 1.4rem); box-shadow: 0 0 16px rgba(240, 171, 252, 0.4); margin: 4px; }
        button:active { transform: scale(0.97); }
        .row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 0 0 12px; }
        .opt { padding: 7px 16px; font-size: 1rem; background: #241447; box-shadow: none; border-color: transparent; border-radius: 14px; }
        .opt small { display: block; font-size: 0.68rem; opacity: 0.85; }
        .opt.sel { background: #f0abfc; color: #3b0764; }
        #menuBtn { position: fixed; z-index: 12; top: calc(10px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left)); display: none; padding: 8px 14px; font-size: 0.95rem;
            background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.25); box-shadow: none; border-radius: 12px; margin: 0; }
        .hidden { display: none !important; }
        .loader { border: 5px solid rgba(255,255,255,0.1); border-top-color: #f0abfc; border-radius: 50%; width: 46px; height: 46px; animation: spin 1s linear infinite; margin-bottom: 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-height: 560px) { h1 { margin-bottom: 2px; } p { margin-bottom: 6px; } .how { margin-bottom: 6px; } button { padding: 8px 26px; } .opt { padding: 4px 12px; } }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <button id="menuBtn">☰ القائمة</button>

    <div id="overlay" class="overlay">
        <div id="loader" class="loader"></div>
        <h1 id="title">🎯 بينبول</h1>
        <p id="desc">جاري تشغيل الكاميرا...</p>
        <div class="how" id="how">
            <span>✊ اقبض <b>يدك اليمنى</b> = الذراع اليمنى</span>
            <span>✊ اقبض <b>يدك اليسرى</b> = الذراع اليسرى</span>
            <span>🚀 حرّك يدك بسرعة <b>للأعلى</b> لإطلاق الكرة</span>
            <span>⌨️ Z / M للذراعين، المسافة للإطلاق</span>
        </div>
        <div class="row" id="levelRow"></div>
        <div class="row">
            <button id="resumeBtn" class="hidden">متابعة</button>
            <button id="startBtn" class="hidden">لعبة جديدة</button>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const canvas = $('canvas'), ctx = canvas.getContext('2d');
        const overlay = $('overlay'), titleEl = $('title'), descEl = $('desc'), loader = $('loader');
        const startBtn = $('startBtn'), resumeBtn = $('resumeBtn'), menuBtn = $('menuBtn'), levelRow = $('levelRow');
        const toAr = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
        const video = EDU.makeVideo();

        /* ---------------- الإعدادات ---------------- */
        const TW = 600, TH = 1000;       // أبعاد الطاولة المنطقية
        const BR = 11;                   // نصف قطر الكرة
        const GRAV = 1000;               // الجاذبية
        const MAXV = 1800;
        const SUB = 8;                   // خطوات فيزياء لكل إطار
        const LEVELS = [
            { name: 'سهل', sub: 'ذراع أطول وحماية أكبر', flip: 104, save: 15, kick: 1 },
            { name: 'عادي', sub: 'متوازن', flip: 98, save: 9, kick: 1.1 },
            { name: 'صعب', sub: 'ذراع أقصر', flip: 90, save: 4, kick: 1.25 }
        ];
        const cfg = { level: 1 };
        const HI_KEY = 'pinball_hi';

        /* ---------------- حالة اللعبة ---------------- */
        let w = 0, h = 0, S = 1, OX = 0, OY = 0, bg = null, lastT = performance.now();
        let phase = 'MENU';              // MENU, WAIT, PLAY, OVER
        let score = 0, balls = 3, mult = 1, hi = GC.store.get(HI_KEY), newHi = false;
        let ball = { x: 560, y: 953, vx: 0, vy: 0, trail: [] };
        let waitT = 0, playT = 0, stillT = 0, saveLeft = 0, toast = '', toastT = 0, shake = 0;
        let cameraOK = false, paused = false;
        const pops = [];

        function layout() {
            S = Math.min((h - 16) / TH, (w * 0.96) / TW);
            OX = (w - TW * S) / 2; OY = (h - TH * S) / 2;
            buildBg();
        }

        /* ---------------- هندسة الطاولة ---------------- */
        const walls = [];
        function addWall(ax, ay, bx, by, o) {
            const dx = bx - ax, dy = by - ay, l = Math.hypot(dx, dy);
            walls.push(Object.assign({ ax, ay, bx, by, e: 0.4, nx: -dy / l, ny: dx / l }, o || {}));
        }
        // جدار أيسر + قوس علوي + جدار أيمن
        addWall(20, 300, 20, 800);
        const ARC = [];
        for (let i = 0; i <= 28; i++) {
            const a = Math.PI + (Math.PI * i) / 28;
            ARC.push([300 + 280 * Math.cos(a), 300 + 280 * Math.sin(a)]);
        }
        for (let i = 0; i < ARC.length - 1; i++) addWall(ARC[i][0], ARC[i][1], ARC[i + 1][0], ARC[i + 1][1], { e: 0.25 });
        addWall(580, 300, 580, 965);
        addWall(540, 965, 580, 965, { e: 0.1 });                 // أرضية الدافع
        addWall(540, 330, 540, 965);                             // فاصل ممر الإطلاق
        addWall(580, 285, 540, 320, { oneway: true, nx: -0.66, ny: -0.75, e: 0.2 });  // بوابة باتجاه واحد
        addWall(20, 800, 160, 900, { e: 0.3 });                  // موجّه أيسر
        addWall(540, 800, 400, 900, { e: 0.3 });                 // موجّه أيمن
        // المطاطات (الدفع الجانبي)
        const SLINGS = [
            { ax: 70, ay: 690, bx: 135, by: 790 },
            { ax: 490, ay: 690, bx: 425, by: 790 }
        ];
        SLINGS.forEach((s, i) => {
            const dx = s.bx - s.ax, dy = s.by - s.ay, l = Math.hypot(dx, dy);
            let nx = dy / l, ny = -dx / l;                       // وجه المطاط يواجه الداخل
            if ((i === 0 && nx < 0) || (i === 1 && nx > 0)) { nx = -nx; ny = -ny; }
            s.nx = nx; s.ny = ny; s.hit = 0;
            addWall(s.ax, s.ay, s.bx, s.by, { e: 0.5, sling: s });
        });
        const BUMPERS = [
            { x: 190, y: 420, r: 34, pts: 100, hit: 0, c: '#f43f5e' },
            { x: 370, y: 420, r: 34, pts: 100, hit: 0, c: '#38bdf8' },
            { x: 280, y: 545, r: 34, pts: 150, hit: 0, c: '#facc15' },
            { x: 110, y: 290, r: 24, pts: 50, hit: 0, c: '#4ade80' },
            { x: 450, y: 290, r: 24, pts: 50, hit: 0, c: '#c084fc' }
        ];
        const ROLLS = [{ x: 200, y: 125, lit: false }, { x: 300, y: 125, lit: false }, { x: 400, y: 125, lit: false }];
        const FLIPS = [
            { px: 160, py: 900, dir: 1, rest: 0.5, up: -0.55, a: 0.5, w: 0, on: false, len: 98 },
            { px: 400, py: 900, dir: -1, rest: Math.PI - 0.5, up: Math.PI + 0.55, a: Math.PI - 0.5, w: 0, on: false, len: 98 }
        ];
        const FLIP_SPEED = 20, FLIP_TH = 10;
        const flipTip = (f) => ({ x: f.px + f.len * Math.cos(f.a), y: f.py + f.len * Math.sin(f.a) });

        /* ---------------- الخلفية الثابتة (تُرسم مرة واحدة) ---------------- */
        function buildBg() {
            const d = GC.view.dpr;
            bg = document.createElement('canvas'); bg.width = Math.round(w * d); bg.height = Math.round(h * d);
            const g = bg.getContext('2d');
            g.setTransform(d * S, 0, 0, d * S, d * OX, d * OY);
            // جسم الطاولة
            g.beginPath(); g.moveTo(20, 1000); g.lineTo(20, 300);
            ARC.forEach((p) => g.lineTo(p[0], p[1]));
            g.lineTo(580, 1000); g.closePath();
            const grad = g.createLinearGradient(0, 0, 0, TH);
            grad.addColorStop(0, '#2b1260'); grad.addColorStop(0.5, '#1c0e46'); grad.addColorStop(1, '#10082b');
            g.fillStyle = grad; g.globalAlpha = 0.93; g.fill(); g.globalAlpha = 1;
            g.save(); g.clip();
            g.strokeStyle = 'rgba(255,255,255,0.05)'; g.lineWidth = 1;
            for (let x = 40; x < 600; x += 40) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, TH); g.stroke(); }
            for (let y = 40; y < TH; y += 40) { g.beginPath(); g.moveTo(0, y); g.lineTo(TW, y); g.stroke(); }
            // دوائر زخرفية
            g.strokeStyle = 'rgba(240,171,252,0.12)'; g.lineWidth = 3;
            g.beginPath(); g.arc(280, 420, 150, 0, 7); g.stroke();
            g.beginPath(); g.arc(280, 420, 90, 0, 7); g.stroke();
            // منطقة التصريف
            g.fillStyle = 'rgba(244,63,94,0.12)'; g.fillRect(20, 960, 520, 40);
            g.restore();
            // الجدران
            g.lineCap = 'round'; g.lineJoin = 'round';
            g.strokeStyle = '#a78bfa'; g.lineWidth = 7;
            walls.forEach((wl) => { if (wl.sling) return; g.beginPath(); g.moveTo(wl.ax, wl.ay); g.lineTo(wl.bx, wl.by); g.stroke(); });
            g.strokeStyle = '#7c3aed'; g.lineWidth = 3;
            walls.forEach((wl) => { if (wl.sling) return; g.beginPath(); g.moveTo(wl.ax, wl.ay); g.lineTo(wl.bx, wl.by); g.stroke(); });
            // البوابة
            g.strokeStyle = '#fbbf24'; g.lineWidth = 5; g.beginPath(); g.moveTo(580, 285); g.lineTo(540, 320); g.stroke();
            // أسهم ممر الإطلاق
            g.fillStyle = 'rgba(251,191,36,0.35)';
            for (let y = 500; y < 900; y += 80) { g.beginPath(); g.moveTo(560, y - 14); g.lineTo(572, y + 8); g.lineTo(548, y + 8); g.closePath(); g.fill(); }
        }

        GC.fitCanvas(canvas, (nw, nh) => { w = nw; h = nh; layout(); });

        /* ---------------- الفيزياء ---------------- */
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        function closestOnSeg(px, py, ax, ay, bx, by) {
            const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
            const t = l2 ? clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1) : 0;
            return { x: ax + dx * t, y: ay + dy * t };
        }

        function addScore(p, x, y) {
            const v = p * mult;
            score += v;
            pops.push({ x, y, t: 0.8, s: '+' + toAr(v) });
        }
        function say(msg) { toast = msg; toastT = 1.8; }

        function stepPhysics(dt) {
            const L = LEVELS[cfg.level];
            // الأذرع
            FLIPS.forEach((f) => {
                const target = f.on ? f.up : f.rest, diff = target - f.a, step = FLIP_SPEED * dt;
                const na = f.a + clamp(diff, -step, step);
                f.w = (na - f.a) / dt; f.a = na;
            });
            if (phase === 'WAIT') {                                  // الكرة في الدافع
                ball.x = 560; ball.y = 953; ball.vx = ball.vy = 0; return;
            }
            if (phase !== 'PLAY') return;

            ball.vy += GRAV * dt;
            ball.x += ball.vx * dt; ball.y += ball.vy * dt;

            // الجدران
            for (const wl of walls) {
                const c = closestOnSeg(ball.x, ball.y, wl.ax, wl.ay, wl.bx, wl.by);
                let dx = ball.x - c.x, dy = ball.y - c.y, d = Math.hypot(dx, dy);
                if (d >= BR) continue;
                if (wl.oneway && (ball.x - wl.ax) * wl.nx + (ball.y - wl.ay) * wl.ny < 0) continue;
                let nx, ny;
                if (d > 1e-6) { nx = dx / d; ny = dy / d; } else { nx = wl.nx; ny = wl.ny; d = 0; }
                ball.x += nx * (BR - d); ball.y += ny * (BR - d);
                const vn = ball.vx * nx + ball.vy * ny;
                if (vn < 0) {
                    ball.vx -= (1 + wl.e) * vn * nx; ball.vy -= (1 + wl.e) * vn * ny;
                    if (wl.sling && (nx * wl.sling.nx + ny * wl.sling.ny) > 0.5) {
                        const k = 520 * L.kick;
                        ball.vx += wl.sling.nx * k; ball.vy += wl.sling.ny * k;
                        wl.sling.hit = 0.25; addScore(10, c.x, c.y); GC.beep(260, 0.08, 'square', 0.1);
                    } else if (-vn > 250) GC.beep(180, 0.04, 'sine', 0.05);
                }
            }
            // المصدّات
            for (const b of BUMPERS) {
                const dx = ball.x - b.x, dy = ball.y - b.y, d = Math.hypot(dx, dy), m = b.r + BR;
                if (d >= m) continue;
                const nx = d > 1e-6 ? dx / d : 0, ny = d > 1e-6 ? dy / d : -1;
                ball.x = b.x + nx * m; ball.y = b.y + ny * m;
                const vn = ball.vx * nx + ball.vy * ny;
                if (vn < 0) { ball.vx -= 2 * vn * nx; ball.vy -= 2 * vn * ny; }
                const k = 380 * L.kick; ball.vx += nx * k; ball.vy += ny * k;
                b.hit = 0.22; shake = Math.max(shake, 2);
                addScore(b.pts, b.x, b.y - b.r); GC.beep(520 + Math.random() * 380, 0.1, 'triangle', 0.15);
            }
            // الأذرع
            FLIPS.forEach((f) => {
                const tip = flipTip(f), c = closestOnSeg(ball.x, ball.y, f.px, f.py, tip.x, tip.y);
                let dx = ball.x - c.x, dy = ball.y - c.y, d = Math.hypot(dx, dy);
                if (d >= BR + FLIP_TH) return;
                const nx = d > 1e-6 ? dx / d : 0, ny = d > 1e-6 ? dy / d : -1;
                ball.x = c.x + nx * (BR + FLIP_TH); ball.y = c.y + ny * (BR + FLIP_TH);
                const rx = c.x - f.px, ry = c.y - f.py, sx = -f.w * ry, sy = f.w * rx;   // سرعة سطح الذراع
                let rvx = ball.vx - sx, rvy = ball.vy - sy;
                const vn = rvx * nx + rvy * ny;
                if (vn < 0) {
                    rvx -= (1 + 0.35) * vn * nx; rvy -= (1 + 0.35) * vn * ny;
                    ball.vx = sx + rvx; ball.vy = sy + rvy;
                    if (Math.abs(f.w) > 3) GC.beep(340, 0.07, 'square', 0.1);
                }
            });
            // سرعة قصوى
            const sp = Math.hypot(ball.vx, ball.vy);
            if (sp > MAXV) { ball.vx *= MAXV / sp; ball.vy *= MAXV / sp; }

            // أضواء الممرات العلوية
            for (const r of ROLLS) {
                if (!r.lit && Math.hypot(ball.x - r.x, ball.y - r.y) < 22) {
                    r.lit = true; addScore(50, r.x, r.y); GC.beep(900, 0.08, 'sine', 0.12);
                    if (ROLLS.every((q) => q.lit)) {
                        ROLLS.forEach((q) => { q.lit = false; });
                        if (mult < 5) mult++;
                        addScore(500, 300, 190); say(`مضاعف ×${toAr(mult)}!`);
                        [660, 880, 1100].forEach((f, i) => GC.beep(f, 0.12, 'triangle', 0.14, i * 0.08));
                    }
                }
            }
        }

        function drained() {
            if (saveLeft > 0) { say('🛡️ إنقاذ الكرة!'); GC.beep(500, 0.3, 'sine', 0.12, 0, 900); resetBall(); return; }
            balls--; GC.beep(300, 0.4, 'sawtooth', 0.12, 0, 80); GC.vibrate(120);
            mult = 1;
            if (balls <= 0) { endGame(); return; }
            say(`تبقّى ${toAr(balls)} كرات`); resetBall();
        }
        function resetBall() {
            phase = 'WAIT'; waitT = 0; ball.x = 560; ball.y = 953; ball.vx = ball.vy = 0; ball.trail.length = 0; saveLeft = 0;
        }
        function launch() {
            if (phase !== 'WAIT' || waitT < 1 || !overlay.classList.contains('hidden')) return;
            phase = 'PLAY'; playT = 0; stillT = 0; saveLeft = LEVELS[cfg.level].save;
            ball.vx = 0; ball.vy = -(1480 + Math.random() * 80);
            GC.beep(200, 0.35, 'sawtooth', 0.14, 0, 900); GC.vibrate(40);
        }

        /* ---------------- القائمة والمراحل ---------------- */
        function buildLevels() {
            levelRow.innerHTML = '';
            LEVELS.forEach((L, i) => {
                const b = document.createElement('button');
                b.className = 'opt' + (i === cfg.level ? ' sel' : '');
                b.innerHTML = `${L.name}<small>${L.sub}</small>`;
                b.addEventListener('click', () => { cfg.level = i; buildLevels(); });
                levelRow.appendChild(b);
            });
        }
        function newGame() {
            const L = LEVELS[cfg.level];
            FLIPS.forEach((f) => { f.len = L.flip; f.a = f.rest; f.w = 0; f.on = false; });
            BUMPERS.forEach((b) => { b.hit = 0; });
            ROLLS.forEach((r) => { r.lit = false; });
            score = 0; balls = 3; mult = 1; newHi = false; pops.length = 0; toastT = 0;
            resetBall();
        }
        function showMenu(title, msg, paused_) {
            paused = !!paused_;
            titleEl.textContent = title; descEl.innerHTML = msg;
            resumeBtn.classList.toggle('hidden', !paused);
            startBtn.textContent = phase === 'OVER' ? 'العب مجدداً' : 'لعبة جديدة';
            overlay.classList.remove('hidden'); menuBtn.style.display = 'none'; EDU.active = false;
        }
        function hideMenu() {
            overlay.classList.add('hidden'); menuBtn.style.display = 'block'; EDU.active = true; GC.audioInit();
        }
        function endGame() {
            phase = 'OVER';
            if (score > hi) { hi = score; newHi = true; GC.store.set(HI_KEY, hi); }
            [523, 659, 784, 1047].forEach((f, i) => GC.beep(f, 0.2, 'triangle', 0.14, i * 0.11));
            showMenu('انتهت اللعبة 🎯', `نتيجتك: <b>${toAr(score)}</b>${newHi ? ' 🏆 رقم قياسي جديد!' : ''}<br>أعلى نتيجة: ${toAr(hi)}`);
        }
        startBtn.addEventListener('click', () => { newGame(); hideMenu(); });
        resumeBtn.addEventListener('click', () => { hideMenu(); });
        menuBtn.addEventListener('click', () => { showMenu('⏸️ إيقاف مؤقت', `نتيجتك الآن: ${toAr(score)}`, true); });

        /* ---------------- المدخلات: اليدان / لوحة المفاتيح / اللمس ---------------- */
        const keys = { l: false, r: false }, touch = new Map(), fistState = [false, false];
        let hands = [], handsT = 0, thrust = [], handHold = [0, 0];
        const fistRatio = (lm) => {
            const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y), wr = lm[0];
            const base = Math.max(0.001, d(wr, lm[9]));
            return ([8, 12, 16, 20].reduce((s, i) => s + d(lm[i], wr), 0) / 4) / base;
        };
        function onHands(res) {
            const now = performance.now();
            const L = res.multiHandLandmarks || [];
            hands = L.map((lm) => ({ x: 1 - lm[9].x, y: lm[9].y, ratio: fistRatio(lm), lm }));
            handsT = now;
            // يمين/يسار بحسب موضع اليد في الصورة المعكوسة (أوثق من تسمية MediaPipe)
            hands.sort((a, b) => a.x - b.x);
            const assign = [null, null];
            if (hands.length >= 2) { assign[0] = hands[0]; assign[1] = hands[hands.length - 1]; }
            else if (hands.length === 1) assign[hands[0].x < 0.5 ? 0 : 1] = hands[0];
            for (let i = 0; i < 2; i++) {
                const hd = assign[i];
                if (hd) {
                    hd.side = i;
                    if (hd.ratio < 1.3) fistState[i] = true; else if (hd.ratio > 1.55) fistState[i] = false;
                    handHold[i] = now;
                    // سجلّ الحركة للأعلى (إطلاق)
                    thrust.push({ t: now, y: hd.y });
                } else if (now - handHold[i] > 250) fistState[i] = false;
            }
            while (thrust.length && now - thrust[0].t > 400) thrust.shift();
            // دفعة سريعة للأعلى: ارتفاع اليد > 0.17 خلال ٣٠٠ مللي ثانية
            if (phase === 'WAIT' && waitT > 1 && thrust.length > 2) {
                const win = thrust.filter((p) => now - p.t < 300);
                if (win.length > 2) { const top = Math.min(...win.map((p) => p.y)), first = win[0].y; if (first - top > 0.17 && win[win.length - 1].y < first - 0.12) { launch(); thrust.length = 0; } }
            }
        }
        const kmap = { KeyZ: 'l', KeyA: 'l', ArrowLeft: 'l', KeyM: 'r', KeyL: 'r', ArrowRight: 'r', Slash: 'r' };
        window.addEventListener('keydown', (e) => {
            if (kmap[e.code]) keys[kmap[e.code]] = true;
            if (e.code === 'Space' || e.code === 'ArrowDown') { launch(); e.preventDefault(); }
        });
        window.addEventListener('keyup', (e) => { if (kmap[e.code]) keys[kmap[e.code]] = false; });
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest && e.target.closest('button, .overlay')) return;
            touch.set(e.pointerId, e.clientX);
            if (phase === 'WAIT') launch();
        });
        const unTouch = (e) => touch.delete(e.pointerId);
        window.addEventListener('pointerup', unTouch); window.addEventListener('pointercancel', unTouch);
        function inputState() {
            let l = keys.l || fistState[0], r = keys.r || fistState[1];
            touch.forEach((x) => { if (x < w / 2) l = true; else r = true; });
            return [l, r];
        }

        /* ---------------- الرسم ---------------- */
        function drawFlip(f) {
            const tip = flipTip(f);
            ctx.save();
            ctx.lineCap = 'round';
            ctx.strokeStyle = f.on ? '#fde047' : '#f472b6'; ctx.lineWidth = FLIP_TH * 2;
            ctx.beginPath(); ctx.moveTo(f.px, f.py); ctx.lineTo(tip.x, tip.y); ctx.stroke();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.globalAlpha = 0.45;
            ctx.beginPath(); ctx.moveTo(f.px, f.py); ctx.lineTo(tip.x, tip.y); ctx.stroke();
            ctx.globalAlpha = 1; ctx.fillStyle = '#4c1d95'; ctx.beginPath(); ctx.arc(f.px, f.py, 6, 0, 7); ctx.fill();
            ctx.restore();
        }
        function draw(now, dt) {
            GC.begin(ctx);
            const bgg = ctx.createLinearGradient(0, 0, 0, h); bgg.addColorStop(0, '#12082e'); bgg.addColorStop(1, '#05030f');
            ctx.fillStyle = bgg; ctx.fillRect(0, 0, w, h);
            if (cameraOK && video.videoWidth) {                         // الكاميرا خافتة في الخلفية
                EDU.drawVideo(ctx, video, { x: 0, y: 0, w, h: h }, 0.22);
            }
            if (bg && bg.width) ctx.drawImage(bg, 0, 0, w, h);

            ctx.save();
            const sh = shake > 0.1 ? (Math.random() - 0.5) * shake : 0;
            ctx.translate(OX + sh, OY + sh); ctx.scale(S, S);

            // الممرات العلوية
            ROLLS.forEach((r) => {
                ctx.beginPath(); ctx.arc(r.x, r.y, 14, 0, 7);
                ctx.fillStyle = r.lit ? '#fde047' : 'rgba(255,255,255,0.1)'; ctx.fill();
                ctx.strokeStyle = r.lit ? '#fff' : 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2; ctx.stroke();
            });
            // المطاطات
            SLINGS.forEach((s) => {
                ctx.beginPath(); ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by);
                ctx.lineTo(s.ax < 300 ? s.ax : s.ax, s.by); ctx.closePath();
                ctx.fillStyle = s.hit > 0 ? 'rgba(253,224,71,0.6)' : 'rgba(244,114,182,0.22)'; ctx.fill();
                ctx.lineCap = 'round'; ctx.strokeStyle = s.hit > 0 ? '#fde047' : '#f472b6'; ctx.lineWidth = 7;
                ctx.beginPath(); ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by); ctx.stroke();
                if (s.hit > 0) s.hit -= dt;
            });
            // المصدّات
            BUMPERS.forEach((b) => {
                const k = b.hit > 0 ? 1 + b.hit * 0.9 : 1;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r * k, 0, 7);
                ctx.fillStyle = b.hit > 0 ? '#fff' : b.c; ctx.fill();
                ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.stroke();
                ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.55, 0, 7); ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fill();
                EDU.text(ctx, toAr(b.pts), b.x, b.y + 1, b.r * 0.6, '#fff');
                if (b.hit > 0) b.hit -= dt;
            });
            FLIPS.forEach(drawFlip);

            // الدافع
            if (phase === 'WAIT') {
                const pull = 8 + Math.sin(now / 160) * 4;
                ctx.fillStyle = '#fbbf24'; ctx.fillRect(548, 964 + pull, 24, 28);
                ctx.fillStyle = '#92400e'; ctx.fillRect(560, 964 + pull + 20, 0, 0);
            }
            // الكرة
            if (phase === 'WAIT' || phase === 'PLAY') {
                ball.trail.push({ x: ball.x, y: ball.y }); if (ball.trail.length > 9) ball.trail.shift();
                for (let i = 0; i < ball.trail.length; i++) {
                    ctx.globalAlpha = i / ball.trail.length * 0.35; ctx.fillStyle = '#e0e7ff';
                    ctx.beginPath(); ctx.arc(ball.trail[i].x, ball.trail[i].y, BR * (0.4 + 0.5 * i / ball.trail.length), 0, 7); ctx.fill();
                }
                ctx.globalAlpha = 1;
                const g = ctx.createRadialGradient(ball.x - 4, ball.y - 4, 1, ball.x, ball.y, BR);
                g.addColorStop(0, '#fff'); g.addColorStop(0.6, '#cbd5e1'); g.addColorStop(1, '#64748b');
                ctx.beginPath(); ctx.arc(ball.x, ball.y, BR, 0, 7); ctx.fillStyle = g; ctx.fill();
                if (saveLeft > 0) { ctx.strokeStyle = 'rgba(74,222,128,0.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ball.x, ball.y, BR + 4, 0, 7); ctx.stroke(); }
            }
            // نقاط عائمة
            for (let i = pops.length - 1; i >= 0; i--) {
                const p = pops[i]; p.t -= dt; p.y -= 40 * dt;
                if (p.t <= 0) { pops.splice(i, 1); continue; }
                ctx.globalAlpha = Math.min(1, p.t * 2); EDU.text(ctx, p.s, p.x, p.y, 22, '#fde047'); ctx.globalAlpha = 1;
            }
            ctx.restore();
            if (shake > 0) shake = Math.max(0, shake - dt * 14);

            // الواجهة
            const fs = Math.max(13, Math.min(w * 0.034, 22)), big = Math.max(20, Math.min(w * 0.06, 44));
            const lx = Math.max(10, OX - 10), pw = Math.max(0, OX - 18);
            ctx.textBaseline = 'middle';
            const hudSide = pw > 110;
            const hx = hudSide ? 0 : OX + 12, hr = hudSide ? OX : OX + TW * S - 12;
            if (hudSide) {
                ctx.textAlign = 'center';
                ctx.fillStyle = '#c4b5fd'; ctx.font = `700 ${fs}px Tahoma`; ctx.fillText('النتيجة', OX / 2, h * 0.16);
                EDU.text(ctx, toAr(score), OX / 2, h * 0.16 + big, big, '#fde047', '#a21caf');
                ctx.fillStyle = '#c4b5fd'; ctx.font = `700 ${fs}px Tahoma`; ctx.fillText('الكرات', OX / 2, h * 0.38);
                for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(OX / 2 + (i - 1) * 30, h * 0.38 + 30, 10, 0, 7); ctx.fillStyle = i < balls ? '#e2e8f0' : 'rgba(255,255,255,0.15)'; ctx.fill(); }
                const rx = OX + TW * S + OX / 2;
                ctx.fillStyle = '#c4b5fd'; ctx.font = `700 ${fs}px Tahoma`; ctx.fillText('المضاعف', rx, h * 0.16);
                EDU.text(ctx, '×' + toAr(mult), rx, h * 0.16 + big, big, '#4ade80', '#166534');
                ctx.fillStyle = '#c4b5fd'; ctx.font = `700 ${fs}px Tahoma`; ctx.fillText('أعلى نتيجة', rx, h * 0.38);
                EDU.text(ctx, toAr(hi), rx, h * 0.38 + big * 0.9, big * 0.8, '#fb923c');
            } else {
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(OX, 0, TW * S, fs * 2.2);
                ctx.font = `700 ${fs}px Tahoma`; ctx.textAlign = 'right'; ctx.fillStyle = '#fde047'; ctx.fillText(toAr(score), OX + TW * S - 10, fs * 1.1);
                ctx.textAlign = 'center'; ctx.fillStyle = '#4ade80'; ctx.fillText('×' + toAr(mult), OX + TW * S / 2, fs * 1.1);
                ctx.textAlign = 'left'; ctx.fillStyle = '#e2e8f0'; ctx.fillText('● '.repeat(Math.max(0, balls)).trim(), OX + 10, fs * 1.1);
            }
            // مؤشرات الذراعين (قبضة اليد)
            const [fl, fr] = inputState();
            const iy = h - Math.max(60, h * 0.1), ir = Math.max(26, Math.min(OX * 0.34, 44));
            [[fl, OX * 0.5, 'يسار'], [fr, OX + TW * S + OX * 0.5, 'يمين']].forEach(([on, x, t]) => {
                if (OX < ir * 2.6) return;
                ctx.beginPath(); ctx.arc(x, iy, ir, 0, 7);
                ctx.fillStyle = on ? '#fde047' : 'rgba(255,255,255,0.1)'; ctx.fill();
                ctx.lineWidth = 3; ctx.strokeStyle = on ? '#fff' : 'rgba(255,255,255,0.3)'; ctx.stroke();
                EDU.text(ctx, on ? '✊' : '✋', x, iy, ir * 1.1, '#fff');
                ctx.font = `700 ${fs * 0.85}px Tahoma`; ctx.fillStyle = '#c4b5fd'; ctx.textAlign = 'center'; ctx.fillText(t, x, iy + ir + 16);
            });
            // نقاط اليدين على الشاشة
            if (cameraOK && now - handsT < 400) {
                hands.forEach((hd) => {
                    const side = hd.side;
                    if (side === undefined) return;
                    ctx.beginPath(); ctx.arc(hd.x * w, hd.y * h, 14, 0, 7);
                    ctx.fillStyle = fistState[side] ? 'rgba(253,224,71,0.9)' : 'rgba(94,234,212,0.55)'; ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                });
            }
            // الرسائل
            if (phase === 'WAIT' && waitT > 0.5) {
                const t = cameraOK ? '🚀 حرّك يدك بسرعة للأعلى لإطلاق الكرة' : '🚀 اضغط المسافة أو المس الشاشة للإطلاق';
                ctx.fillStyle = 'rgba(0,0,0,0.55)'; const bw = Math.min(w * 0.9, 560); ctx.fillRect(w / 2 - bw / 2, h * 0.5 - 24, bw, 48);
                EDU.text(ctx, t, w / 2, h * 0.5, Math.max(15, Math.min(w * 0.04, 24)), '#fde047');
            }
            if (toastT > 0) {
                toastT -= dt; ctx.globalAlpha = Math.min(1, toastT * 2);
                EDU.text(ctx, toast, w / 2, h * 0.3, Math.max(22, Math.min(w * 0.06, 42)), '#fff', '#a21caf'); ctx.globalAlpha = 1;
            }
        }

        function frame(now) {
            const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
            if (overlay.classList.contains('hidden')) {
                const [l, r] = inputState();
                if (l !== FLIPS[0].on) { FLIPS[0].on = l; if (l) GC.beep(150, 0.05, 'square', 0.08); }
                if (r !== FLIPS[1].on) { FLIPS[1].on = r; if (r) GC.beep(150, 0.05, 'square', 0.08); }
                if (phase === 'WAIT') waitT += dt;
                if (phase === 'PLAY') {
                    playT += dt; if (saveLeft > 0) saveLeft -= dt;
                    const sdt = dt / SUB;
                    for (let i = 0; i < SUB; i++) stepPhysics(sdt);
                    if (Math.hypot(ball.vx, ball.vy) < 25 && ball.y < 860) stillT += dt; else stillT = 0;
                    if (stillT > 4) { ball.vx = (Math.random() - 0.5) * 500; ball.vy = -400; stillT = 0; }
                    if (ball.y > TH + 20) drained();
                } else stepPhysics(dt / SUB);
            }
            draw(now, dt);
            requestAnimationFrame(frame);
        }

        /* ---------------- البدء ---------------- */
        const HELP = 'اقبض <b>يدك اليمنى</b> لتحريك الذراع اليمنى و<b>يدك اليسرى</b> لتحريك الذراع اليسرى. لإطلاق الكرة حرّك أي يد بسرعة للأعلى. اجمع النقاط ولا تدع الكرة تسقط!';
        function ready(msg) { loader.classList.add('hidden'); descEl.innerHTML = msg; startBtn.classList.remove('hidden'); buildLevels(); }
        (async function init() {
            buildLevels();
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { ready(HELP + '<br>الكاميرا غير متاحة — استخدم لوحة المفاتيح أو اللمس.'); return; }
            try { await EDU.startHands(video, onHands, 2); cameraOK = true; ready(HELP); }
            catch (e) { console.error(e); ready(HELP + '<br>تعذر تشغيل الكاميرا — استخدم لوحة المفاتيح (Z و M) أو اللمس.'); }
        })();
        requestAnimationFrame(frame);
    </script>
    <script src="remote-nav.js"></script>
</body>
</html>
